  <style>
    /* One box, the page's own. It is also the #dcGlobalBox the shared search
       code drives (global-search.js reads #dcSearch/#dcResults by id), so the
       bottom-sheet styling of global-search.css is undone here: the box sits
       in the page, never slides away, and the keyboard lift never moves it.
       Colours come from dc-theme.css tokens so dark mode is dark. */
    body{
      margin:0;
      font-family: "Vazirmatn", sans-serif;
      background:var(--bg);
      color:var(--txt);
    }
    .wrap{
      max-width: 48.75rem;
      margin: 0 auto;
      padding: 1.125rem 0.875rem 1.75rem;
    }
    body #dcGlobalBox.dc-global-filter-box.box{
      position:relative;
      inset:auto;
      z-index:auto;
      visibility:visible;
      opacity:1;
      transform:none !important;
      max-height:none !important;
      overflow:visible;
      transition:none;
      background:var(--card-bg);
      border:1px solid var(--card-border);
      border-radius: 1.125rem;
      box-shadow: var(--card-sh);
      padding: 1.125rem 1rem;
    }
    body #dcGlobalBox .title{
      font-weight: 900;
      font-size: 1.125rem;
      margin: 0.25rem 0 0.75rem;
      color:var(--ac);
      text-align:center;
    }
    body #dcGlobalBox .dc-search-input{
      width:100%;
      padding: 0.75rem 0.875rem;
      border-radius: 0.875rem;
      border: 1px solid var(--card-border);
      background: var(--surface);
      color: var(--txt);
      font-size: 0.875rem;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 0.75rem;
    }
    body #dcGlobalBox .dc-search-input:focus-visible{ outline:2px solid var(--ac); outline-offset:1px; }
    body #dcGlobalBox .dc-filter-list{
      display:flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    body #dcGlobalBox .dc-filter-btn{
      padding: 0.4375rem 0.875rem;
      border-radius: 62.4375rem;
      border: 1px solid var(--chip-bd);
      background: var(--chip-bg);
      color: var(--chip-txt);
      font-size: 0.8125rem;
      cursor: pointer;
      white-space: nowrap;
    }
    body #dcGlobalBox .dc-filter-btn.active{
      background: var(--ac);
      color:var(--txt-inv);
      border-color:var(--ac);
    }
    body #dcGlobalBox #dcResults.dc-results-box{
      margin-top: 0.625rem;
      padding: 0.625rem 0.625rem;
      border-radius: 1rem;
      background: var(--surface);
      border: 1px solid var(--card-border);
      max-height: 70vh;
      overflow:auto;
      position: relative;
    }
    body #dcGlobalBox #dcResults .dc-result-item{
      display:block;
      padding: 0.625rem 0.75rem;
      border-bottom: 1px solid var(--card-border);
      color:var(--txt);
      text-decoration:none;
      font-size:0.875rem;
      cursor:pointer;
    }
    body #dcGlobalBox #dcResults .dc-result-item:hover{ background:var(--chip-bg); }
    body #dcGlobalBox #dcResults .dc-no-results{ cursor:default; }
    body #dcGlobalBox #dcResults .dc-no-results:hover{ background:none; }

    body #dcGlobalBox .dc-close-results{
      position:absolute;
      top: 0.625rem;
      left: 0.625rem;
      right:auto;
      width: 1.75rem; height: 1.75rem;
      border:none;
      border-radius:50%;
      background:#fee2e2;
      color:#b91c1c;
      font-size:1.125rem;
      font-weight:700;
      line-height:1;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
  </style>

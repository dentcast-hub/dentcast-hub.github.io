<title>تیزر انتخاب رنگ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap">
<style>
/* Layout: one vertical 9:16 stage, a slim transport bar under it. Single light look (a clinic in daylight). */
@font-face{font-family:VazirLocal;font-weight:400;src:url(fonts/Vazirmatn-Regular.woff2) format("woff2")}
@font-face{font-family:VazirLocal;font-weight:600;src:url(fonts/Vazirmatn-SemiBold.woff2) format("woff2")}
@font-face{font-family:VazirLocal;font-weight:800;src:url(fonts/Vazirmatn-ExtraBold.woff2) format("woff2")}
@font-face{font-family:VazirLocal;font-weight:900;src:url(fonts/Vazirmatn-Black.woff2) format("woff2")}
:root{--ground:#e9eef7;--panel:#fff;--line:#cfd8ea;--ink:#16223f;--muted:#5b6a8c;--accent:#2f5bd3;--ui:Vazirmatn,VazirLocal,Tahoma,sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);padding-inline:16px;padding-block:20px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{height:min(80vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 30px 80px -40px #1c2b55}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;gap:12px;width:min(100%,calc(min(80vh,calc((100vw - 32px)*16/9))*9/16));direction:rtl}
.bar button{font:600 14px var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;flex:none}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar input{flex:1;min-width:0;accent-color:var(--accent);direction:ltr}
.bar output{font:400 13px var(--ui);color:var(--muted);font-variant-numeric:tabular-nums;flex:none;direction:ltr}
body.render{padding:0;display:block}
body.render .stage{height:1920px;width:1080px;border-radius:0;box-shadow:none}
body.render .bar{display:none}
</style>

<div class="stage"><canvas id="cv" width="1080" height="1920" aria-label="تیزر متحرک مقاله‌ی راهنمای انتخاب رنگ دندان در شیرهاب دنت‌کست"></canvas></div>
<div class="bar">
  <button id="play" type="button">توقف</button>
  <button id="again" type="button">از اول</button>
  <input id="scrub" type="range" min="0" max="24" step="0.01" value="0" aria-label="زمان">
  <output id="clock">0.0s</output>
</div>

<script>
const W=1080,H=1920,DUR=24;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const FF='Vazirmatn, VazirLocal, Tahoma, sans-serif';
const K={ink:'#16223f',inkS:'#5b6a8c',blue:'#2f5bd3',blueL:'#dfe8ff',red:'#e0573f',green:'#22a873',bulb:'#ffc93c',wall:'#f3f6fb',floor:'#e3e9f4'};

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const win=(t,a,b,f=.3)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,size,weight,color,alpha=1,align='center'){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px ${FF}`;ctx.fillStyle=color;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(s,x,y);ctx.restore()}
function pill(s,x,y,size,fg,bgc,stroke,alpha=1){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.font=`800 ${size}px ${FF}`;ctx.direction='rtl';
  const w=ctx.measureText(s).width+size*1.8,h=size*2.05;rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=bgc;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}ctx.restore();text(s,x,y+2,size,800,fg,alpha)}

/* ---------- the article's own images ---------- */
const IMGS={};['0','1','2','3','4','5'].forEach(k=>{const im=new Image();im.src=`img/share26-${k}.webp`;IMGS[k]=im});
function photo(key,cx,cy,w,h,lit,alpha=1){const im=IMGS[key];ctx.save();ctx.globalAlpha*=alpha;
  rr(cx-w/2,cy-h/2,w,h,18);ctx.fillStyle='#fff';ctx.shadowColor='rgba(22,34,63,.18)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;ctx.fill();ctx.shadowColor='transparent';
  ctx.save();rr(cx-w/2+10,cy-h/2+10,w-20,h-20,10);ctx.clip();
  if(im.complete&&im.naturalWidth){const s=Math.min((w-20)/im.naturalWidth,(h-20)/im.naturalHeight),iw=im.naturalWidth*s,ih=im.naturalHeight*s;
    if(lit<1){ctx.filter='grayscale(1) contrast(.85) brightness(1.08)';ctx.globalAlpha*=1;ctx.drawImage(im,cx-iw/2,cy-ih/2,iw,ih);ctx.filter='none'}
    if(lit>0){ctx.globalAlpha=alpha*lit;ctx.drawImage(im,cx-iw/2,cy-ih/2,iw,ih)}}
  ctx.restore();
  if(lit>0){ctx.globalAlpha=alpha*lit;rr(cx-w/2,cy-h/2,w,h,18);ctx.strokeStyle=K.bulb;ctx.lineWidth=5;ctx.stroke()}
  ctx.restore()}

/* ---------- the stick figure (dark ink on a light clinic) ---------- */
const BASE={ls:-.3,le:0,rs:.3,re:0,lh:-.13,lk:0,rh:.13,rk:0,lean:0,y:0};
function mix(a,b,u){const o={};for(const k in BASE)o[k]=lerp(a[k]||0,b[k]||0,u);return o}
const HOLD={...BASE,rs:1.75,re:-.35};                       // right arm out: shade tab / camera
const PHONE={...BASE,ls:-.55,le:1.6,rs:.55,re:-1.6};        // both hands in front
const FACEPALM={...BASE,rs:2.75,re:2.2,ls:-.4};             // hand to forehead
const CHEER={...BASE,rs:2.6,re:.1,ls:-2.6,le:-.1};
function walkPose(p){const s=Math.sin(p),c=Math.sin(p+Math.PI);
  return {...BASE,lh:-.08+.42*s,lk:-.5*Math.max(0,Math.sin(p+1.3)),rh:.08+.42*c,rk:-.5*Math.max(0,Math.sin(p+Math.PI+1.3)),ls:-.2-.4*s,le:-.35,rs:.2-.4*c,re:.35,y:-Math.abs(Math.cos(p))*5}}
function stick(x,y,s,P,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(P.lean||0);ctx.translate(0,P.y||0);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=K.ink;ctx.lineWidth=10;
  const hip=[0,-95],sh=[0,-152];
  const limb=(o0,a1,a2,len)=>{const m=[o0[0]+len*Math.sin(a1),o0[1]+len*Math.cos(a1)],e=[m[0]+len*Math.sin(a1+a2),m[1]+len*Math.cos(a1+a2)];
    ctx.beginPath();ctx.moveTo(...o0);ctx.lineTo(...m);ctx.lineTo(...e);ctx.stroke();return e};
  limb(hip,P.lh,P.lk,48);limb(hip,P.rh,P.rk,48);
  ctx.beginPath();ctx.moveTo(...hip);ctx.lineTo(0,-165);ctx.stroke();
  limb(sh,P.ls,P.le,42);const hand=limb(sh,P.rs,P.re,42);
  // white coat: two short lines from the shoulders
  ctx.save();ctx.strokeStyle='#9fb3dc';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-14,-150);ctx.lineTo(-20,-92);ctx.moveTo(14,-150);ctx.lineTo(20,-92);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(0,-195);ctx.rotate(o.tilt||0);
  ctx.beginPath();ctx.arc(0,0,27,0,6.283);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=9;ctx.stroke();
  const lk=o.look||0,ly=o.lookY||0;ctx.fillStyle=K.ink;ctx.lineWidth=4;
  [-9,9].forEach(e=>{ctx.beginPath();ctx.arc(e+lk*9,-2+ly,3.8,0,6.283);ctx.fill()});
  ctx.beginPath();
  if(o.face==='upset'){ctx.arc(lk*8,18,9,Math.PI+.4,-.4)}
  else if(o.face==='flat'){ctx.moveTo(-7+lk*8,12);ctx.lineTo(7+lk*8,12)}
  else if(o.face==='o'){ctx.arc(lk*8,12,5,0,6.283)}
  else ctx.arc(lk*8,6,10,.25,Math.PI-.25);
  ctx.stroke();
  if(o.bulb>0){ctx.save();ctx.globalAlpha*=clamp(o.bulb);const k=back(clamp(o.bulb))*(o.bs||1);ctx.translate(0,-72);ctx.scale(k,k);
    ctx.shadowColor=K.bulb;ctx.shadowBlur=40;ctx.beginPath();ctx.arc(0,0,22,0,6.283);ctx.fillStyle=K.bulb;ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#8a94ad';rr(-10,18,20,14,4);ctx.fill();
    ctx.strokeStyle=K.bulb;ctx.lineWidth=5;for(let i=0;i<7;i++){const a=-Math.PI/2+(i-3)*.42;ctx.beginPath();ctx.moveTo(Math.cos(a)*32,Math.sin(a)*32);ctx.lineTo(Math.cos(a)*46,Math.sin(a)*46);ctx.stroke()}
    ctx.restore()}
  ctx.restore();ctx.restore();
  return [x+hand[0]*s,y+(hand[1]+(P.y||0))*s];
}

/* ---------- teeth: the natural one, and a crown that is the wrong colour ---------- */
function toothPath(w,h){ctx.beginPath();ctx.moveTo(-w*.42,-h/2);ctx.quadraticCurveTo(0,-h/2-12,w*.42,-h/2);ctx.quadraticCurveTo(w*.56,0,w*.5,h*.38);
  ctx.quadraticCurveTo(w*.46,h/2+4,0,h/2+6);ctx.quadraticCurveTo(-w*.46,h/2+4,-w*.5,h*.38);ctx.quadraticCurveTo(-w*.56,0,-w*.42,-h/2);ctx.closePath()}
function tooth(x,y,s,kind){ctx.save();ctx.translate(x,y);ctx.scale(s,s);toothPath(120,170);
  if(kind==='natural'){const g=ctx.createLinearGradient(0,-90,0,90);g.addColorStop(0,'#e8d29e');g.addColorStop(.62,'#f1e4c3');g.addColorStop(1,'#cfdcec');ctx.fillStyle=g}
  else if(kind==='bad'){const g=ctx.createLinearGradient(0,-90,0,90);g.addColorStop(0,'#fbfbf7');g.addColorStop(1,'#eef0ee');ctx.fillStyle=g}
  else{const g=ctx.createLinearGradient(0,-90,0,90);g.addColorStop(0,'#e6d09b');g.addColorStop(.62,'#f0e2c0');g.addColorStop(1,'#cddaea');ctx.fillStyle=g}
  ctx.fill();ctx.strokeStyle='rgba(22,34,63,.45)';ctx.lineWidth=4;ctx.stroke();
  ctx.globalAlpha=.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-22,-30,9,28,-.15,0,6.283);ctx.fill();ctx.restore()}
function shadeTab(x,y,s,label='A2',rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle='#c9d2e3';rr(-10,-120,20,70,6);ctx.fill();
  toothPath(80,110);ctx.translate(0,0);const g=ctx.createLinearGradient(0,-55,0,55);g.addColorStop(0,'#e7d3a2');g.addColorStop(1,'#f2e6c8');ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(22,34,63,.4)';ctx.lineWidth=3;ctx.stroke();ctx.restore();text(label,x+Math.sin(rot)*-150*s,y-150*s,30*s/ .9,800,K.ink)}
function badge(x,y,ok,a){if(a<=0)return;ctx.save();ctx.globalAlpha*=clamp(a);const k=back(clamp(a));ctx.translate(x,y);ctx.scale(k,k);
  ctx.beginPath();ctx.arc(0,0,34,0,6.283);ctx.fillStyle=ok?K.green:K.red;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();
  if(ok){ctx.moveTo(-14,1);ctx.lineTo(-4,11);ctx.lineTo(15,-10)}else{ctx.moveTo(-11,-11);ctx.lineTo(11,11);ctx.moveTo(11,-11);ctx.lineTo(-11,11)}ctx.stroke();ctx.restore()}

/* ---------- the clinic ---------- */
function clinic(a){if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle=K.wall;ctx.fillRect(0,0,W,H);ctx.fillStyle=K.floor;ctx.fillRect(0,1650,W,270);
  ctx.strokeStyle='#d6dfef';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,1650);ctx.lineTo(W,1650);ctx.stroke();
  // window light
  ctx.fillStyle='#e4ecfa';rr(70,560,250,330,16);ctx.fill();ctx.strokeStyle='#d0dbef';ctx.lineWidth=6;ctx.stroke();ctx.beginPath();ctx.moveTo(195,560);ctx.lineTo(195,890);ctx.moveTo(70,725);ctx.lineTo(320,725);ctx.stroke();
  // dental chair
  ctx.fillStyle='#c8d4ea';rr(640,1450,330,60,30);ctx.fill();rr(890,1290,70,190,30);ctx.fill();rr(770,1510,40,140,10);ctx.fill();rr(700,1630,180,20,10);ctx.fill();
  // operating light
  ctx.strokeStyle='#b9c6df';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(1040,0);ctx.lineTo(1040,420);ctx.lineTo(900,560);ctx.stroke();
  ctx.fillStyle='#b9c6df';ctx.beginPath();ctx.ellipse(880,590,80,36,-.3,0,6.283);ctx.fill();
  ctx.restore()}
function bubble(cx,cy,r,a){ctx.save();ctx.globalAlpha*=a;ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.fillStyle='#fff';ctx.shadowColor='rgba(22,34,63,.15)';ctx.shadowBlur=40;ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#cfd8ea';ctx.lineWidth=4;ctx.stroke();ctx.restore()}

/* ---------- the reading road: three rows, six of the article's images ---------- */
const P=[];
function addLine(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/4);for(let i=1;i<=n;i++)P.push([lerp(x0,x1,i/n),lerp(y0,y1,i/n)])}
function addArc(cx,cy,r,a0,a1){const n=Math.ceil(Math.abs(a1-a0)*r/4);for(let i=1;i<=n;i++){const a=lerp(a0,a1,i/n);P.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}}
const RY=[1700,1290,880];
P.push([1000,RY[0]]);addLine(1000,RY[0],270,RY[0]);addArc(270,RY[0]-205,205,Math.PI/2,Math.PI*1.5);
addLine(270,RY[1],810,RY[1]);addArc(810,RY[1]-205,205,Math.PI/2,-Math.PI/2);addLine(810,RY[2],330,RY[2]);
const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
const TOTAL=L[L.length-1];
function at(d){d=clamp(d,0,TOTAL);let lo=0,hi=L.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(L[m]<d)lo=m;else hi=m}
  const f=(d-L[lo])/((L[hi]-L[lo])||1);return[lerp(P[lo][0],P[hi][0],f),lerp(P[lo][1],P[hi][1],f)]}
function nearestD(x,y){let b=0,bd=1e9;P.forEach((p,i)=>{const dd=(p[0]-x)**2+(p[1]-y)**2;if(dd<bd){bd=dd;b=i}});return L[b]}
// stops: image key, x, row, and the one line the article teaches there
// each stop is a realisation, not a recipe
const STOPS=[['0',760,0,'تکنسین بیمار رو نمی‌بینه؛ فقط عکس رو می‌بینه.'],['1',320,0,'نور همیشه سفید نیست.'],
             ['2',320,1,'بعضی نورها همه‌ی رنگ‌ها رو ندارن.'],['3',760,1,'دوربین هم رنگ رو عوض می‌کنه.'],
             ['5',540,2,'رنگ واقعی یه مرجع لازم داره.']]
  .map(([k,x,r,s])=>({k,x,y:RY[r],py:RY[r]-215,d:nearestD(x,RY[r]),s}));
// walking schedule: constant speed, a pause under every image
const WALK0=9.7,WALK1=15.6,PAUSE=.3;
const SPEED=TOTAL/((WALK1-WALK0)-PAUSE*STOPS.length);
STOPS.forEach((s,i)=>{s.arrive=WALK0+s.d/SPEED+i*PAUSE});
function walkD(t){if(t<WALK0)return 0;let tt=t-WALK0,d=0,prev=0;
  for(const s of STOPS){const leg=(s.d-prev)/SPEED;if(tt<leg)return prev+tt*SPEED;tt-=leg;if(tt<PAUSE)return s.d;tt-=PAUSE;prev=s.d}
  return Math.min(TOTAL,prev+tt*SPEED)}

/* ---------- one frame ---------- */
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';
  ctx.fillStyle=K.wall;ctx.fillRect(0,0,W,H);

  const inClinic=t<9.5||(t>=15.75&&t<20.5);
  const roadA=seg(t,9.3,9.7)*(1-seg(t,15.6,15.9));
  if(inClinic)clinic(1);
  if(roadA>0){ctx.save();ctx.globalAlpha=roadA;ctx.fillStyle='#f4f7fc';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(47,91,211,.06)';ctx.lineWidth=1;for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}

  /* --- hook (0–2.6): the clinical question, on frame one --- */
  if(t<2.6){
    const k=back(seg(t,0,.3));bubble(540,1080,330,1);
    tooth(430,1080,1.5,'natural');tooth(650,1080,1.5*(1-.04*Math.sin(t*20)*(1-seg(t,0,.5))),'bad');
    text('دندان بیمار',430,1270,30,600,K.inkS);text('روکش',650,1270,30,600,K.inkS);
    badge(735,940,false,seg(t,.5,.8));
    ctx.save();ctx.translate(540,300);ctx.scale(1.2-.2*k,1.2-.2*k);text('A2 سفارش دادی…',0,0,96,900,K.ink);ctx.restore();
    text('چرا روکش با دندون کناری جور نیست؟',540,430-12*(1-eo(seg(t,.45,.75))),58,800,K.red,seg(t,.45,.7));
    stick(200,1650,1.25,{...BASE,rs:2.75,re:2.0},{face:'upset',look:.6,tilt:.12});
  }

  /* --- the clinic, the slip, the crowns that come back --- */
  let hand=null;
  if(t>=2.6&&t<9.5){
    const ba=seg(t,2.6,2.9)*(1-seg(t,7.8,8.1));bubble(700,1020,280,ba);
    if(ba>0){ctx.save();ctx.globalAlpha=ba;tooth(600,1020,1.25,'natural');ctx.restore()}
    // the shade guide moment
    const tab=seg(t,2.8,3.1)*(1-seg(t,3.9,4.1));if(tab>0){ctx.save();ctx.globalAlpha=tab;shadeTab(790,1050,1.1);ctx.restore()}
    // three round trips: slip out as a paper plane, crown back in a box
    const trips=[[4.0,5.0],[5.9,6.6],[6.95,7.6]];
    let crown=null,xs=0;
    trips.forEach(([o,b],i)=>{
      const pu=seg(t,o,o+.5);if(pu>0&&pu<1){const x=lerp(560,1250,eio(pu)),y=lerp(1260,640,eio(pu))-Math.sin(pu*Math.PI)*120;
        ctx.save();ctx.translate(x,y);ctx.rotate(-.5);ctx.fillStyle='#fff';ctx.strokeStyle=K.ink;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-40,-20);ctx.lineTo(50,0);ctx.lineTo(-40,22);ctx.lineTo(-22,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
      const bu=seg(t,b-.45,b);if(t>=b-.45){const x=lerp(1250,850,eo(bu)),y=1560;
        if(t<(trips[i+1]?trips[i+1][0]:9)){ctx.save();ctx.translate(x,y);ctx.fillStyle='#f6e3c4';ctx.strokeStyle='#b78e55';ctx.lineWidth=4;rr(-70,-50,140,100,10);ctx.fill();ctx.stroke();
          ctx.beginPath();ctx.moveTo(-70,-12);ctx.lineTo(70,-12);ctx.stroke();text('LAB',0,20,28,800,'#8a6534');ctx.restore();
          if(t>=b){crown=i;xs=i}}}
    });
    if(crown!==null&&ba>0){const b=trips[crown][1];ctx.save();ctx.globalAlpha=ba;tooth(800,1020,1.25*back(seg(t,b,b+.25)),'bad');ctx.restore();badge(880,880,false,seg(t,b+.15,b+.35));
      if(crown>0)text(['','بار دوم','بار سوم'][crown],800,1210,34,800,K.red,seg(t,b+.1,b+.3))}
    // lab slip while writing
    const slip=seg(t,3.85,4.0)*(1-seg(t,4.0,4.15));if(t>3.6&&t<4.05){ctx.save();ctx.translate(560,1260);ctx.rotate(-.05);ctx.fillStyle='#fff';ctx.strokeStyle='#c4cee3';ctx.lineWidth=3;rr(-90,-60,180,120,8);ctx.fill();ctx.stroke();
      text('رنگ:',40,-25,24,600,K.inkS);text('A2',-20,15,44,900,K.blue,seg(t,3.65,3.8));ctx.restore()}
    // the figure
    let P0=BASE,o={face:'flat',look:.5};
    if(t<4.0)P0=mix(BASE,HOLD,eio(seg(t,2.7,3.0)));
    if(t>=4.0&&t<5.0){P0=mix(HOLD,BASE,eio(seg(t,4.0,4.3)));o.face='happy'}
    if(t>=5.0){o.face='upset';P0=mix(BASE,FACEPALM,eio(seg(t,5.2,5.5))*(1-seg(t,5.8,6.0))+eio(seg(t,7.2,7.4)))}
    if(t>=7.6){P0=mix(FACEPALM,PHONE,eio(seg(t,7.6,7.9)));o={face:'o',lookY:3}}
    stick(330,1650,1.45,P0,o);
    // phone: DentCast Share Hub, the real article
    const ph=eio(seg(t,7.9,8.4)),out=eio(seg(t,9.1,9.5));
    if(ph>0){ctx.save();ctx.globalAlpha=1-out;const cx=lerp(330,540,ph),cy=lerp(1400,980,ph),s=lerp(.12,1,ph)*(1+out*.5);ctx.translate(cx,cy);ctx.scale(s,s);
      rr(-340,-560,680,1120,60);ctx.fillStyle='#16223f';ctx.fill();rr(-318,-538,636,1076,44);ctx.fillStyle='#fff';ctx.fill();
      text('Share Hub',0,-470,34,800,K.blue);
      ctx.save();rr(-290,-420,580,266,18);ctx.clip();const im=IMGS['0'];if(im.complete)ctx.drawImage(im,-290,-420,580,266);ctx.restore();
      text('راهنمای انتخاب رنگ دندان:',270,-90,40,900,K.ink,1,'right');
      text('چطور رنگ رو درست',270,-35,40,900,K.ink,1,'right');text('به لابراتوار برسونیم',270,20,40,900,K.ink,1,'right');
      ctx.fillStyle='#e3e9f4';[100,150,200,250,300].forEach((y,i)=>{rr(-270,y,540-i%2*120,18,9);ctx.fill()});
      const pr=seg(t,8.75,8.85)*(1-seg(t,8.85,9.0));rr(-200,380,400,90,45);ctx.fillStyle=K.blue;ctx.fill();text('خواندن',0,427,36,800,'#fff');
      ctx.restore();
      const f=eio(seg(t,8.4,8.75));if(t>8.4&&t<9.1){ctx.beginPath();ctx.arc(lerp(760,540,f),lerp(1600,1410,f),30,0,6.283);ctx.fillStyle='rgba(22,34,63,.35)';ctx.fill()}
      const rp=seg(t,8.8,9.3);if(rp>0&&rp<1){ctx.beginPath();ctx.arc(540,1405,lerp(20,300,eo(rp)),0,6.283);ctx.strokeStyle=`rgba(47,91,211,${1-rp})`;ctx.lineWidth=6;ctx.stroke()}}
  }

  /* --- the reading road: grey images turn to colour as he reads them --- */
  if(roadA>0){ctx.save();ctx.globalAlpha=roadA;
    const d=walkD(t),draw=eio(seg(t,9.3,10.0));
    ctx.lineCap='round';ctx.lineJoin='round';const n=Math.floor(P.length*draw);
    ctx.strokeStyle='#d7e0f1';ctx.lineWidth=22;ctx.beginPath();for(let i=0;i<n;i++)i?ctx.lineTo(...P[i]):ctx.moveTo(...P[i]);ctx.stroke();
    if(d>0){ctx.strokeStyle=K.blue;ctx.lineWidth=12;ctx.beginPath();for(let i=0;i<P.length&&L[i]<=d;i++)i?ctx.lineTo(...P[i]):ctx.moveTo(...P[i]);ctx.stroke()}
    let current=null;
    STOPS.forEach((s,i)=>{const app=eo(seg(t,9.4+i*.08,9.8+i*.08));const lit=seg(t,s.arrive,s.arrive+.3),pop=lit*(1-seg(t,s.arrive+.45,s.arrive+.8));
      photo(s.k,s.x,s.py-(1-app)*40,410*(1+.07*pop),230*(1+.07*pop),lit,app);
      if(t>=s.arrive)current=s});
    const[px,py]=at(d);const moving=d>0&&!STOPS.some(s=>t>=s.arrive&&t<s.arrive+PAUSE)&&t<WALK1;
    const reached=STOPS.filter(s=>t>=s.arrive).length,lastArr=current?current.arrive:-9,pulse=seg(t,lastArr,lastArr+.12)*(1-seg(t,lastArr+.12,lastArr+.5));
    stick(px,py-6,.56,moving?walkPose(d/30):BASE,{face:reached?'happy':'flat',bulb:reached?1:0,bs:.55+.13*reached+.25*pulse});
    // the line the article teaches at this stop
    if(current){const a=seg(t,current.arrive,current.arrive+.2);pill(current.s,540,300,40,K.ink,'#fff','#cfd8ea',a)}
    else text('می‌خونه…',540,300,56,900,K.ink,seg(t,9.6,9.9));
    ctx.restore()}

  /* --- awareness: the same clinic, now he sees what touches the colour --- */
  if(t>=15.75&&t<20.5){
    const ba=seg(t,15.8,16.1);bubble(700,1020,280,ba);
    ctx.save();ctx.globalAlpha=ba;tooth(620,1020,1.4,'natural');ctx.restore();
    // the technician's screen
    ctx.save();ctx.globalAlpha=seg(t,15.8,16.1);ctx.fillStyle='#16223f';rr(70,1170,170,110,10);ctx.fill();ctx.fillStyle='#c9b98f';rr(82,1182,146,86,6);ctx.fill();
    ctx.fillStyle='#c4cee3';rr(145,1280,20,40,4);ctx.fill();rr(110,1318,90,10,5);ctx.fill();ctx.restore();
    const look=[[16.3,-.8],[16.8,-.8],[17.3,.9],[17.8,.9],[18.3,-.6],[18.8,.6]].filter(([a])=>t>=a).pop();
    const P0=mix(BASE,HOLD,eio(seg(t,17.9,18.2)));
    stick(330,1650,1.45,P0,{face:t>19.3?'happy':'o',look:look?look[1]:0,lookY:-2,bulb:1,bs:1.2+.08*Math.sin(t*6)});
    if(t>18.0){const hx=330+1.45*78,hy=1650-1.45*150;ctx.save();ctx.globalAlpha=seg(t,18.0,18.2);ctx.fillStyle=K.ink;rr(hx-6,hy-40,74,50,10);ctx.fill();ctx.beginPath();ctx.arc(hx+31,hy-15,15,0,6.283);ctx.fillStyle='#9fb3dc';ctx.fill();ctx.restore()}
    // what he notices, one after another
    const NOTE=[[16.3,'نور پنجره',195,505,195,560],[16.8,'نور یونیت: زرد یا آبی؟',760,455,870,560],[17.3,'شفافیت لبه',860,1140,660,1110],
                [17.8,'ولیو: روشنی، نه فقط رنگ',830,880,650,960],[18.3,'وایت بالانس دوربین',540,1280,470,1390],[18.8,'مانیتور تکنسین',155,1110,155,1170]];
    NOTE.forEach(([a,s_,lx,ly,tx,ty])=>{const u=seg(t,a,a+.25);if(u<=0)return;
      ctx.save();ctx.globalAlpha=u;ctx.strokeStyle=K.blue;ctx.lineWidth=3;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(lx,ly+22);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(tx,ty,9,0,6.283);ctx.fillStyle=K.blue;ctx.fill();
      const ring=seg(t,a,a+.6);if(ring<1){ctx.beginPath();ctx.arc(tx,ty,lerp(9,46,ring),0,6.283);ctx.strokeStyle=`rgba(47,91,211,${1-ring})`;ctx.lineWidth=4;ctx.stroke()}
      ctx.restore();
      ctx.save();ctx.translate(lx,ly);ctx.scale(back(u),back(u));pill(s_,0,0,28,K.ink,'#fff',K.blue,1);ctx.restore()});
  }

  /* --- captions --- */
  [[2.75,3.95,'A2. همین.',70],[4.0,5.85,'روکش برگشت. رنگش جور نبود.',62],[5.9,7.65,'دوباره… و دوباره.',70],[7.75,9.2,'یه مطلب تو دنت‌کست…',66],
   [15.9,18.1,'حالا چیزهایی رو می‌بینه که قبلاً نمی‌دید.',52],[18.2,20.4,'رنگ، فقط A2 نیست.',72]]
   .forEach(([a,b,s,size])=>{const al=win(t,a,b,.25);if(al<=0)return;text(s,540,300-8*(1-eo(seg(t,a,a+.3))),size,900,K.ink,al)});
  if(t>2.6&&t<20.5)text('دنت‌کست',540,130,38,800,K.blue,.55);

  /* --- end card --- */
  const endA=seg(t,20.5,21.1);
  if(endA>0){ctx.save();ctx.globalAlpha=endA;ctx.fillStyle='#f4f7fc';ctx.fillRect(0,0,W,H);
    const rg=ctx.createRadialGradient(540,850,30,540,850,800);rg.addColorStop(0,'rgba(47,91,211,.12)');rg.addColorStop(1,'rgba(47,91,211,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    const u0=eo(seg(t,20.7,21.4));photo('0',540,600+30*(1-u0),640,300,1,u0);
    const u=eo(seg(t,21.1,21.8));
    pill('Share Hub',540,830,32,K.blue,'#fff','#cfd8ea',u);
    text('راهنمای انتخاب رنگ دندان',540,960+20*(1-u),76,900,K.ink,u);
    text('چطور رنگ رو درست به لابراتوار برسونیم',540,1060+20*(1-u),46,800,K.inkS,u);
    text('در دنت‌کست',540,1210,40,600,K.blue,eo(seg(t,21.7,22.2)));
    text('dentcast.ir',540,1700,46,600,K.inkS,eo(seg(t,22.1,22.6)));
    ctx.restore()}
}

/* ---------- transport ---------- */
const playBtn=document.getElementById('play'),scrub=document.getElementById('scrub'),clock=document.getElementById('clock');
let t=0,playing=true,last=null;
if(matchMedia('(prefers-reduced-motion: reduce)').matches){t=23;playing=false}
function show(){render(t);scrub.value=t;clock.textContent=t.toFixed(1)+'s';playBtn.textContent=playing?'توقف':'پخش'}
function loop(now){if(playing){if(last!=null)t+=(now-last)/1000;if(t>DUR+1)t=0}last=now;show();requestAnimationFrame(loop)}
playBtn.onclick=()=>{playing=!playing;last=null;show()};
document.getElementById('again').onclick=()=>{t=0;playing=true;last=null};
scrub.oninput=()=>{t=+scrub.value;playing=false;show()};
window.renderAt=x=>render(x);
const imgReady=Object.values(IMGS).map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve());
Promise.all([...imgReady,...['400','600','800','900'].flatMap(w=>[document.fonts.load(`${w} 40px Vazirmatn`),document.fonts.load(`${w} 40px VazirLocal`)]).map(p=>p.catch(()=>{}))])
  .then(()=>{window.__ready=true;if(location.hash==='#render'){document.body.classList.add('render');render(0)}else requestAnimationFrame(loop)});
</script>

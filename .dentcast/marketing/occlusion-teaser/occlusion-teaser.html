<title>تیزر مسیر اکلوژن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap">
<style>
/* Layout: one vertical 9:16 stage, a slim transport bar under it. Single dark look, the brand navy. */
@font-face{font-family:VazirLocal;font-weight:400;src:url(fonts/Vazirmatn-Regular.woff2) format("woff2")}
@font-face{font-family:VazirLocal;font-weight:600;src:url(fonts/Vazirmatn-SemiBold.woff2) format("woff2")}
@font-face{font-family:VazirLocal;font-weight:800;src:url(fonts/Vazirmatn-ExtraBold.woff2) format("woff2")}
@font-face{font-family:VazirLocal;font-weight:900;src:url(fonts/Vazirmatn-Black.woff2) format("woff2")}
:root{
  --ground:#030b1d; --panel:#0b1a38; --line:#1f3566; --ink:#e6edff; --muted:#8fa3cf; --accent:#7ea6ff;
  --ui:Vazirmatn,VazirLocal,Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);padding-inline:16px;padding-block:20px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{height:min(80vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 30px 80px -30px #000}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;gap:12px;width:min(100%,calc(min(80vh,calc((100vw - 32px)*16/9))*9/16));direction:rtl}
.bar button{font:600 14px var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;cursor:pointer;flex:none}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar input{flex:1;min-width:0;accent-color:var(--accent);direction:ltr}
.bar output{font:400 13px var(--ui);color:var(--muted);font-variant-numeric:tabular-nums;flex:none;direction:ltr}
body.render{padding:0;display:block}
body.render .stage{height:1920px;width:1080px;border-radius:0;box-shadow:none}
body.render .bar{display:none}
</style>

<div class="stage"><canvas id="cv" width="1080" height="1920" aria-label="تیزر متحرک مسیر یادگیری اکلوژن در دنت‌کست"></canvas></div>
<div class="bar">
  <button id="play" type="button">توقف</button>
  <button id="again" type="button">از اول</button>
  <input id="scrub" type="range" min="0" max="22" step="0.01" value="0" aria-label="زمان">
  <output id="clock">0.0s</output>
</div>

<script>
const W=1080,H=1920,DUR=22;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const FF='Vazirmatn, VazirLocal, Tahoma, sans-serif';
const K={ink:'#eaf0ff',blue:'#4f7fff',blueL:'#9dbcff',navy:'#0d2550',amber:'#e3b849',green:'#34c38f',bgA:'#030b1d',bgB:'#0b2a63'};

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const win=(t,a,b,f=.35)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,size,weight,color,alpha=1,align='center'){ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px ${FF}`;ctx.fillStyle=color;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(s,x,y);ctx.restore()}

/* ---------- the serpentine road (right-to-left first, like the reading direction) ---------- */
const ROWS=[1650,1350,1050,750],XL=240,XR=840;
const P=[];
function addLine(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/4);for(let i=1;i<=n;i++)P.push([lerp(x0,x1,i/n),lerp(y0,y1,i/n)])}
function addArc(cx,cy,r,a0,a1){const n=Math.ceil(Math.abs(a1-a0)*r/4);for(let i=1;i<=n;i++){const a=lerp(a0,a1,i/n);P.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}}
P.push([930,ROWS[0]]);
addLine(930,ROWS[0],XL,ROWS[0]); addArc(XL,ROWS[0]-150,150,Math.PI/2,Math.PI*1.5);
addLine(XL,ROWS[1],XR,ROWS[1]);  addArc(XR,ROWS[1]-150,150,Math.PI/2,-Math.PI/2);
addLine(XR,ROWS[2],XL,ROWS[2]);  addArc(XL,ROWS[2]-150,150,Math.PI/2,Math.PI*1.5);
addLine(XL,ROWS[3],900,ROWS[3]);
const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
const TOTAL=L[L.length-1];
function at(d){d=clamp(d,0,TOTAL);let lo=0,hi=L.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(L[m]<d)lo=m;else hi=m}
  const f=(d-L[lo])/((L[hi]-L[lo])||1);return[lerp(P[lo][0],P[hi][0],f),lerp(P[lo][1],P[hi][1],f)]}
function nearestD(x,y){let b=0,bd=1e9;P.forEach((p,i)=>{const dd=(p[0]-x)**2+(p[1]-y)**2;if(dd<bd){bd=dd;b=i}});return L[b]}

/* ---------- 16 cards: chaos orbit -> a tile under the road ---------- */
const XS=[820,633,447,260];
const CARDS=[];
for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  const x=r%2===0?XS[c]:XS[3-c],y=ROWS[r];
  CARDS.push({nx:x,ny:y+82,nd:nearestD(x,y),
    rx:110+R()*300,ry:150+R()*290,a0:R()*6.283,w:(R()<.5?-1:1)*(.35+R()*.5),
    rot0:(R()-.5)*1.2,rw:(R()-.5)*1.6,hue:[205,220,190,250,170,30,330][Math.floor(R()*7)],
    lines:[.55+R()*.4,.35+R()*.5,.5+R()*.35],dot:R()<.5,born:.35+(CARDS.length)*.085,wob:R()*6.283});
}
const ORDER=CARDS.map((c,i)=>i).sort(()=>R()-.5);   // they settle in a shuffled order, not row by row
ORDER.forEach((ci,k)=>CARDS[ci].settle=9.7+k*.07);

/* tangled scribble: what "no path" looks like */
const SC=[];{let px=540,py=860;for(let i=0;i<80;i++){const a=R()*6.283,r=R();px=540+Math.cos(a)*420*Math.sqrt(r);py=860+Math.sin(a)*470*Math.sqrt(r);SC.push([px,py])}}
const SCD=[];for(let i=0;i<SC.length-1;i++){const p0=SC[Math.max(0,i-1)],p1=SC[i],p2=SC[i+1],p3=SC[Math.min(SC.length-1,i+2)];
  for(let s=0;s<12;s++){const u=s/12,u2=u*u,u3=u2*u;SCD.push([
    .5*(2*p1[0]+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
    .5*(2*p1[1]+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)])}}

/* chaos clock: speeds up while lost, coasts to a stop at the decision */
function tau(t){if(t<7)return t+.09*t*t;const v=1+.18*7;return 7+.09*49+v*(1-Math.exp(-(t-7)))}

function chaosPos(c,t){const T=tau(t),a=c.a0+c.w*T;
  return[540+c.rx*Math.cos(a)+Math.sin(T*1.7+c.wob)*18, 860+c.ry*Math.sin(a)+Math.cos(T*1.3+c.wob)*18, c.rot0+c.rw*T*.6]}

/* ---------- the figure ---------- */
function figure(x,y,s,o){
  const ph=o.phone||0,up=o.up||0,wa=o.walk||0,p=o.phase||0,look=o.look||0,mood=o.mood||0;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=K.ink;ctx.lineWidth=10;
  const hip=[0,-95],neck=[0,-165],sh=[0,-150];
  // legs
  [1,-1].forEach(k=>{const sw=wa*Math.sin(p+(k>0?0:Math.PI))*.55, a=k*.13+sw;
    const knee=[hip[0]+48*Math.sin(a),hip[1]+48*Math.cos(a)];
    const lift=wa*Math.max(0,Math.sin(p+(k>0?0:Math.PI)+.9))*.7, a2=a-lift*(a>0?1:-1)*.2-lift*.35*k*0;
    const foot=[knee[0]+48*Math.sin(a2*.6),knee[1]+48*Math.cos(a2*.6)-lift*10];
    ctx.beginPath();ctx.moveTo(...hip);ctx.lineTo(...knee);ctx.lineTo(...foot);ctx.stroke()});
  ctx.beginPath();ctx.moveTo(...hip);ctx.lineTo(...neck);ctx.stroke();
  // arms: rest (+walk swing) -> phone -> raised (right arm only)
  [1,-1].forEach(k=>{const sw=wa*Math.sin(p+(k>0?Math.PI:0))*.5, b=k*.28+sw;
    let el=[sh[0]+42*Math.sin(b),sh[1]+42*Math.cos(b)], ha=[el[0]+42*Math.sin(b*.7),el[1]+42*Math.cos(b*.7)];
    const pe=[k*34,-112],phd=[k*11,-128];
    el=[lerp(el[0],pe[0],ph),lerp(el[1],pe[1],ph)];ha=[lerp(ha[0],phd[0],ph),lerp(ha[1],phd[1],ph)];
    if(k>0&&up>0){el=[lerp(el[0],38,up),lerp(el[1],-190,up)];ha=[lerp(ha[0],62,up),lerp(ha[1],-238,up)]}
    ctx.beginPath();ctx.moveTo(...sh);ctx.lineTo(...el);ctx.lineTo(...ha);ctx.stroke()});
  if(ph>.02){ctx.save();ctx.globalAlpha*=ph;ctx.translate(0,-140);ctx.rotate(-.08);
    rr(-19,-30,38,58,7);ctx.fillStyle='#16244a';ctx.fill();ctx.lineWidth=4;ctx.stroke();
    rr(-13,-23,26,42,4);ctx.fillStyle=`rgba(157,188,255,${.55+.35*(o.glow||0)})`;ctx.fill();ctx.restore()}
  // head
  ctx.save();ctx.translate(0,-195);ctx.rotate((o.tilt||0));
  ctx.beginPath();ctx.arc(0,0,27,0,6.283);ctx.fillStyle=K.bgA;ctx.fill();ctx.lineWidth=9;ctx.stroke();
  ctx.fillStyle=K.ink;const ey=ph>.5&&!up?3:-2;
  [-9,9].forEach(e=>{ctx.beginPath();ctx.arc(e+look*9,ey,3.8,0,6.283);ctx.fill()});
  ctx.lineWidth=4;
  if(mood<1){ctx.globalAlpha=1-mood;ctx.beginPath();const mx=look*8;ctx.moveTo(mx-9,13);ctx.lineTo(mx-4,9);ctx.lineTo(mx+1,14);ctx.lineTo(mx+6,9);ctx.lineTo(mx+10,12);ctx.stroke()}
  if(mood>0){ctx.globalAlpha=mood;ctx.beginPath();ctx.arc(look*8,6,10,.25,Math.PI-.25);ctx.stroke()}
  ctx.restore();
  ctx.restore();
}

/* ---------- a content card (abstract on purpose: nothing of the pathway is spoiled) ---------- */
function card(c,x,y,rot,sc,alpha,order,lit){
  const w=170*sc,h=110*sc;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(rot);
  const tint=`hsla(${c.hue},70%,68%,`;
  rr(-w/2,-h/2,w,h,16*sc);
  ctx.fillStyle=order<1?`hsla(${c.hue},45%,${lerp(22,14,order)}%,.92)`:'#0f2552';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=lit>0?`rgba(157,188,255,${.5+.5*lit})`:order>.5?'rgba(120,150,220,.45)':tint+'.55)';ctx.stroke();
  if(lit>0){ctx.save();ctx.globalAlpha*=lit*.35;ctx.shadowColor=K.blueL;ctx.shadowBlur=30;ctx.stroke();ctx.restore()}
  const lc=lit>0?`rgba(200,218,255,${.55+.35*lit})`:order>.5?'rgba(150,175,230,.38)':tint+'.6)';
  ctx.fillStyle=lc;
  ctx.beginPath();ctx.arc(w/2-24*sc,-h/2+24*sc,10*sc,0,6.283);ctx.fill();
  c.lines.forEach((f,i)=>{const lw=(w-60*sc)*f;rr(w/2-44*sc-lw,-h/2+(18+i*24)*sc,lw,9*sc,4.5*sc);ctx.fill()});
  if(lit>0){ctx.save();const k=back(clamp(lit));ctx.translate(-w/2+26*sc,h/2-24*sc);ctx.scale(k,k);
    ctx.beginPath();ctx.arc(0,0,17,0,6.283);ctx.fillStyle=K.blue;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-2,6);ctx.lineTo(8,-6);ctx.stroke();ctx.restore()}
  ctx.restore();
}

/* ---------- captions ---------- */
const CAPS=[
  [0.5,3.3,'این همه مقاله، اپیزود، نکته…',62],
  [3.5,6.9,'از کجا شروع کنم؟',88],
  [9.9,12.2,'مسیر باز می‌شود',76],
  [12.4,14.8,'به ترتیب. قدم به قدم.',70],
  [15.0,17.1,'حالا راه را می‌شناسی',70],
];

function bg(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,K.bgA);g.addColorStop(1,K.bgB);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // calm grid that only becomes legible once there is a path
  const ord=seg(t,9.6,11.5);ctx.save();ctx.globalAlpha=.05+.07*ord;ctx.strokeStyle='#8fb0ff';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.restore();
  const rg=ctx.createRadialGradient(540,860,40,540,860,900);rg.addColorStop(0,`rgba(79,127,255,${.16+.1*ord})`);rg.addColorStop(1,'rgba(79,127,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
}

function vignette(){const v=ctx.createRadialGradient(540,960,600,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}

/* ---------- one frame ---------- */
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';
  bg(t);
  const endA=seg(t,19.1,19.7);
  if(endA<1){
  ctx.save();
  // camera shake while lost
  const sh=seg(t,2.5,6.8)*(1-seg(t,6.8,7.3))*9;
  ctx.translate(Math.sin(t*41)*sh,Math.cos(t*33)*sh*.7);

  // scribble
  const sa=(1-seg(t,9.6,10.4))*seg(t,1.2,1.8);
  if(sa>0){const n=Math.floor(SCD.length*eo(seg(t,1.3,7.2)));ctx.save();ctx.globalAlpha=.32*sa;ctx.strokeStyle=K.blueL;ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<n;i++)i?ctx.lineTo(...SCD[i]):ctx.moveTo(...SCD[i]);ctx.stroke();ctx.restore()}

  // road
  const draw=eio(seg(t,10.0,11.6));
  const walkD=TOTAL*eio(seg(t,11.7,16.9));
  if(draw>0){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    const n=Math.floor(P.length*draw);
    ctx.strokeStyle='rgba(120,150,220,.28)';ctx.lineWidth=22;ctx.beginPath();for(let i=0;i<n;i++)i?ctx.lineTo(...P[i]):ctx.moveTo(...P[i]);ctx.stroke();
    ctx.setLineDash([2,26]);ctx.strokeStyle='rgba(200,215,255,.5)';ctx.lineWidth=5;ctx.stroke();ctx.setLineDash([]);
    if(walkD>0){ctx.strokeStyle=K.blue;ctx.lineWidth=12;ctx.shadowColor=K.blue;ctx.shadowBlur=24;ctx.beginPath();
      for(let i=0;i<P.length&&L[i]<=walkD;i++)i?ctx.lineTo(...P[i]):ctx.moveTo(...P[i]);ctx.stroke()}
    ctx.restore();
    // the goal flag at the end of the road
    const fa=seg(t,11.2,11.7),arrived=seg(t,16.9,17.3);
    if(fa>0){ctx.save();ctx.globalAlpha=fa;ctx.translate(930,750);ctx.strokeStyle=K.ink;ctx.lineWidth=6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,-150);ctx.stroke();
      const wv=Math.sin(t*6)*6;ctx.beginPath();ctx.moveTo(0,-150);ctx.quadraticCurveTo(-45,-150+wv,-90,-138);ctx.lineTo(-90,-88);ctx.quadraticCurveTo(-45,-100-wv,0,-98);ctx.closePath();
      ctx.fillStyle=arrived>0?`rgb(${lerp(79,52,arrived)},${lerp(127,195,arrived)},${lerp(255,143,arrived)})`:K.blue;ctx.fill();
      ctx.restore();text('آزمون',885,750-120,26,800,'#fff',fa)}
  }

  // cards
  const dim=seg(t,7.0,7.5)*(1-seg(t,9.4,9.8));
  CARDS.forEach(c=>{
    const born=eo(seg(t,c.born,c.born+.7));if(born<=0)return;
    let [x,y,r]=chaosPos(c,t);
    x=lerp(540,x,born);y=lerp(1475,y,born);
    const sc0=lerp(.2,1,born);
    const m=back(seg(t,c.settle,c.settle+.9));
    const fx=lerp(x,c.nx,m),fy=lerp(y,c.ny,m),fr=lerp(r,0,clamp(m)),fs=lerp(sc0,.82,clamp(m));
    const lit=walkD>0?clamp((walkD-c.nd+20)/140):0;
    if(dim>0&&m<=0){ctx.save();ctx.filter=`blur(${dim*5}px)`;card(c,fx,fy,fr,fs,1-dim*.6,clamp(m),0);ctx.restore()}
    else card(c,fx,fy,fr,fs,1,clamp(m),lit);
  });
  if(dim>0){ctx.fillStyle=`rgba(3,11,29,${dim*.55})`;ctx.fillRect(-20,-20,W+40,H+40)}

  // the figure
  const mv=eio(seg(t,9.7,11.4));
  let fx=lerp(540,930,mv),fy=lerp(1640,1650,mv),fs=lerp(1.25,.5,mv);
  const walking=seg(t,11.7,11.9)*(1-seg(t,16.8,17.0));
  if(t>11.6){const[px,py]=at(walkD);fx=px;fy=py-6}
  const lost=seg(t,2.2,2.6)*(1-seg(t,7.0,7.4));
  const look=lost*Math.sin(t*5.2)*(.6+.4*Math.sin(t*1.7));
  figure(fx,fy,fs,{
    phone:1-seg(t,9.0,9.6), glow:.5+.5*Math.sin(t*9),
    look:look, tilt:lost*.18*Math.sin(t*2.3),
    mood:seg(t,8.7,9.1),
    walk:walking, phase:walkD/34,
    up:Math.max(seg(t,8.8,9.0)*(1-seg(t,9.5,9.8)), seg(t,16.9,17.2))
  });

  // question marks popping out of the head
  [[2.2,-70],[3.0,60],[3.7,-20],[4.4,85],[5.0,-95],[5.6,30],[6.2,-50]].forEach(([s0,dx],i)=>{
    const u=seg(t,s0,s0+1.8);if(u<=0||u>=1)return;
    const k=back(seg(t,s0,s0+.35));ctx.save();ctx.translate(540+dx,1640-300-u*170);ctx.scale(k,k);ctx.rotate((i%2?.2:-.2));
    text('؟',0,0,90+i*6,900,i%3===0?K.blueL:K.ink,1-seg(u,.6,1));ctx.restore()});

  ctx.restore(); // end shake

  // ---- the decision: enrol ----
  const ca=seg(t,7.2,7.75),cout=seg(t,9.2,9.6);
  if(ca>0&&cout<1){
    ctx.save();const k=back(ca)*(1-.3*eio(cout));ctx.globalAlpha=1-cout;
    ctx.translate(540,lerp(880,1300,eio(cout)));ctx.scale(k,k);
    rr(-400,-200,800,400,44);const g=ctx.createLinearGradient(0,-200,0,200);g.addColorStop(0,'#1d4bb8');g.addColorStop(1,'#10307a');
    ctx.fillStyle=g;ctx.shadowColor='rgba(79,127,255,.55)';ctx.shadowBlur=70;ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(157,188,255,.6)';ctx.lineWidth=3;ctx.stroke();
    text('مسیر یادگیری',0,-118,36,600,'#c7d7ff');
    text('اکلوژن',0,-46,92,900,'#fff');
    const pressed=seg(t,8.5,8.62)*(1-seg(t,8.62,8.8));const done=seg(t,8.62,8.75);
    ctx.save();ctx.translate(0,110);ctx.scale(1-pressed*.07,1-pressed*.07);
    rr(-230,-50,460,100,50);ctx.fillStyle=done>0?`rgb(${lerp(255,52,done)},${lerp(255,195,done)},${lerp(255,143,done)})`:'#fff';ctx.fill();
    text(done>.5?'ثبت شد ✓':'ثبت‌نام',0,2,44,800,done>.5?'#fff':'#10307a');
    ctx.restore();
    // ripple
    const rp=seg(t,8.6,9.3);if(rp>0&&rp<1){ctx.beginPath();ctx.arc(0,110,lerp(20,420,eo(rp)),0,6.283);ctx.strokeStyle=`rgba(255,255,255,${(1-rp)*.7})`;ctx.lineWidth=6;ctx.stroke()}
    // finger
    const fm=eio(seg(t,7.85,8.5));if(fm>0&&t<9.0){const hx=lerp(330,40,fm),hy=lerp(330,135,fm);
      ctx.beginPath();ctx.arc(hx,hy,34-pressed*8,0,6.283);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill();
      ctx.beginPath();ctx.arc(hx,hy,48,0,6.283);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=4;ctx.stroke()}
    ctx.restore();
  }
  // the light that opens the road
  const fl=seg(t,9.25,9.55)*(1-seg(t,9.55,10.3));
  if(fl>0){const rg=ctx.createRadialGradient(540,1300,10,540,1300,1100);rg.addColorStop(0,`rgba(200,220,255,${.55*fl})`);rg.addColorStop(1,'rgba(200,220,255,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H)}

  // ---- the end of the road: exam -> certificate ----
  const ce=seg(t,17.2,17.8),cx=seg(t,18.8,19.2);
  if(ce>0){ctx.fillStyle=`rgba(3,11,29,${.6*ce})`;ctx.fillRect(0,0,W,H);
    ctx.save();const k=back(ce)*(1+.04*cx);ctx.globalAlpha=1-cx;ctx.translate(540,930);ctx.scale(k,k);ctx.rotate(lerp(-.05,0,eo(ce)));
    rr(-380,-250,760,500,22);ctx.fillStyle='#fbfcff';ctx.shadowColor='rgba(52,195,143,.45)';ctx.shadowBlur=80;ctx.fill();ctx.shadowBlur=0;
    text('گواهی تکمیل مسیر',300,-170,34,600,'#5b6b8f',1,'right');
    text('اکلوژن',300,-60,96,900,'#0b1f4d',1,'right');
    ctx.fillStyle='#d9e2f5';rr(-300,40,600,6,3);ctx.fill();
    text('مسیر خوانده شد · آزمون پایانی گذرانده شد',300,105,30,600,'#4a5a80',1,'right');
    const tk=back(seg(t,17.6,18.0));ctx.save();ctx.translate(-260,-120);ctx.scale(tk,tk);
    ctx.beginPath();ctx.arc(0,0,62,0,6.283);ctx.fillStyle=K.green;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=11;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-25,2);ctx.lineTo(-7,20);ctx.lineTo(27,-18);ctx.stroke();ctx.restore();
    ctx.restore();
    // sparks
    for(let i=0;i<26;i++){const a=i/26*6.283+i,u=seg(t,17.5,18.9);if(u<=0||u>=1)continue;const d=lerp(260,620,eo(u))*(.7+.3*Math.sin(i*7));
      ctx.beginPath();ctx.arc(540+Math.cos(a)*d,930+Math.sin(a)*d*.85,6+3*(i%3),0,6.283);ctx.fillStyle=i%2?`rgba(52,195,143,${1-u})`:`rgba(157,188,255,${1-u})`;ctx.fill()}
    text('و آخرِ مسیر: آزمون و گواهی‌نامه',540,1360,58,800,K.ink,seg(t,17.6,18.0)*(1-cx));
  }

  // captions + wordmark
  CAPS.forEach(([a,b,s,size])=>{const al=win(t,a,b);if(al<=0)return;text(s,540,300-8*(1-eo(seg(t,a,a+.4))),size,size>80?900:800,K.ink,al)});
  text('دنت‌کست',540,130,40,800,K.blueL,.75*(1-seg(t,17.2,17.6)));
  }

  // ---- end card ----
  if(endA>0){ctx.save();ctx.globalAlpha=endA;
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04122f');g.addColorStop(1,'#0b2a63');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const rg=ctx.createRadialGradient(540,900,30,540,900,800);rg.addColorStop(0,'rgba(79,127,255,.28)');rg.addColorStop(1,'rgba(79,127,255,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    // mini road glyph, lighting up step by step
    ctx.save();ctx.translate(540,600);ctx.lineCap='round';ctx.lineJoin='round';
    const gp=[[150,40],[-150,40],[-150,-40],[150,-40]];
    ctx.strokeStyle='rgba(157,188,255,.35)';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(150,40);ctx.lineTo(-110,40);ctx.arc(-110,0,40,Math.PI/2,Math.PI*1.5);ctx.lineTo(150,-40);ctx.stroke();
    const gl=seg(t,19.6,20.6);
    [[150,40],[50,40],[-50,40],[-150,0],[-50,-40],[50,-40],[150,-40]].forEach((p,i)=>{const on=gl*7>i;
      ctx.beginPath();ctx.arc(p[0],p[1],on?14:10,0,6.283);ctx.fillStyle=on?K.blueL:'rgba(157,188,255,.35)';if(on){ctx.shadowColor=K.blue;ctx.shadowBlur=20}ctx.fill();ctx.shadowBlur=0});
    ctx.restore();
    const u=eo(seg(t,19.4,20.1));
    text('مسیر یادگیری',540,830+20*(1-u),64,600,'#c7d7ff',u);
    ctx.save();ctx.shadowColor='rgba(79,127,255,.8)';ctx.shadowBlur=60;text('اکلوژن',540,1010+30*(1-u),210,900,'#fff',u);ctx.restore();
    const u2=eo(seg(t,20.0,20.6));
    text('از آشفتگی، به یک راهِ روشن',540,1185,44,600,'#a9bbe6',u2);
    ctx.save();ctx.globalAlpha*=u2;ctx.font=`800 40px ${FF}`;ctx.direction='rtl';const pw=ctx.measureText('دنت‌کست پریمیوم').width+80;
    rr(540-pw/2,1300,pw,84,42);ctx.fillStyle='rgba(227,184,73,.14)';ctx.fill();ctx.strokeStyle=K.amber;ctx.lineWidth=3;ctx.stroke();ctx.restore();
    text('دنت‌کست پریمیوم',540,1343,40,800,K.amber,u2);
    text('dentcast.ir',540,1700,46,600,'#8fa3cf',eo(seg(t,20.4,20.9)));
    ctx.restore()}

  vignette();
}

/* ---------- transport ---------- */
const playBtn=document.getElementById('play'),scrub=document.getElementById('scrub'),clock=document.getElementById('clock');
let t=0,playing=true,last=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){t=21.5;playing=false}
function show(){render(t);scrub.value=t;clock.textContent=t.toFixed(1)+'s';playBtn.textContent=playing?'توقف':'پخش'}
function loop(now){if(playing){if(last!=null)t+=(now-last)/1000;if(t>DUR+1)t=0}last=now;show();requestAnimationFrame(loop)}
playBtn.onclick=()=>{playing=!playing;last=null;show()};
document.getElementById('again').onclick=()=>{t=0;playing=true;last=null};
scrub.oninput=()=>{t=+scrub.value;playing=false;show()};
window.renderAt=x=>render(x);
Promise.all(['400','600','800','900'].flatMap(w=>[document.fonts.load(`${w} 40px Vazirmatn`),document.fonts.load(`${w} 40px VazirLocal`)]).map(p=>p.catch(()=>{})))
  .then(()=>{window.__ready=true;if(location.hash==='#render'){document.body.classList.add('render');render(0)}else requestAnimationFrame(loop)});
</script>

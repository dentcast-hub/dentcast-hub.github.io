<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!-- Open the API connection while the HTML is still parsing: /me gates the
       ad card, and on a first visit the TLS handshake was in front of it. -->
  <link rel="preconnect" href="https://api.dentcast.ir" crossorigin>
  <link rel="preconnect" href="https://api.dentcast.org" crossorigin>
  <!-- Google Analytics (deferred: loads only after the page is fully rendered) -->
  <script>
    window.addEventListener('load', function () {
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-GMM0WC8X3M');
      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-GMM0WC8X3M';
      document.head.appendChild(ga);
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- DentAI is a closed section (founder, 1405/07/15). Its 35 pages keep
       their own /dentai/… addresses and are listed on /sharehub/; this landing
       is no longer a destination, so it forwards there. A static site has no
       server-side 301 on both mirrors, so the forward is a zero-second meta
       refresh (which search engines treat as a permanent redirect) plus a
       script for browsers that ignore it; noindex keeps it out of the sitemap
       (gen_sitemap.py skips noindex pages). -->
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/sharehub/">
  <script>location.replace('/sharehub/' + location.hash);</script>
  <title>Share Hub | دنت‌کست</title>
</head>
<body>
  <p style="font-family:Tahoma,sans-serif;text-align:center;margin:3rem 1rem">
    این بخش به <a href="/sharehub/">Share Hub</a> منتقل شده است.
  </p>
</body>
</html>

<script>
// JSON lives next to this file in the repo. Relative path works on any domain.
const SRC="dentcast_cabinet_full_catalog.json";
let DATA=[],ALIAS={},active=new Set(),shown=0,RES=[],NOTE='';const PAGE=80,CMP=new Set();
const q=document.getElementById('q'),topic=document.getElementById('topic'),type=document.getElementById('type'),sort=document.getElementById('sort');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- normalisation ----------
   Case, accents (Hürzeler = Hurzeler), UK/US spelling, Arabic vs Persian
   letters and digits, Unicode hyphens, number words ("all on four" = all-on-4). */
const UKUS=[[/aesth/g,'esth'],[/colour/g,'color'],[/fibre/g,'fiber'],[/haem/g,'hem'],[/paed/g,'ped'],
  [/oedema/g,'edema'],[/([a-z]{3,})is(e|ed|es|ing|ation|ations)\b/g,'$1iz$2'],[/centre/g,'center'],[/titre/g,'titer'],[/behaviour/g,'behavior']];
const NUM={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6'};
function nm(s){s=String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/‌/g,' ').replace(/[‐-―−]/g,'-')
  .replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x6f0).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x660);
  for(const [a,b] of UKUS)s=s.replace(a,b);return s;}
const WORD=/[a-z0-9؀-ۿ]+/g;
/* word forms meet in one stem: cement/cemented/cementation, print/printed/printing,
   restore/restoration, dentin/dentine, prosthesis/prostheses, implant/implants.
   A stem never gets shorter than 4 letters, so post != posterior and base != based. */
const SUF=['ations','ation','ings','ing','ions','ion','ments','ment','ously','ous','isms','ism','is','ed','es','e','s'];
function stem(w){if(w.length<=3||/^\d/.test(w)||/[؀-ۿ]/.test(w))return w;
  if(/ies$/.test(w)&&w.length>4)return w.slice(0,-3)+'y';
  for(const x of SUF)if(w.endsWith(x)&&w.length-x.length>=4&&!(x==='s'&&w.endsWith('ss')))return w.slice(0,-x.length);
  return w;}
const plain=s=>nm(s).match(WORD)||[];
// words of a text, plus the joined form of hyphen / slash / dot compounds
// ("peri-implantitis" -> peri, implantitis, periimplantitis; "e.max" -> emax)
function words(s){s=nm(s);const out=new Set();
  for(const m of s.match(WORD)||[])out.add(stem(NUM[m]||m));
  for(const m of s.match(/[a-z0-9]+(?:[-/.][a-z0-9]+)+/g)||[])out.add(stem(m.replace(/[-/.]/g,'')));
  return [...out];}

/* abbreviations a clinician types -> what the papers say ('|' separates alternatives) */
const ABBR={ctg:'connective tissue graft|subepithelial connective tissue',sctg:'subepithelial connective tissue',
  fgg:'free gingival graft',emd:'emdogain|enamel matrix derivative',emdogain:'enamel matrix derivative|emd',dme:'deep margin elevation',
  ids:'immediate dentin sealing',sr:'systematic review',ma:'meta-analysis',rct:'randomized controlled|randomized clinical',
  gbr:'guided bone regeneration',gtr:'guided tissue regeneration',prf:'platelet-rich fibrin',prp:'platelet-rich plasma',
  pfm:'porcelain-fused-to-metal|metal-ceramic',fdp:'fixed dental prosthesis|fixed partial denture',fpd:'fixed partial denture|fixed dental prosthesis',
  rpd:'removable partial denture',ios:'intraoral scan|intraoral scanner',ai:'artificial intelligence',ld:'lithium disilicate',lds:'lithium disilicate',
  zls:'zirconia-reinforced lithium silicate',picn:'polymer-infiltrated ceramic',cbct:'cone beam',emax:'e.max',ptfe:'polytetrafluoroethylene',
  dbbm:'deproteinized bovine bone|bio-oss',pes:'pink esthetic score',wes:'white esthetic score',bop:'bleeding on probing',
  kt:'keratinized tissue|keratinized mucosa',mucograft:'collagen matrix',dsd:'digital smile design',
  vdo:'vertical dimension of occlusion|occlusal vertical dimension|vertical dimension',ovd:'occlusal vertical dimension|vertical dimension of occlusion|vertical dimension',
  cr:'centric relation',mip:'maximum intercuspal|maximal intercuspal|intercuspal position',icp:'intercuspal position',rcp:'retruded contact|centric relation',
  vista:'vestibular incision subperiosteal tunnel',vst:'vestibular incision subperiosteal tunnel|tunnel technique',
  // journals: matched only against the journal name
  coir:'clinical oral implants research',jpd:'journal of prosthetic dentistry',jcp:'journal of clinical periodontology',jop:'journal of periodontology',
  ijprd:'periodontics & restorative dentistry|periodontics and restorative dentistry',ijomi:'oral & maxillofacial implants|oral and maxillofacial implants',
  jomi:'oral & maxillofacial implants|oral and maxillofacial implants',cid:'clinical implant dentistry',cidrr:'clinical implant dentistry',
  jerd:'esthetic and restorative dentistry',jdr:'journal of dental research',jdent:'journal of dentistry',dentmat:'dental materials',
  ijp:'international journal of prosthodontics',qi:'quintessence international',bdj:'british dental journal',
  jada:'journal of the american dental association',jpr:'journal of prosthodontic research',ijed:'international journal of esthetic dentistry',
  ejed:'european journal of esthetic dentistry',jap:'journal of advanced prosthodontics',jad:'journal of adhesive dentistry'};
const JOURNAL=new Set(['coir','jpd','jcp','jop','ijprd','ijomi','jomi','cid','cidrr','jerd','jdr','jdent','dentmat','ijp','qi','bdj','jada','jpr','ijed','ejed','jap','jad']);
const DESIGN=new Set(['sr','ma','rct']);
/* phrases (keys written without spaces) in Persian or English -> the papers' words */
const PH={'sinuslift':'sinus augmentation|sinus floor augmentation|sinus floor elevation|sinus lift','liftsinus':'sinus augmentation|sinus floor elevation',
  'ایمپلنت':'implant','زیرکونیا':'zirconia','زیرکونیوم':'zirconia','لمینت':'veneer','لمینیت':'veneer','ونیر':'veneer',
  'روکش':'crown','کراون':'crown','تاج':'crown','باندینگ':'bonding','ادهزیو':'adhesive','چسب':'adhesive','یونیورسال':'universal','چسبیونیورسال':'universal adhesive',

// one search term -> alternatives; each alternative is a list of words that must all appear in one field
function term(raw,phraseValue){

  const w=nm(raw).replace(/^-/,'');
  const ws=words(w).filter(x=>!STOP.has(x)||words(w).length===1);if(!ws.length)return null;
  const key=w.replace(/[^a-z0-9]/g,'');

  if(!JOURNAL.has(key))alts.push(w.match(/[-/.]/)?[stem(w.replace(/[-/.]/g,''))]:ws);   // "e.max" -> emax, "ti-base" -> tibase
  if(ABBR[key])for(const ph of ABBR[key].split('|')){

// an abbreviated journal name written out ("J Esthet Restor Dent", "Int J Prosthodont"): each word starts a journal word, in order
function journalAbbr(toks){if(toks.length<2||toks.some(t=>!/^[a-z]+$/.test(t)))return null;

function parseOne(raw){
  // punctuation inside a pasted title is not a search character
  raw=raw.replace(/[,;:()\[\]{}"'“”«»!?؟،]+/g,' ');
  let parts=raw.split(/\s+/).filter(Boolean);
  const jz=journalAbbr(nm(raw).replace(/\./g,'').split(/\s+/).filter(Boolean));
  if(jz)return {terms:[],neg:[],years:[],nyears:[],phrase:'',journal:jz};
  // Vancouver initials after a surname ("Pjetursson BE", "Magne P") are dropped
  parts=parts.filter((t,i)=>!(i>0&&/^[A-Z]{1,3}$/.test(t)&&!ABBR[t.toLowerCase()]&&/^[A-Z][a-z]/.test(parts[i-1])));
  // NOT x -> -x ; AND is implied
  parts=parts.flatMap((t,i,a)=>t==='AND'?[]:t==='NOT'?[]:(a[i-1]==='NOT'?['-'+t]:[t]));
  let toks=nm(parts.join(' ')).split(/\s+/).filter(t=>t&&t!=='-');
  // Persian plural / ezafe endings
  toks=toks.map(t=>/[؀-ۿ]/.test(t)?t.replace(/(های|ها)$/,'').replace(/ی$/,m=>PH[t.slice(0,-1)]?'':m)||t:t);

  const pos0=toks.filter(t=>!t.startsWith('-'));
  const comp=words(pos0.join(' ')).join('');
  // longest known phrase first (Persian clinical terms, "sinus lift")
  const terms=[],years=[],neg=[],nyears=[];let i=0;
  while(i<toks.length){let took=0;
    for(let n=Math.min(4,toks.length-i);n>=1;n--){const span=toks.slice(i,i+n);if(span.some(t=>t.startsWith('-')))continue;
      const k=span.join('').replace(/[-]/g,'');if(PH[k]){terms.push(term(null,PH[k]));took=n;break;}}
    if(took){i+=took;continue;}
    const t=toks[i++];
    if(t.startsWith('-')){const r=t.slice(1);if(/^(19|20)\d\d$/.test(r))nyears.push(r);else{const x=term(r);if(x)neg.push(x);}continue;}
    if(/^(19|20)\d\d$/.test(t)){years.push(t);continue;}
    if(STOP.has(t)||(t.length<2&&!/\d/.test(t)))continue;

  if(cq&&pos0.some(t=>/^\d{1,2}$/.test(NUM[t]||t)))return {terms:[],neg,years,nyears,phrase:cq,comp:cq,only:true};
  return {terms,neg,years,nyears,phrase:comp,comp:cq};}

function parse(){const raw=q.value.trim();if(!/[\p{L}\p{N}]/u.test(raw))return null;
  let doi=raw.replace(/^[\s"'<(\[]+|[\s"'>)\].,;]+$/g,'');
  try{doi=decodeURIComponent(doi);}catch(e){}
  doi=doi.replace(/^((https?:\/\/)?(www\.|dx\.)?doi\.org\/|doi:?\s*)/i,'').toLowerCase();
  if(/^10\.\d{4,}\//.test(doi)||/^[a-z][a-z0-9-]*\.[a-z0-9.()-]*\d[a-z0-9.()-]*$/.test(doi)&&/\d{3,}/.test(doi))return {doi};
  // OR between groups of words
  const groups=raw.split(/\s+OR\s+/).map(parseOne).filter(Boolean);

// best field weight for each term; 0 when a term is missing
function termScores(p,Q){return Q.terms.map(alts=>{let best=0;
  for(const a of alts)for(const f of FIELDS)if(W[f]>best&&(!a.only||a.only===f)&&altHit(a,f,p))best=W[f];return best;});}
function excluded(p,Q){

  return false;}
function score(p,Q,relax){

  if(Q.doi)return p.doi&&p.doi.includes(Q.doi)?1:0;
  if(Q.journal)return Q.journal(p)?1:0;
  if(Q.years.length&&!Q.years.includes(String(p.y)))return 0;
  if(excluded(p,Q))return 0;
  const compHit=Q.comp&&(['T','G','P'].some(f=>p.f[f].includes(Q.comp))||p.tc.includes(Q.comp));
  if(Q.only)return compHit?20+(p.tc.includes(Q.comp)?8:0):0;
  const sc=termScores(p,Q);const got=sc.filter(Boolean).length;
  let s=1+sc.reduce((a,b)=>a+b,0);
  if(got<Q.terms.length){if(compHit)return 20+(p.tc.includes(Q.comp)?8:0);if(!relax||got<relax)return 0;s-=3*(Q.terms.length-got);}
  if(compHit)s+=6;
  if(Q.phrase.length>3){if(p.tc.includes(Q.phrase))s+=8;else if(p.gc.includes(Q.phrase))s+=4;}
  return Math.max(s,0.5);}

function readState(){const u=new URLSearchParams(location.search);

    el.value=v&&[...el.options].some(o=>o.value===v)?v:d;}

let pushT=null,lastPushed=location.search;
function writeState(){const u=new URLSearchParams();
  if(/[\p{L}\p{N}]/u.test(q.value))u.set('q',q.value.trim());if(topic.value)u.set('topic',topic.value);if(type.value)u.set('type',type.value);
  if(sort.value!=='rel')u.set('sort',sort.value);active.forEach(t=>u.append('tag',t));

const REVIEWS=new Set(['systematic review','systematic review + meta-analysis','network meta-analysis','umbrella review','scoping review']);
const SORTS={t:(a,b)=>a.t.localeCompare(b.t,undefined,{sensitivity:'base'}),
  new:(a,b)=>(b.y||0)-(a.y||0),old:(a,b)=>(a.y||9999)-(b.y||9999),
  ty:(a,b)=>a.ty.localeCompare(b.ty),tp:(a,b)=>a.tp.localeCompare(b.tp,undefined,{sensitivity:'base'})};
function compute(){const Q=parse();NOTE='';
  const pool=DATA.filter(p=>{
    if(topic.value&&!p.tps.has(topic.value))return false;
    if(type.value&&(type.value==='*reviews'?!REVIEWS.has(p.ty):p.ty!==type.value))return false;
    for(const a of active)if(!p.tg.includes(a))return false;return true;});
  let res=[];
  if(!Q)res=pool.slice();
  else{for(const p of pool){p.s=score(p,Q,0);if(p.s)res.push(p);}
    // nobody has every word: show the papers that have most of them, and say which word found nothing
    const n=Q.terms?Q.terms.length:0;
    if(!res.length&&n>=2){
      const miss=[];Q.terms.forEach((alts,i)=>{if(!DATA.some(p=>termScores(p,{terms:[alts]})[0]))miss.push(i);});
      for(const need of [n-1,Math.ceil(n/2)]){if(need<1)continue;for(const p of pool){p.s=score(p,Q,need);if(p.s)res.push(p);}if(res.length)break;}
      if(res.length){const raw=q.value.trim().split(/\s+/);
        NOTE='No paper has all of these words — showing papers that have most of them.'+(miss.length&&miss.length<n?' Not found anywhere: '+miss.map(i=>'“'+(raw[i]||'')+'”').join(', ')+'.':'');}}}
  const by=sort.value==='rel'?(Q?(a,b)=>b.s-a.s||SORTS.new(a,b):SORTS.new):SORTS[sort.value];
  res.sort((a,b)=>by(a,b)||SORTS.t(a,b));return res;}

function card(p){const d=document.createElement('div');d.className='card';d.tabIndex=-1;
  // folder (topic:), year and the long title-as-tag stay searchable but are not shown as chips
  const tags=p.tg.filter(t=>!t.startsWith('topic:')&&!/^(19|20)\d\d$/.test(t)&&t.split('-').length<6)
    .map(t=>'<button type="button" class="tag'+(active.has(t)?' on':'')+'" aria-pressed="'+active.has(t)+'" data-t="'+esc(t)+'">#'+esc(t)+'</button>').join(' ');
  const dl=p.d?'<a class="dl" href="'+esc(p.d)+'" target="_blank" rel="noopener"><span>Download</span><span class="sr"> – '+esc((p.t||'').slice(0,80))+'</span></a>':'<a class="dl nolink">No link</a>';
  const vw=p.v?'<a href="'+esc(p.v)+'" target="_blank" rel="noopener"><span>View</span><span class="sr"> – '+esc((p.t||'').slice(0,80))+'</span></a>':'';
  const jy=[p.j,p.y].filter(Boolean).join(' · ');
  const jr=jy?'<p class="jr" dir="auto">'+esc(jy)+'</p>':'';
  const kd=/[؀-ۿ]/.test(p.kf||p.ab)?'rtl':'ltr';
  // an abstract cut off by the source is marked as such rather than ending mid-word
  let ab=p.ab;if(ab){if(/^[a-z]/.test(ab))ab='… '+ab;if(!/[.!?)\]"”…]\s*$/.test(ab))ab=ab.replace(/\.\.\.$/,'')+' …';}
  const fa=kd==='rtl',L1=fa?'یافتهٔ کلیدی':'Key finding',L2=fa?'پیام بالینی:':'Clinical bottom line:',lg=fa?' lang="fa"':'';
  const kf=p.kf?'<details class="kf"><summary>'+L1+'</summary><p dir="'+kd+'"'+lg+'>'+esc(p.kf)+'</p>'+(p.bl?'<p class="bl" dir="'+kd+'"'+lg+'><b>'+L2+'</b> '+esc(p.bl)+'</p>':'')+'</details>'
    // no summary yet: show the paper's own published abstract, verbatim
    :ab?'<details class="kf"><summary>Abstract</summary><p class="ab" dir="'+kd+'"'+lg+'>'+esc(ab)+'</p></details>':'';

  const tl=/[؀-ۿ]/.test(p.t)?' lang="fa"':'';
  d.innerHTML='<h2 class="title" dir="auto"'+tl+'>'+esc(p.t)+'</h2>'+jr+'<div class="meta"><span class="badge">'+esc(p.ty)+'</span>'+tp+'</div>'+kf+'<div class="tags">'+tags+'</div><div class="act">'+dl+vw+'</div>';
  return d;}

function render(reset,all,noHistory){const list=document.getElementById('list');

document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#list .tag');if(!t)return;
  const v=t.dataset.t;active.has(v)?active.delete(v):active.add(v);chips();render(true);toFilters();
  const chip=[...document.querySelectorAll('#active .chip')].find(c=>c.textContent.startsWith('#'+v+' '));

<!-- Floating jump button (quick scroll) — behavior copied from the landing pages -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const btn = document.getElementById("dcJumpBtn");
  const topEl = document.getElementById("dc-top");
  const endEl = document.getElementById("dc-list-end");

  if (!btn) return;

  const BOTTOM_RATIO = 0.85;
  const TOP_RESET = 20;

  let isUp = false;

  function pageHeight() {
    return document.documentElement.scrollHeight;
  }

  function viewportHeight() {
    return window.innerHeight;
  }

  function scrollY() {
    return window.pageYOffset || document.documentElement.scrollTop;
  }

  function nearBottom() {
    return (scrollY() + viewportHeight()) >= pageHeight() * BOTTOM_RATIO;
  }

  function updateState() {

    if (pageHeight() <= viewportHeight() + 10) {
      btn.style.opacity = "0.4";
      return;
    } else {
      btn.style.opacity = ".85";
    }

    isUp = nearBottom();
    btn.classList.toggle("is-up", isUp);


  }

  btn.addEventListener("click", function () {
    if (isUp) {
      if (topEl) {
        topEl.scrollIntoView({ behavior: "smooth" });
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    } else {
      if (endEl) {
        endEl.scrollIntoView({ behavior: "smooth" });
      } else {
        window.scrollTo({ top: pageHeight(), behavior: "smooth" });
      }
    }
  });

  window.addEventListener("scroll", updateState);
  window.addEventListener("resize", updateState);

  // The catalog list renders asynchronously after fetch — re-check the button
  // state when it changes so it isn't stuck dimmed on first paint.
  const listEl = document.getElementById("list");
  if (listEl) new MutationObserver(updateState).observe(listEl, { childList: true });

  updateState();

});
</script>

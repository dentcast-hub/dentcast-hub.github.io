<script>
// JSON lives next to this file in the repo. Relative path works on any domain.
const SRC="dentcast_cabinet_full_catalog.json";
let DATA=[],active=new Set(),shown=0;const PAGE=80;
const q=document.getElementById('q'),topic=document.getElementById('topic'),type=document.getElementById('type'),sort=document.getElementById('sort');
const nm=s=>(s||'').toLowerCase();

fetch(SRC).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{
  const papers=Array.isArray(j)?j:(j.papers||[]);
  DATA=papers.map(p=>({
    t:p.display_title||p.real_title||p.title||"",
    tp:p.topic||"",ty:p.type||"",tg:p.tags||[],
    d:p.drive_download||"",v:p.drive_view||"",j:p.journal||""
  }));
  document.getElementById('total').textContent='\u00b7 '+DATA.length+' papers';
  fill(topic,[...new Set(DATA.map(p=>p.tp).filter(x=>x&&x!=='(root)'))].sort());
  fill(type,[...new Set(DATA.map(p=>p.ty).filter(Boolean))].sort());
  [q,topic,type].forEach(el=>el.disabled=false);
  [topic,type,sort].forEach(el=>el.addEventListener('input',()=>render(true)));
  q.addEventListener('input',onQueryInput);
  document.getElementById('state').remove();render(true);
  Quota.start();
}).catch(e=>{
  document.getElementById('state').innerHTML='Could not load <b>'+SRC+'</b> ('+e.message+').<br>Make sure the JSON sits in the same folder as this page in the repo.';
});

/* ── SEARCH ALLOWANCE ──────────────────────────────────────────────────────
   Three searches a day, then the list stays and the TOOL is what premium buys.

   WHY THE TOOL AND NOT THE PAPERS. Every other allowance on this site is
   enforced by the API, because the API owns the data. This page has no API in
   its path at all: it is a static file that fetches a public JSON and does all
   its searching, filtering and sorting in the browser. So a device-local
   counter is the honest limit of what is enforceable here, and pretending
   otherwise — obfuscating the catalogue, faking a server check — would buy
   nothing but a page that breaks offline.

   That is a deliberate trade, not an oversight. Anyone who opens devtools can
   have the JSON; what is being sold is the ability to SEARCH 2200 papers from
   inside the site, which is the only thing that makes 2200 papers usable. When
   the allowance is spent the full list is still right there to scroll — «از اول
   نگاه کن» — so nothing is taken away, only the shortcut.

   Three rules it follows:
   • It FAILS OPEN. If /me cannot be reached (offline, API down, adblocker) the
     page stays unmetered. A subscriber locked out of search by a network blip
     is far worse than an anonymous visitor getting a fourth query.
   • DISTINCT queries are counted, not keystrokes. Typing narrows a search —
     "کامپوزیت" then "کامپوزیت خلفی" is one person refining one question — so
     the counter commits on a debounce and never charges twice for the same
     text. Retyping something already spent is free.
   • Sorting and filtering ride along with the search allowance rather than
     having one of their own. Over 2200 papers they are the same tool: sorting
     a corpus you cannot search is how you find things without searching. */
const Quota = (function(){
  const LIMIT_DEFAULT = 3;
  const DEBOUNCE_MS = 700;
  let limit = LIMIT_DEFAULT;
  let metered = false;          // stays false until /me confirms a non-premium reader
  let spent = new Set();
  let locked = false;
  const box = document.getElementById('cabQuota');

  /* The same Tehran day boundary the streak engine and every allowance on the
     API use, so "امروز" means one thing across the whole product. */
  function today(){
    try {
      return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    } catch(e){ return new Date().toISOString().slice(0,10); }
  }
  const key = () => 'dc.cab.q.' + today();

  function load(){
    try {
      const raw = localStorage.getItem(key());
      spent = new Set(raw ? JSON.parse(raw) : []);
      /* Yesterday's keys are dropped on the first visit of a new day, so the
         allowance cannot accumulate a year of dead entries in storage. */
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && k.startsWith('dc.cab.q.') && k !== key()) localStorage.removeItem(k);
      }
    } catch(e){ spent = new Set(); }
  }
  function save(){ try { localStorage.setItem(key(), JSON.stringify([...spent])); } catch(e){} }

  const norm = (s) => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const remaining = () => Math.max(0, limit - spent.size);

  function paint(){
    if (!metered || !box) return;
    box.hidden = false;
    box.className = 'cab-quota' + (locked ? ' is-spent' : '');
    box.replaceChildren();
    const p = document.createElement('div');
    if (locked) {
      p.innerHTML = '<b>سه جستجوی امروزت تمام شد.</b> فهرست کامل مقاله‌ها همچنان باز است و می‌توانی مرورش کنی؛ جستجو و مرتب‌سازی با پریمیوم.';
    } else {
      p.innerHTML = 'کتابخانه رایگان قابل مرور است. <b>' + remaining() + ' جستجوی رایگان</b> امروز برایت مانده.';
    }
    box.appendChild(p);
    const row = document.createElement('div');
    row.className = 'cab-quota-row';
    if (locked) {
      const browse = document.createElement('button');
      browse.type = 'button'; browse.className = 'cab-browse'; browse.textContent = 'دیدن فهرست کامل';
      browse.addEventListener('click', clearFilters);
      row.appendChild(browse);
    }
    const buy = document.createElement('a');
    buy.className = 'cab-buy';
    buy.href = '/plus/pricing.html?from=' + (locked ? 'library-search-spent' : 'library-search');
    buy.textContent = 'جستجوی نامحدود با پریمیوم';
    row.appendChild(buy);
    box.appendChild(row);
  }

  /* Back to the whole corpus, unsorted and unfiltered — literally "look from
     the beginning". The controls stay disabled; this is the fallback, not a
     way back into the tool. */
  function clearFilters(){
    q.value = ''; topic.value = ''; type.value = ''; sort.value = 't';
    active.clear(); chips(); render(true);
  }

  function lock(){
    if (locked) return;
    locked = true;
    [q,topic,type,sort].forEach(el=>{ el.disabled = true; });
    paint();
  }

  /* Commit one query against the allowance. Returns whether the search may run. */
  function charge(raw){
    if (!metered || locked) return !locked;
    const t = norm(raw);
    if (!t) return true;                 // clearing the box is not a search
    if (spent.has(t)) return true;       // already paid for this exact question
    if (remaining() <= 0) { lock(); return false; }
    spent.add(t); save();
    if (remaining() <= 0) lock(); else paint();
    return true;
  }

  return {
    charge,
    debounceMs: DEBOUNCE_MS,
    isLocked: () => locked,
    /* Ask who this is, and only then start metering. Until the answer arrives
       the page is unmetered, so a subscriber never sees a counter flash. */
    start(){
      load();
      import('/plus/js/api.js')
        .then((m) => m.currentUser().then((user) => {
          if (m.meStatus() === 'error') return;            // fail open
          if (user && user.tier === 'premium') return;     // nothing to meter
          metered = true;
          fetch('/plus/quota.json', { credentials: 'omit' })
            .then((r) => (r.ok ? r.json() : null))
            .then((c) => {
              const n = c && c.previews && c.previews.library_searches_per_day;
              if (Number.isInteger(n) && n >= 0) limit = n;
            })
            .catch(() => {})
            .then(() => { if (remaining() <= 0) lock(); else paint(); });
        }))
        .catch(() => { /* unreachable API leaves the page unmetered */ });
    },
  };
})();

let qTimer = null;
/* Typing re-renders immediately (the filter is local and instant), but only the
   settled text is charged. Rendering first and charging second is what keeps a
   search that gets refused from also blanking the results the reader can see. */
function onQueryInput(){
  if (Quota.isLocked()) return;
  render(true);
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { Quota.charge(q.value); }, Quota.debounceMs);
}

function fill(sel,arr){for(const v of arr){const o=document.createElement('option');o.textContent=v;sel.appendChild(o);}}
function match(p){const t=nm(q.value).trim();
 if(t&&!(nm(p.t).includes(t)||p.tg.some(x=>nm(x).includes(t))))return false;
 if(topic.value&&p.tp!==topic.value)return false;if(type.value&&p.ty!==type.value)return false;
 for(const a of active)if(!p.tg.includes(a))return false;return true;}
function render(reset){if(reset){shown=0;document.getElementById('list').innerHTML='';}
 const res=DATA.filter(match);res.sort((a,b)=>(a[sort.value]||'').localeCompare(b[sort.value]||''));
 document.getElementById('count').textContent=res.length+' result'+(res.length==1?'':'s');
 const list=document.getElementById('list');
 for(const p of res.slice(shown,shown+PAGE)){const d=document.createElement('div');d.className='card';
  const tags=p.tg.map(t=>'<span class="tag" data-t="'+t+'">#'+t+'</span>').join(' ');
  const dl=p.d?'<a class="dl" href="'+p.d+'" target="_blank">Download</a>':'<a class="dl nolink">No link</a>';
  const vw=p.v?'<a href="'+p.v+'" target="_blank">View</a>':'';
  const jr=p.j?'<p class="jr">'+p.j+'</p>':'';
  d.innerHTML='<p class="title">'+p.t+'</p>'+jr+'<div class="meta"><span class="badge">'+p.ty+'</span><span class="badge">'+p.tp+'</span></div><div class="tags">'+tags+'</div><div class="act">'+dl+vw+'</div>';
  list.appendChild(d);}
 shown+=Math.min(PAGE,Math.max(0,res.length-shown));let mb=document.getElementById('more');if(mb)mb.remove();
 if(shown<res.length){const b=document.createElement('button');b.id='more';b.className='more';b.textContent='show more ('+(res.length-shown)+' left)';b.onclick=()=>render(false);list.appendChild(b);}}
function chips(){const c=document.getElementById('active');c.innerHTML='';active.forEach(a=>{const s=document.createElement('span');s.className='chip x';s.textContent='#'+a+' \u2715';s.onclick=()=>{active.delete(a);chips();render(true)};c.appendChild(s);});}
document.addEventListener('click',e=>{if(e.target.classList.contains('tag')){active.add(e.target.dataset.t);chips();render(true);}});
</script>
<!-- Floating jump button (quick scroll) — behavior copied from the landing pages -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const btn = document.getElementById("dcJumpBtn");
  const topEl = document.getElementById("dc-top");
  const endEl = document.getElementById("dc-list-end");

  if (!btn) return;

  const BOTTOM_RATIO = 0.85;
  const TOP_RESET = 20;

  let isUp = false;

  function pageHeight() {
    return document.documentElement.scrollHeight;
  }

  function viewportHeight() {
    return window.innerHeight;
  }

  function scrollY() {
    return window.pageYOffset || document.documentElement.scrollTop;
  }

  function nearBottom() {
    return (scrollY() + viewportHeight()) >= pageHeight() * BOTTOM_RATIO;
  }

  function updateState() {

    if (pageHeight() <= viewportHeight() + 10) {
      btn.style.opacity = "0.4";
      return;
    } else {
      btn.style.opacity = ".85";
    }

    isUp = nearBottom();
    btn.classList.toggle("is-up", isUp);


  }

  btn.addEventListener("click", function () {
    if (isUp) {
      if (topEl) {
        topEl.scrollIntoView({ behavior: "smooth" });
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    } else {
      if (endEl) {
        endEl.scrollIntoView({ behavior: "smooth" });
      } else {
        window.scrollTo({ top: pageHeight(), behavior: "smooth" });
      }
    }
  });

  window.addEventListener("scroll", updateState);
  window.addEventListener("resize", updateState);

  // The catalog list renders asynchronously after fetch — re-check the button
  // state when it changes so it isn't stuck dimmed on first paint.
  const listEl = document.getElementById("list");
  if (listEl) new MutationObserver(updateState).observe(listEl, { childList: true });

  updateState();

});
</script>

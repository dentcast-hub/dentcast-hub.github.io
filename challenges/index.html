  <style>
/* Only what dc-theme.css does NOT own; every token (--ac/--txt/--card-*/--r-*)
   comes from the design system. Amber = «this is what a subscription buys»,
   used on exactly one line of this page. */
:root{--x-amber-ink:#8a6414}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--x-amber-ink:#e3b849}}
:root[data-theme="dark"]{--x-amber-ink:#e3b849}
a{color:inherit}
.ch-page{max-width:46rem;margin:0 auto;padding:1.15rem .85rem 5rem}
.ch-hero{margin:.2rem 0 1.1rem}
.ch-back{display:inline-flex;align-items:center;gap:.25rem;font-size:.8rem;font-weight:600;color:var(--txt3);text-decoration:none;margin-bottom:.4rem}
.ch-back::before{content:"\2190 \00A0"}
.ch-back:hover{color:var(--ac)}
.ch-eyebrow{display:block;font-size:.68rem;font-weight:800;letter-spacing:.04em;color:var(--ac);text-transform:uppercase}
.ch-hero h1{margin:.15rem 0 .3rem;font-size:2rem;font-weight:900;letter-spacing:-.04em;line-height:1.25;text-wrap:balance}
.ch-lead{margin:0 0 .4rem;font-size:.86rem;line-height:1.95;color:var(--txt2);text-wrap:pretty}
.ch-sub{margin:0;font-size:.78rem;color:var(--txt3);font-variant-numeric:tabular-nums}
.ch-list{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.75rem}
.ch-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r-lg);
  box-shadow:var(--card-sh);overflow:hidden;display:flex;flex-direction:column}
.ch-media{display:block;background:var(--surface2);aspect-ratio:16/9;overflow:hidden}
.ch-media img{width:100%;height:100%;object-fit:cover;display:block}
.ch-main{padding:.8rem .9rem .9rem}
.ch-meta{margin:0 0 .35rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.7rem;color:var(--txt3)}
.ch-sec{font-weight:800;color:var(--txt3);background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:.05rem .45rem}
.ch-state{font-weight:800;color:var(--ok,#1a7f4b);background:rgba(26,127,75,.09);border:1px solid rgba(26,127,75,.28);border-radius:999px;padding:.05rem .5rem}
.ch-title{display:block;font-size:1.02rem;font-weight:800;line-height:1.7;text-decoration:none;text-wrap:pretty;letter-spacing:-.01em}
.ch-q{margin:.4rem 0 .6rem;font-size:.86rem;line-height:1.95;color:var(--txt2);text-wrap:pretty}
.ch-go{display:inline-block;font-size:.8rem;font-weight:800;color:var(--ac);text-decoration:none}
.ch-note{margin:1.2rem 0 0;font-size:.8rem;line-height:1.95;color:var(--txt3);text-wrap:pretty}
.ch-note a{color:var(--x-amber-ink);font-weight:800;text-decoration:none}
.ch-empty{margin:1.2rem 0;font-size:.86rem;color:var(--txt3)}
[hidden]{display:none!important}
/* dc-theme.css styles every <a> inside <main> as a prose link; these are cards
   and controls, so the page re-asserts their colours at a higher specificity. */
#chRoot .ch-title{color:var(--txt)} #chRoot .ch-title:hover{color:var(--ac)}
#chRoot .ch-go{color:var(--ac)} #chRoot .ch-note a{color:var(--x-amber-ink)}
@media(min-width:44rem){.ch-page{padding:1.75rem 1.5rem 5rem}.ch-list{grid-template-columns:1fr 1fr;align-items:start}}
  </style>

  <!-- Theme init verbatim from up-board/index.html -->
  <script>
    (function(){
      const s=localStorage.getItem('dc-theme');
      const d=window.matchMedia('(prefers-color-scheme:dark)').matches;
      if(s==='dark'||(s===null&&d)) document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>

<!-- Static fallback header. dc-nav.js REPLACES this in place with the canonical

    <button class="dc-topbar-btn" id="btn-toolbar-toggle" aria-label="ابزارها" aria-expanded="false"><svg class="dc-svg-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;vertical-align:-.15em;display:inline-block"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
    <button class="dc-topbar-btn dcOpenSearch" aria-label="جستجو"><svg class="dc-svg-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;vertical-align:-.15em;display:inline-block"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>
  <div class="dc-topbar-brand">
    <div class="dc-topbar-brand-name">DentCast</div>
    <a href="/about.html" class="dc-topbar-brand-sub">دکتر فواد شهابیان</a>
  </div>
</header>

<!-- 🔍 Global Search — required markup, not decoration. global-search.js binds
     straight to #dcSearch and throws on a page that lacks it, which kills every
     binding after it; the canonical topbar dc-nav.js injects always carries a
     search button, so this box has to exist for it to open. -->
<div class="dc-global-filter-box" id="dcGlobalBox">
  <button class="dc-close-results"><svg class="dc-svg-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;vertical-align:-.15em;display:inline-block"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <h3 class="dc-global-filter-title">جستجوی سراسری دنت‌کست</h3>
  <input id="dcSearch" class="dc-search-input" placeholder="جستجو در همهٔ بخش‌های دنت‌کست…">
  <div class="dc-filter-list">
    <button class="dc-filter-btn active" data-type="dentcast">دنت‌کست</button>
    <button class="dc-filter-btn active" data-type="notecast">نوت‌کست</button>
    <button class="dc-filter-btn active" data-type="clinical">نکات کلینیکی</button>
    <button class="dc-filter-btn active" data-type="dentcast_plus">ویدیوها</button>
    <button class="dc-filter-btn active" data-type="dentai">مقالات</button>
    <button class="dc-filter-btn active" data-type="promptologist">پرامپتولوژیست</button>
    <button class="dc-filter-btn active" data-type="meta">metanote</button>
    <button class="dc-filter-btn active" data-type="chairside">chairside</button>
    <button class="dc-filter-btn active" data-type="sharehub">Share Hub</button>
  </div>
  <div class="dc-results-box" id="dcResults"></div>
</div>

<main class="ch-page" id="chRoot">

    <span class="ch-eyebrow">چالش</span>
    <h1>چالش‌های دنت‌کست</h1>
    <p class="ch-lead">یک کیس، یک سؤال. جواب خودتان را بنویسید؛ با نکته‌های کلیدی مقایسه می‌شود و بعد از آن پاسخ دنت‌کست را می‌بینید.</p>
    <p class="ch-sub" id="chSub">&nbsp;</p>
  </header>
</main>

<script src="/global-search-ui.js?v=5"></script>

     catalogs it fetches (ASSET_V in challenges-page.js). Managed by

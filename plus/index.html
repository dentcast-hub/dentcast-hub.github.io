<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <!-- Theme bootstrap (mirrors dc-nav.js, which this page does not load): the
       site's stored choice wins, the OS preference is the fallback, and it is
       stamped on <html> BEFORE the stylesheets load so a dark reader never sees
       a white flash. Without it every /plus page was light in every theme
       (founder, 1405/06/31: «توی پروفایل … تم دیگه دارک نیست»). -->
  <script>(function(){try{var s=localStorage.getItem('dc-theme');var d=s==='dark'||(s===null&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
  <!-- Open the API connection while the HTML is still parsing: /me gates the
       ad card, and on a first visit the TLS handshake was in front of it. -->
  <link rel="preconnect" href="https://api.dentcast.ir" crossorigin>
  <link rel="preconnect" href="https://api.dentcast.org" crossorigin>
  <!-- Google Analytics (deferred: loads only after the page is fully rendered) -->
  <script>
    window.addEventListener('load', function () {
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-GMM0WC8X3M');
      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-GMM0WC8X3M';
      document.head.appendChild(ga);
    });
  </script>

  <!-- DentCast Spot loader — this standalone page renders the SAME dashboard
       view as the header overlay (which gets Spot via dc-nav.js's own loader),
       but it does not load dc-nav.js itself (it has its own minimal header, not
       the full site chrome), so the loader is duplicated here rather than
       pulling in the whole nav bundle. Keep this block's SPOT_V in sync with
       the one at the end of /dc-nav.js. -->
  <script>
    (function () {
      if (window.__dcSpotLoaded) return;
      window.__dcSpotLoaded = true;
      var SPOT_V = '56';
      var js = document.createElement('script');
      js.type = 'module';
      js.src = '/spot/spot.js?v=' + SPOT_V;
      document.body.appendChild(js);
    })();
  </script>

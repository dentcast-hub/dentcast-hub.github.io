name: Post-Push-2 mechanical continuation

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Exact publication feature branch
        required: true
        type: string
      expected_head:
        description: Full SHA of the delivered second-push commit
        required: true
        type: string
      expect_title:
        description: Exact approved user title for Phase F, if supplied
        required: false
        type: string
      expect_caption:
        description: Exact approved user caption for Phase F, if supplied
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: post-cut2-${{ inputs.expected_head }}
  cancel-in-progress: false

jobs:
  mechanical-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$TARGET_BRANCH"

      - name: Check out the exact second-push commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Pin checkout to the expected delivered SHA
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run post-Push-2 mechanical continuation
        id: continue
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECT_TITLE: ${{ inputs.expect_title }}
          EXPECT_CAPTION: ${{ inputs.expect_caption }}
          RECOVERY_DIR: ${{ runner.temp }}/dentcast-post-cut2
        run: |
          set -euo pipefail
          args=(
            --repo "$GITHUB_WORKSPACE"
            --expected-head "$EXPECTED_HEAD"
            --expected-branch "$TARGET_BRANCH"
            --artifact-dir "$RECOVERY_DIR"
          )
          if [[ -n "$EXPECT_TITLE" ]]; then args+=(--expect-title "$EXPECT_TITLE"); fi
          if [[ -n "$EXPECT_CAPTION" ]]; then args+=(--expect-caption "$EXPECT_CAPTION"); fi
          python3 tools/dentcast_post_cut2_runner.py "${args[@]}" | tee "$RUNNER_TEMP/post-cut2-result.json"

      - name: Upload logs and recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-cut2-${{ inputs.expected_head }}
          path: |
            ${{ runner.temp }}/dentcast-post-cut2/
            ${{ runner.temp }}/post-cut2-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize result
        if: always()
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Post-Push-2 mechanical continuation"
            echo
            echo "- Push-2 SHA: `$EXPECTED_HEAD`"
            echo "- Job result: **$JOB_STATUS**"
            echo "- This workflow has read-only repository permissions and never commits or pushes."
            echo "- A successful run stops before G, cleanup, and delivery 3."
            echo "- On failure, inspect the uploaded logs/recovery artifact before resuming."
          } >> "$GITHUB_STEP_SUMMARY"

name: Post-Push-2 mechanical continuation

on:
  push:
    branches: ["**"]
    paths:
      - ".dentcast/PUBLISH-HANDOFF.md"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Exact publication feature branch
        required: true
        type: string
      expected_head:
        description: Full SHA of the delivered second-push commit
        required: true
        type: string
      expect_title:
        description: Optional exact title; must match frozen handoff approval
        required: false
        type: string
      expect_caption:
        description: Optional exact caption; must match frozen handoff approval
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One publication branch = one run at a time; a reconciliation push waits
  # for the earlier run instead of racing it for delivery 3.
  group: post-cut2-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      continue: ${{ steps.cut.outputs.continue }}
      expected_head: ${{ steps.validate.outputs.expected_head }}
      target_branch: ${{ steps.validate.outputs.target_branch }}
      reason: ${{ steps.cut.outputs.reason }}
    steps:
      - name: Select and validate the exact event commit
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.target_branch }}
          INPUT_HEAD: ${{ github.event.inputs.expected_head }}
          EVENT_BRANCH: ${{ github.ref_name }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_BRANCH="$INPUT_BRANCH"
            EXPECTED_HEAD="$INPUT_HEAD"
          else
            TARGET_BRANCH="$EVENT_BRANCH"
            EXPECTED_HEAD="$EVENT_HEAD"
          fi
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$TARGET_BRANCH"
          {
            echo "target_branch=$TARGET_BRANCH"
            echo "expected_head=$EXPECTED_HEAD"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.target_branch }}
          fetch-depth: 0

      - name: Pin the read-only preflight to the event SHA
        env:
          TARGET_BRANCH: ${{ steps.validate.outputs.target_branch }}
          EXPECTED_HEAD: ${{ steps.validate.outputs.expected_head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Skip Push 1 and non-publication pushes before any builder runs
        id: cut
        env:
          TARGET_BRANCH: ${{ steps.validate.outputs.target_branch }}
          EXPECTED_HEAD: ${{ steps.validate.outputs.expected_head }}
          RECOVERY_DIR: ${{ runner.temp }}/dentcast-post-cut2-preflight
        run: |
          set -euo pipefail
          python3 tools/dentcast_post_cut2_runner.py \
            --repo "$GITHUB_WORKSPACE" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-branch "$TARGET_BRANCH" \
            --artifact-dir "$RECOVERY_DIR" \
            --preflight-only

  mechanical-continuation:
    needs: preflight
    if: needs.preflight.outputs.continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out the exact Push-2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target_branch }}
          fetch-depth: 0

      - name: Pin checkout to the expected delivered SHA
        env:
          TARGET_BRANCH: ${{ needs.preflight.outputs.target_branch }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.expected_head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run post-Push-2 mechanics and create delivery 3
        env:
          TARGET_BRANCH: ${{ needs.preflight.outputs.target_branch }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.expected_head }}
          EXPECT_TITLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expect_title || '' }}
          EXPECT_CAPTION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expect_caption || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECOVERY_DIR: ${{ runner.temp }}/dentcast-post-cut2
        run: |
          set -euo pipefail
          args=(
            --repo "$GITHUB_WORKSPACE"
            --expected-head "$EXPECTED_HEAD"
            --expected-branch "$TARGET_BRANCH"
            --artifact-dir "$RECOVERY_DIR"
            --deliver-third
            --run-url "$RUN_URL"
          )
          if [[ -n "$EXPECT_TITLE" ]]; then args+=(--expect-title "$EXPECT_TITLE"); fi
          if [[ -n "$EXPECT_CAPTION" ]]; then args+=(--expect-caption "$EXPECT_CAPTION"); fi
          python3 tools/dentcast_post_cut2_runner.py "${args[@]}" | tee "$RUNNER_TEMP/post-cut2-result.json"

      # Commits pushed with GITHUB_TOKEN do not get normal PR checks, so the
      # merge gate is run here against the exact delivery-3 commit.
      - name: Verify delivery 3 against the publication merge gate
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: python3 tools/check_publish_merge_gate.py

      # Founder decision 2026-11-06: after a successful delivery 3 nothing
      # mechanical is left to the agent; this job opens the PR to the default
      # branch itself and never merges it (the monitoring agent merges it once
      # every gate is green, without asking: founder 2026-11-07). A queue-lane item's PR is opened by queue-publish.yml
      # (job await-delivery-3, with the queue item details), so it is skipped
      # here. Without the QUEUE_PUBLISH_TOKEN secret (a GITHUB_TOKEN PR would
      # not run the PR gates) the step writes one summary line and succeeds.
      - name: Open the PR to the default branch (never merged here)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.QUEUE_PUBLISH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          TARGET_BRANCH: ${{ needs.preflight.outputs.target_branch }}
          PR_INFO: ${{ runner.temp }}/dentcast-post-cut2/pull-request.json
        run: |
          set -euo pipefail
          if [[ ! -f "$PR_INFO" ]]; then
            echo "- PR: not opened — the runner wrote no pull-request.json for this delivery 3." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$(jq -r '.open' "$PR_INFO")" != "true" ]]; then
            printf '%s\n' "- PR: not opened here — $(jq -r '.reason' "$PR_INFO")" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            printf '%s\n' "- PR: not opened — repository secret QUEUE_PUBLISH_TOKEN is not set (fine-grained PAT: Pull requests read/write, Contents read). Open the PR from \`$TARGET_BRANCH\` to \`$BASE_REF\` by hand; the monitoring agent merges it when every gate is green." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="$(jq -r '.title' "$PR_INFO")"
          jq -r '.body' "$PR_INFO" > "$RUNNER_TEMP/post-cut2-pr-body.md"
          # REST, not `gh pr create`: the same call works where GraphQL is blocked.
          if ! url="$(gh api "repos/$GH_REPO/pulls" -f title="$title" -f head="$TARGET_BRANCH" \
                -f base="$BASE_REF" -F body=@"$RUNNER_TEMP/post-cut2-pr-body.md" --jq .html_url)"; then
            owner="${GH_REPO%%/*}"
            url="$(gh api "repos/$GH_REPO/pulls?state=open&head=$owner:$TARGET_BRANCH" --jq '.[0].html_url // empty')"
            if [[ -z "$url" ]]; then
              echo "::warning::the PR could not be opened; delivery 3 is on the branch — open the PR from $TARGET_BRANCH to $BASE_REF by hand"
              printf '%s\n' "- PR: not opened (API error); delivery 3 is on \`$TARGET_BRANCH\`. Open the PR to \`$BASE_REF\` by hand; the monitoring agent merges it when every gate is green." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "pr_url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "- PR: $url (merge when every gate is green; the monitoring agent merges it without asking)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-cut2-${{ needs.preflight.outputs.expected_head }}
          path: |
            ${{ runner.temp }}/dentcast-post-cut2/
            ${{ runner.temp }}/post-cut2-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize result
        if: always()
        env:
          EXPECTED_HEAD: ${{ needs.preflight.outputs.expected_head }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Post-Push-2 mechanical continuation"
            echo
            printf '%s\n' "- Push-2 SHA: \`$EXPECTED_HEAD\`"
            echo "- Job result: **$JOB_STATUS**"
            echo "- Save-point pushes (Push 1) and pushes without a v2 Push-2 handoff are skipped by the read-only preflight."
            echo "- A successful run creates and confirms exactly delivery 3, then opens the PR (never merges it)."
            echo "- On failure, inspect the uploaded logs/recovery bundle before resuming."
          } >> "$GITHUB_STEP_SUMMARY"

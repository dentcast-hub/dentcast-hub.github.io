name: Correct video 14 sentence
on:
  push:
    branches: [codex/correct-video-14-post]
    paths: ['.github/workflows/correct-video-14.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct all surfaces and verify
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import json, subprocess, re
          from pathlib import Path
          OLD="روکش همراه با سمان از دندون در میاد."
          NEW="روکش همراه با پست از دندان خارج میشه"
          OLD_EN="the crown comes off the tooth together with the cement."
          NEW_EN="the crown comes out of the tooth together with the post."
          CID="dentcast-plus/video-14"
          def run(*args):
              p=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              print(p.stdout,flush=True)
              if p.returncode: raise RuntimeError(repr(args[:3]))
              return p.stdout
          def replace(path,old,new,count):
              raw=Path(path).read_bytes()
              assert raw.count(old.encode())==count,(path,raw.count(old.encode()))
              Path(path).write_bytes(raw.replace(old.encode(),new.encode()))
          for path,count in [("dentcast-plus/video-14.html",5),("dentcast-brain.json",1),("plus/des-scores.json",1)]:
              replace(path,OLD,NEW,count)
          replace("dentcast-plus/en/video-14.html",OLD_EN,NEW_EN,5)
          data=json.loads(Path("dentcast-brain.json").read_text())
          entry=next(e for e in data if e.get("page_url")=="/"+CID+".html")
          assert entry["caption"].endswith(NEW)
          assert OLD not in entry["caption"]
          for args in [
           ["python3","tools/update-homepage-counters.py"],
           ["python3","tools/build_pillar.py","all"],
           ["node","tools/build_quiz_index.mjs"],
           ["python3",".github/scripts/inject_img_attrs.py"],
           ["node","tools/build_plus_index.mjs"],
           ["python3","tools/build_upboard_index.py"],
           ["python3",".github/scripts/gen_sitemap.py"]
          ]: run(*args)
          def preserve_endings(paths):
              for path in paths:
                  old=subprocess.run(["git","show","HEAD:"+path],capture_output=True)
                  if old.returncode or not Path(path).is_file(): continue
                  if old.stdout.count(b"\r\n")>old.stdout.count(b"\n")/2:
                      current=Path(path).read_bytes()
                      Path(path).write_bytes(current.replace(b"\r\n",b"\n").replace(b"\n",b"\r\n"))
          changed=run("git","diff","--name-only").splitlines()
          preserve_endings(changed)
          run("python3","tools/stamp-version.py")
          preserve_endings(["index.html","player.html","service-worker.js"])
          output=run("python3","tools/verify_publish.py",CID,"--expect-title",entry["title"],"--expect-caption",entry["caption"])
          assert "0 failed" in output
          report=Path("reports/video-14-publication.md")
          with report.open("a") as f:
              f.write("\n\n## اصلاح جمله به درخواست نویسنده\n\n«"+OLD+"» با «"+NEW+"» جایگزین شد. متن فارسی، کپشن برین، تمام متاها و JSON-LD، نقل‌قول DES و ترجمهٔ انگلیسی هماهنگ شدند. متن‌های قبلی این گزارش، سوابق انتشار اولیه‌اند و این اصلاح جایگزین آن جمله است.\n\n")
              f.write(next(line for line in output.splitlines() if "passed," in line and "failed" in line)+"\n")
          print("CORRECTION_FILES",run("git","diff","--stat"),flush=True)
          run("git","config","user.name","dentcast-hub")
          run("git","config","user.email","241556184+dentcast-hub@users.noreply.github.com")
          run("git","add","-A")
          run("git","commit","-m","Correct video 14: crown comes out with the post")
          run("git","push","origin","HEAD:codex/correct-video-14-post")
          print("CORRECTION_VERIFIED",flush=True)
          
          PY

name: Spot finalize revised telemetry
on:
  push:
    branches: [fix/spot-measurement-reliability-20261022]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[spot-final-check]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentcast
          POSTGRES_PASSWORD: dentcast
          POSTGRES_DB: dentcast_plus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spot-measurement-reliability-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plus-api/package-lock.json
      - name: Canonical asset bump and check
        id: asset
        continue-on-error: true
        run: |
          python3 tools/asset_version.py --bump
          python3 tools/asset_version.py --check
      - id: install
        continue-on-error: true
        working-directory: plus-api
        run: npm ci
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: plus-api
        run: npm run build
      - id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: plus-api
        run: |
          set -o pipefail
          npm test -- test/spot.dom.test.ts test/spot-stats.test.ts test/view-stats.test.ts test/admin-member-spot.test.ts test/admin-member-spot.dom.test.ts 2>&1 | tee /tmp/spot-test-results.log
      - name: Commit and report pass or failure
        if: always()
        env:
          ASSET: ${{ steps.asset.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/spot-finish-temporary.yml
          if [ "$TESTS" != "success" ]; then
            tail -n 240 /tmp/spot-test-results.log > spot/spot-test-failures.txt
            git add spot/spot-test-failures.txt
          fi
          git add -A
          git commit -m "Spot final verification: asset=$ASSET install=$INSTALL build=$BUILD tests=$TESTS [spot-final-check]"
          git push origin HEAD:fix/spot-measurement-reliability-20261022

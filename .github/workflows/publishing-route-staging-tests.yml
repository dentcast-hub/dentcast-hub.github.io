name: Publishing modular route planner staging tests
on:
  push:
    branches:
      - refactor/publishing-modular-workflow
    paths:
      - 'tools/dentcast_route_plan_draft.py'
      - 'tests/test_dentcast_route_plan_draft.py'
      - 'tools/validate_dentcast_route_plan_draft.py'
      - 'tests/test_dentcast_route_plan_validator.py'
      - 'tools/dentcast_checkpoint_draft.py'
      - 'tests/test_dentcast_checkpoint_draft.py'
      - 'tools/dentcast_checkpoint_store_draft.py'
      - 'tests/test_dentcast_checkpoint_store_draft.py'
      - 'tests/test_dentcast_staging_integration.py'
      - 'tools/audit_dentcast_route_dependencies.py'
      - 'tests/test_dentcast_route_dependencies.py'
      - 'tools/dentcast_module_dispatch_draft.py'
      - 'tests/test_dentcast_module_dispatch_draft.py'
      - 'tools/dentcast_orchestrator_draft.py'
      - 'tests/test_dentcast_orchestrator_draft.py'
      - 'tests/test_dentcast_checkpoint_cas.py'
      - 'tools/audit_dentcast_stage2_contract.py'
      - 'tests/test_dentcast_stage2_contract.py'
      - 'tools/dentcast_stage3_route.py'
      - 'tools/dentcast_stage3_modules.py'
      - 'tools/dentcast_stage3_orchestrator.py'
      - 'tests/test_dentcast_stage3_runtime.py'
      - 'tools/dentcast_stage3_bridge.py'
      - 'tools/dentcast_stage3_apply.py'
      - 'tests/test_dentcast_stage3_apply.py'
      - 'tools/dentcast_github_memory.py'
      - 'tests/test_dentcast_github_memory.py'
      - 'tools/dentcast_fidelity_resume.py'
      - 'tests/test_dentcast_fidelity_resume.py'
      - 'tools/dentcast_stage6_handoff.py'
      - 'tests/test_dentcast_stage6_handoff.py'
      - 'tools/audit_dentcast_stage7_parity.py'
      - 'tests/test_dentcast_stage7_parity.py'
      - '.dentcast/workflows/README.md'
      - '.dentcast/workflows/agent-parity.md'
      - '.dentcast/workflows/modules/[0-1][0-9]-*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.cursor/rules/dentcast-*.mdc'
      - '.dentcast/workflows/modules/MODULE-REGISTRY.draft.json'
      - '.dentcast/workflows/modules/MODULE-CONTRACTS.v1.json'
      - '.github/workflows/publishing-route-staging-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-planner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate registry JSON
        run: python -m json.tool .dentcast/workflows/modules/MODULE-CONTRACTS.v1.json > /dev/null
      - name: Run staging planner unit tests
        run: |
          python -m unittest discover -s tests -p test_dentcast_route_plan_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_route_plan_validator.py -v
          python -m unittest discover -s tests -p test_dentcast_checkpoint_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_checkpoint_store_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_staging_integration.py -v
          python -m unittest discover -s tests -p test_dentcast_route_dependencies.py -v
          python -m unittest discover -s tests -p test_dentcast_module_dispatch_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_orchestrator_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_checkpoint_cas.py -v
          python -m unittest discover -s tests -p test_dentcast_stage2_contract.py -v
          python -m unittest discover -s tests -p test_dentcast_stage3_runtime.py -v
          python -m unittest discover -s tests -p test_dentcast_stage3_apply.py -v
          python -m unittest discover -s tests -p test_dentcast_github_memory.py -v
          python -m unittest discover -s tests -p test_dentcast_fidelity_resume.py -v
          python -m unittest discover -s tests -p test_dentcast_stage6_handoff.py -v
          python -m unittest discover -s tests -p test_dentcast_stage7_parity.py -v
      - name: Audit Stage 2 canonical traceability
        run: python tools/audit_dentcast_stage2_contract.py

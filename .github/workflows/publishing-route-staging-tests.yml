name: Publishing modular route planner staging tests
on:
  push:
    branches:
      - refactor/publishing-modular-workflow
    paths:
      - 'tools/dentcast_route_plan_draft.py'
      - 'tests/test_dentcast_route_plan_draft.py'
      - 'tools/validate_dentcast_route_plan_draft.py'
      - 'tests/test_dentcast_route_plan_validator.py'
      - 'tools/dentcast_checkpoint_draft.py'
      - 'tests/test_dentcast_checkpoint_draft.py'
      - 'tools/dentcast_checkpoint_store_draft.py'
      - 'tests/test_dentcast_checkpoint_store_draft.py'
      - 'tests/test_dentcast_staging_integration.py'
      - 'tools/audit_dentcast_route_dependencies.py'
      - 'tests/test_dentcast_route_dependencies.py'
      - '.dentcast/workflows/modules/MODULE-REGISTRY.draft.json'
      - '.dentcast/workflows/modules/MODULE-CONTRACTS.v1.json'
      - '.github/workflows/publishing-route-staging-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-planner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate registry JSON
        run: python -m json.tool .dentcast/workflows/modules/MODULE-CONTRACTS.v1.json > /dev/null
      - name: Run staging planner unit tests
        run: |
          python -m unittest discover -s tests -p test_dentcast_route_plan_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_route_plan_validator.py -v
          python -m unittest discover -s tests -p test_dentcast_checkpoint_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_checkpoint_store_draft.py -v
          python -m unittest discover -s tests -p test_dentcast_staging_integration.py -v
          python -m unittest discover -s tests -p test_dentcast_route_dependencies.py -v

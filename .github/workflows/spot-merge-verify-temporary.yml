name: Spot final main-sync and regression check
on:
  push:
    branches: [fix/spot-measurement-reliability-20261022]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[spot-merge-ready]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentcast
          POSTGRES_PASSWORD: dentcast
          POSTGRES_DB: dentcast_plus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spot-measurement-reliability-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plus-api/package-lock.json
      - id: sync
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main > /tmp/spot-sync.log 2>&1 || { cat /tmp/spot-sync.log; git merge --abort; exit 1; }
      - id: asset
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/asset_version.py --bump
          python3 tools/asset_version.py --check
      - id: install
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        working-directory: plus-api
        run: npm ci
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: plus-api
        run: npm run build
      - id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: plus-api
        run: |
          set -o pipefail
          npm test -- test/spot.dom.test.ts test/spot-stats.test.ts test/view-stats.test.ts test/admin-member-spot.test.ts test/admin-member-spot.dom.test.ts 2>&1 | tee /tmp/spot-check.log
      - name: Finalize revision and leave explicit test outcome
        if: always()
        env:
          SYNC: ${{ steps.sync.outcome }}
          ASSET: ${{ steps.asset.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/spot-merge-verify-temporary.yml
          if [ "$SYNC" != "success" ]; then
            cat /tmp/spot-sync.log > spot/spot-test-failures.txt
          elif [ "$ASSET" != "success" ] || [ "$BUILD" != "success" ] || [ "$TESTS" != "success" ]; then
            if [ -f /tmp/spot-check.log ]; then tail -n 250 /tmp/spot-check.log > spot/spot-test-failures.txt; else echo "asset=$ASSET build=$BUILD tests=$TESTS" > spot/spot-test-failures.txt; fi
          fi
          git add -A
          git commit -m "Spot main sync verification: sync=$SYNC asset=$ASSET build=$BUILD tests=$TESTS [spot-merge-ready]"
          git push origin HEAD:fix/spot-measurement-reliability-20261022

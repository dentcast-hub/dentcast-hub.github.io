name: Live publishing contracts and recovery guards
on:
  push:
    branches: [main, 'fix/**', 'refactor/**']
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.cursor/**'
      - '.cursor/hooks.json'
      - '.claude/**'
      - '.claude/settings.json'
      - '.agents/**'
      - '.codex/**'
      - '.dentcast/PUBLISH-HANDOFF.md'
      - '.dentcast/publication-reports/**'
      - '.dentcast/workflows/**'
      - 'tools/dentcast_publish*.py'
      - 'tools/dentcast_connected_cut_gates.py'
      - 'tools/verify_publish.py'
      - 'tools/dentcast_global_rules.py'
      - 'tests/test_dentcast_global_rules.py'
      - '.dentcast/des-exemptions.json'
      - 'tests/test_dentcast_publish*.py'
      - 'tests/test_dentcast_agent_entrypoint_migration.py'
      - 'tests/publishing-hooks.test.mjs'
      - 'tests/test_dentcast_session_hooks.py'
      - 'tests/test_verify_publish_checks.py'
      - 'tests/test_queue_frozen_des.py'
      - 'tools/queue_install_des.py'
      - 'tools/queue_apply.py'
      - 'tools/queue_manifest.py'
      - 'tools/queue_ledger.py'
      - 'tools/queue_publish.py'
      - '.github/workflows/queue-publish.yml'
      - '.github/workflows/queue-publish-done.yml'
      - 'tests/test_queue_apply.py'
      - 'tools/queue_stamp.py'
      - 'tools/queue_fidelity_prep.py'
      - 'tools/pdf_source_text.py'
      - 'tools/des_fidelity_units.py'
      - 'tests/test_queue_prep_tools.py'
      - 'tests/test_des_v35_fidelity_units.py'
      - 'tests/test_queue_prep_fixes.py'
      - 'tools/des_record_guard.py'
      - 'tools/des_library.py'
      - 'tests/test_des_record_guard.py'
      - 'tools/related_cap.py'
      - '.dentcast/queue-frozen-des.json'
      - 'tests/fixtures/**'
      - 'scripts/**'
      - 'scripts/*publishing*.mjs'
      - 'scripts/publishing-stop-guard.py'
      - 'scripts/cursor-parity-notice.mjs'
      - '.githooks/**'
      - '.workflow-sync.json'
      - '.github/workflows/publishing-live-contract-tests.yml'
      - '.github/workflows/sitemap_only.yml'
      - 'tools/update-homepage-counters.py'
      - 'tools/dentcast_text_io.py'
      - 'tools/text_io.mjs'
      - 'tools/build_*.py'
      - 'tools/build_*.mjs'
      - 'tools/stamp-version.py'
      - 'tools/hashtag_ref.py'
      - '.github/scripts/*.py'
      - 'tools/check_publish_merge_gate.py'
      - 'tests/test_publish_merge_gate.py'
      - 'plus/exam-questions.json'
      - '.dentcast/exam-edit-approvals.json'
      - 'tools/validate_exam_questions.py'
      - 'tools/faq_corpus_extract.py'
      - 'tools/strip_faq_schema.py'
      - 'tests/test_exam_bank_guard.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject pull requests with an unfinished publication
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_publish_merge_gate.py
      - name: Check publication merge gate and builder ordering
        run: python3 -m unittest discover -s tests -p test_publish_merge_gate.py -v
      - name: Check exact scoped global-rule coverage
        run: python3 -m unittest discover -s tests -p test_dentcast_global_rules.py -v
      - name: Check active entrypoints and preserved source rules
        run: python3 -m unittest discover -s tests -p test_dentcast_agent_entrypoint_migration.py -v
      - name: Check live checkpoint and completion lifecycle
        run: python3 -m unittest discover -s tests -p 'test_dentcast_publish*.py' -v
      - name: Check session-start, Cursor and Codex hook commands
        run: python3 -m unittest discover -s tests -p test_dentcast_session_hooks.py -v
      - name: Check Phase F verifier rows
        run: python3 -m unittest discover -s tests -p test_verify_publish_checks.py -v
      - name: Check the publish-queue frozen DES/Fidelity order (founder 1405/08/11)
        run: python3 -m unittest discover -s tests -p test_queue_frozen_des.py -v
      - name: Check the queue-lane assembler and publish-day tool (byte-preserving writers, refusals, lock/unlock, status)
        run: python3 -m unittest discover -s tests -p test_queue_apply.py -v
      - name: Check the queue preparation tools (draft page, Fidelity prep, freeze stamp, PDF text, exam draft)
        run: python3 -m unittest discover -s tests -p test_queue_prep_tools.py -v
      - name: Check FIDELITY units, two checker runs and the source conclusion
        run: python3 -m unittest discover -s tests -p test_des_v35_fidelity_units.py -v
      - name: Check the queue-prep fixes of item 24 (caption carry, sentence split, empty conclusion, 05 shapes, cap count, cleanup)
        run: python3 -m unittest discover -s tests -p test_queue_prep_fixes.py -v
      - name: Check the DES rating rule, one record per paper and the rating audit (module 08 Part 2d, Part 3(7))
        run: python3 -m unittest discover -s tests -p test_des_record_guard.py -v
      - name: Check hook adapters and shared rule routing
        run: node --test tests/publishing-hooks.test.mjs
      - name: Check prior data guards (exam bank append-only, bank files kept)
        run: python3 -m unittest discover -s tests -p test_exam_bank_guard.py -v
      - name: Existing exam questions are never removed or edited
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          baseline=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            baseline=(--baseline "origin/$PR_BASE_REF")
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] \
               && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            baseline=(--baseline "$EVENT_BEFORE")
          fi
          python3 tools/validate_exam_questions.py "${baseline[@]}"
      - name: Inspect committed checkpoint or cleanup boundary
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual non-publication dispatch; checkpoint guard not applicable."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "refs/heads/$PR_BASE_REF"
            diff_range="FETCH_HEAD...HEAD"
          else
            diff_range="$EVENT_BEFORE..$EVENT_SHA"
          fi
          if git -c core.quotepath=false diff --name-only "$diff_range" | grep -Eq '^(.dentcast/PUBLISH-HANDOFF.md|dentcast-brain.json|dentcast.json|chairside/|dentcast-plus/|episodes/|glossary/|insight/|litecast/|metanotes/|notecast/|plak-sefr/|dentai/promptologist/|sharehub/|taraz/|plus/des-scores.json)'; then
            python3 tools/dentcast_publish_handoff.py guard --phase ci
          else
            echo "No publication or handoff files changed; checkpoint guard not applicable."
          fi

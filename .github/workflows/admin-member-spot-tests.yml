name: Admin members and Spot controls
on:
  pull_request:
    paths:
      - 'plus-api/**'
      - 'spot/**'
      - '.github/workflows/admin-member-spot-tests.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentcast
          POSTGRES_PASSWORD: dentcast
          POSTGRES_DB: dentcast_plus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plus-api/package-lock.json
      - name: Refresh required asset stamps on the authorized feature branch
        if: github.head_ref == 'feat/admin-members-spot-controls' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 tools/asset_version.py --bump
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'Refresh required Spot asset version stamps'
            git push origin HEAD:feat/admin-members-spot-controls
          fi
      - run: python3 tools/asset_version.py --check
      - run: npm ci
        working-directory: plus-api
      - run: npm run build
        working-directory: plus-api
      - name: Admin, rendering, payment-state and subscription regressions
        run: npm test -- test/admin-member-spot.test.ts test/admin.test.ts test/admin-resolve-user.test.ts test/admin-page-scripts.test.ts test/spot.dom.test.ts test/spot-stats.test.ts test/subscription.test.ts test/subscription-backfill.test.ts
        working-directory: plus-api

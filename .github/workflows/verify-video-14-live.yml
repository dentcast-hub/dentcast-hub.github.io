name: Verify published video 14
on:
  push:
    branches: [codex/verify-video-14-live]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live pages and catalogs
        run: |
          python3 - <<'PY'
          import html, json, re, time, urllib.request
          from html.parser import HTMLParser
          TITLE = json.loads("\"پست و کور توی دندون لق می‌خوره و ثبات نداره، حالا چی‌کار کنیم؟\"")
          CAPTION = json.loads("\"پست و کور توی دندون لق می‌خوره و ثبات نداره، حالا چی‌کار کنیم؟\\n\\nوقتی پست و کور روی دندون ثبات نداره، یکی از اولین چیزایی که به ذهنم می‌رسه یه نقطه تیزه، چه روی دندون چه روی خود پست و کور، که نمی‌ذاره پست کامل بنشینه.\\n\\nمثلاً یه قسمتی از دندون تیز بوده و من با دورالی روش پست و کور ساختم. اولش کیپ بوده و ثبات داشته، ولی بعد از ریختگی همون نقطه تیز مانع نشستن کامل شده. یا نوک پست خیلی تیز بوده و بعد از تبدیل شدن به فلز، ندولی یا ضایعه‌ای روش ایجاد شده و نمی‌ذاره بشینه.\\n\\nبرای همین توی همچین حالتی اول برمی‌گردم جای تیز رو بررسی می‌کنم و اگه لازم بود اصلاحش می‌کنم. خیلی وقتا همین مشکل رو حل می‌کنه، اما تو این مورد حل نشد.\\n\\nپس پست و کور رو از اول تکرار کردم. چون با این عدم ثبات نمی‌تونی روکش رو روش بذاری. وقتی روکش وارد سیکل جویدن بشه و نیروهای جویدن بهش وارد بشه، اگه ثبات نداشته باشیم، این نیروها به اینترفیس سمان و پست منتقل میشه، نیروی برشی ایجاد میکنه و در نهایت روکش همراه با سمان از دندون در میاد.\"")
          def norm(s): return re.sub(r"\s+"," ",s).strip()
          class Text(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,s): self.parts.append(s)
          def text(s):
              p=Text();p.feed(s);return "".join(p.parts)
          checks=[
           ("org-page","https://dentcast.org/dentcast-plus/video-14.html","fa"),
           ("ir-page","https://dentcast.ir/dentcast-plus/video-14.html","fa"),
           ("org-English","https://dentcast.org/dentcast-plus/en/video-14.html","en"),
           ("ir-English","https://dentcast.ir/dentcast-plus/en/video-14.html","en"),
           ("org-list","https://dentcast.org/dentcast-plus/index.html","index"),
           ("ir-list","https://dentcast.ir/dentcast-plus/index.html","index"),
           ("org-search","https://dentcast.org/plus/content-index.json","catalog"),
           ("ir-search","https://dentcast.ir/plus/content-index.json?t=video14-a17cc1b","catalog")
          ]
          for name,url,kind in checks:
              for attempt in range(1,2):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"DentCast-Publication-Check/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          status=r.status
                          doc=r.read().decode("utf-8")
                      assert status==200
                      if kind=="fa":
                          h1=text(re.search(r"<h1[^>]*>([\s\S]*?)</h1>",doc).group(1))
                          assert norm(h1)==norm(TITLE), ("title",h1)
                          region=re.search(r'<div class="text-box">([\s\S]*?)</div>',doc).group(1)
                          paragraphs=re.findall(r"<p(?:\s[^>]*)?>([\s\S]*?)</p>",region)
                          assert norm("\n\n".join(text(p) for p in paragraphs))==norm(CAPTION),"caption"
                          assert "M9a0Oxm7ve/origin_config.json" in doc
                          assert "youtube.com/embed/uRwMJoWCEdw" in doc
                          assert 'href="en/video-14.html"' in doc
                          assert '"FAQPage"' not in doc
                      elif kind=="en":
                          assert "noindex, follow" in doc
                          assert 'href="../video-14.html"' in doc
                          assert "M9a0Oxm7ve/origin_config.json" in doc
                      elif kind=="index":
                          assert 'href="video-14.html"' in doc and TITLE in doc
                      else:
                          assert "dentcast-plus/video-14" in doc
                      print("LIVE_OK",name,status,url,flush=True)
                      break
                  except Exception as e:
                      print("LIVE_RETRY",name,attempt,type(e).__name__,str(e)[:200],flush=True)
                      if attempt==1: raise
                      time.sleep(15)
          print("LIVE_VERIFICATION_COMPLETE: 8/8",flush=True)
          
          PY

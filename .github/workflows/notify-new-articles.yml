name: Notify new articles

# Fires the DentCast Plus `article_published` event on a REAL editorial publish.
# A page qualifies only when it (1) is an article content type, (2) carries the
# explicit `<meta name="dc-notify" content="true">` publish marker, and (3) has a
# canonical content_id not notified before. The push diff only selects candidates;
# tools/notify_new_articles.py enforces the three gates and the API dedups on retry.
#
# One-time before enabling: run the backfill so existing pages never fire as new:
#   curl -u "$USER:$PASS" -X POST "$PLUS_API_BASE/admin/articles/backfill"
#
# Required repository secrets: PLUS_API_BASE, PLUS_ADMIN_USER, PLUS_ADMIN_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      page:
        description: 'Published Persian page to announce independently in Telegram (e.g. chairside/chairside-40.html)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '**/*.html'

# New pushes supersede in-flight runs; never double-fire for rapid pushes.
concurrency:
  group: notify-new-articles
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the before..after range to diff changed pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fire article_published for real publishes
        if: github.event_name == 'push'
        env:
          PLUS_API_BASE: ${{ secrets.PLUS_API_BASE }}
          ADMIN_USER: ${{ secrets.PLUS_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.PLUS_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PLUS_API_BASE" ] || [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Plus API secrets not configured; skipping new-article notification."
            exit 0
          fi
          python tools/notify_new_articles.py \
            --base-sha "${{ github.event.before }}" \
            --head-sha "${{ github.sha }}"

      # Announce the same publishes in the Telegram channel, one message per item.
      # Runs even when the step above was skipped for missing Plus secrets: the two
      # channels are independent. It works from a GitHub runner precisely because
      # api.telegram.org is NOT reachable from our own server in Iran.
      # With no secrets set it prints why and exits 0, so the workflow stays green
      # until the channel is wired up.
      - name: Announce new content in Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # Which mirror the channel links to. A repository VARIABLE (not a
          # secret — it is a public URL) so the domain can be switched from the
          # GitHub UI without a code change or a deploy; falls back to .org.
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://dentcast.org' }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PAGE: ${{ inputs.page }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Validate the path without ever interpolating input into shell code.
            python - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          page = Path(os.environ['MANUAL_PAGE'])
          target = (root / page).resolve()
          if page.is_absolute() or not target.is_relative_to(root) or target.suffix != '.html' or not target.is_file():
              raise SystemExit('page must be an existing repository-relative HTML file')
          if any(part.startswith('.') or part in ('node_modules', 'tmp') for part in page.parts):
              raise SystemExit('page must be a published site page')
          PY
            python tools/announce_telegram_channel.py --files "$MANUAL_PAGE"
          else
            python tools/announce_telegram_channel.py \
              --base-sha "${{ github.event.before }}" \
              --head-sha "${{ github.sha }}"
          fi

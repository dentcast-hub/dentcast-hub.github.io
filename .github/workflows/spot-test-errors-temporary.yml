name: Spot capture failing regressions
on:
  push:
    branches: [fix/spot-measurement-reliability-20261022]
permissions:
  contents: write
jobs:
  capture:
    if: "!contains(github.event.head_commit.message, '[spot-errors-captured]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentcast
          POSTGRES_PASSWORD: dentcast
          POSTGRES_DB: dentcast_plus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spot-measurement-reliability-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plus-api/package-lock.json
      - run: npm ci
        working-directory: plus-api
      - name: Capture relevant failing tests
        id: tests
        continue-on-error: true
        working-directory: plus-api
        run: |
          set -o pipefail
          npm test -- test/spot.dom.test.ts test/spot-stats.test.ts test/view-stats.test.ts test/admin-member-spot.test.ts test/admin-member-spot.dom.test.ts 2>&1 | tee /tmp/spot-failed-tests.log
      - name: Save failures and remove temporary runner
        if: always()
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/spot-test-errors-temporary.yml
          if [ "$OUTCOME" != "success" ]; then
            tail -n 280 /tmp/spot-failed-tests.log > spot/spot-test-failures.txt
            git add spot/spot-test-failures.txt
          fi
          git commit -m "Spot test error capture: $OUTCOME [spot-errors-captured]"
          git push origin HEAD:fix/spot-measurement-reliability-20261022

name: One-time Spot pageview cache-stamp preparation
on:
  push:
    branches:
      - fix/spot-pageview-denominator-20261021
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref_name == 'fix/spot-pageview-denominator-20261021'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spot-pageview-denominator-20261021
          persist-credentials: true
      - name: Stamp and verify the current branch's asset graphs
        run: |
          python3 tools/asset_version.py --bump
          python3 tools/asset_version.py --check
      - name: Commit stamped assets and remove this temporary helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-spot-pageview-stamp.yml
          git add -A
          git commit -m "Restamp browser assets after Spot boot ordering fix"
          git push origin HEAD:fix/spot-pageview-denominator-20261021

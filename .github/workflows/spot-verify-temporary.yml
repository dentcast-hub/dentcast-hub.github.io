name: Spot one-time premerge verification
on:
  push:
    branches: [fix/spot-measurement-reliability-20261022]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[spot-validation]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentcast
          POSTGRES_PASSWORD: dentcast
          POSTGRES_DB: dentcast_plus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spot-measurement-reliability-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plus-api/package-lock.json
      - id: asset
        continue-on-error: true
        run: python3 tools/asset_version.py --check
      - id: install
        continue-on-error: true
        run: npm ci
        working-directory: plus-api
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
        working-directory: plus-api
      - id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npm test -- test/spot.dom.test.ts test/spot-stats.test.ts test/view-stats.test.ts test/admin-member-spot.test.ts test/admin-member-spot.dom.test.ts
        working-directory: plus-api
      - name: Record verification outcome, remove temporary runner
        if: always()
        env:
          ASSET: ${{ steps.asset.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/spot-verify-temporary.yml
          git commit -m "Spot verification: assets=$ASSET install=$INSTALL build=$BUILD tests=$TESTS [spot-validation]"
          git push origin HEAD:fix/spot-measurement-reliability-20261022

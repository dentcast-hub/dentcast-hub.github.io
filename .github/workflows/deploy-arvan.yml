name: Deploy DentCast to Arvan Object Storage

on:
  push:
    branches: ["main"]   # اگر master است، بنویس master
  # اجرای دستی از تبِ Actions.
  #
  # چرا لازم است: این ورک‌فلو تنها چیزی‌ست که dentcast.ir را می‌سازد (‏.org را
  # خودِ GitHub Pages سرو می‌کند). ولی وقتی یک PR از راهِ API مرج می‌شود — نه با
  # دکمهٔ وب یا با git push — گیت‌هاب رویدادِ push صادر نمی‌کند؛ رویداد dynamic
  # می‌شود و فقط Pages راه می‌افتد. نتیجه‌اش این است که .org به‌روز می‌شود و .ir
  # بی‌صدا عقب می‌ماند، بدون هیچ ران قرمزی که خبر بدهد (۲۰۲۶-۰۸-۰۶: دو مرجِ
  # پشتِ سرِ هم این‌طور جا افتادند).
  #
  # با این ورودی، همگام‌سازیِ .ir همیشه یک دکمه فاصله دارد: Actions ← این
  # ورک‌فلو ← Run workflow (روی main).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AWS CLI via pip
        run: |
          python3 -m pip install --upgrade pip
          pip install awscli

      - name: Sync site to Arvan S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          ARVAN_BUCKET: ${{ secrets.ARVAN_BUCKET }}
          ARVAN_ENDPOINT: ${{ secrets.ARVAN_ENDPOINT }}
        run: |
          aws s3 sync . "s3://$ARVAN_BUCKET" \
            --endpoint-url "$ARVAN_ENDPOINT" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      # Cache parity with .org — the .ir mirror's silent-staleness guard.
      #
      # The repo's _headers file marks dc-nav.js and /plus/* as no-cache, but
      # only Cloudflare (.org) reads that file; Arvan ignores it entirely (see
      # the comment in _headers itself). So on .ir those objects can be served
      # from an edge/browser cache long after a deploy — and dc-nav.js is the
      # file that carries the SPOT_V stamp which busts spot.js.
      #
      # That combination fails in the worst possible way: a cached dc-nav.js
      # keeps asking for the OLD spot.js while spot-config.json (fetched
      # no-store) is already the NEW one. An old build silently drops every
      # creative it does not understand — on 2026-08-03 that meant all four
      # rotation beats on .ir fell back to the house ad while .org showed the
      # sponsor's campaign correctly. Nothing errored; the ads simply were not
      # there. Stamping no-cache on the three files that must never go stale
      # makes .ir revalidate like .org does.
      - name: Force revalidation on the cache-sensitive files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          ARVAN_BUCKET: ${{ secrets.ARVAN_BUCKET }}
          ARVAN_ENDPOINT: ${{ secrets.ARVAN_ENDPOINT }}
        run: |
          set -e
          # Content-Type is passed explicitly: with --metadata-directive REPLACE
          # the CLI re-guesses it, and a wrong guess on a module is worse than a
          # stale cache (the browser refuses to execute it).
          stamp() {
            aws s3 cp "s3://$ARVAN_BUCKET/$1" "s3://$ARVAN_BUCKET/$1" \
              --endpoint-url "$ARVAN_ENDPOINT" \
              --cache-control "no-cache" \
              --content-type "$2" \
              --metadata-directive REPLACE
          }
          stamp "dc-nav.js"             "application/javascript; charset=utf-8"
          stamp "spot/spot.js"          "application/javascript; charset=utf-8"
          stamp "spot/spot-config.json" "application/json; charset=utf-8"

          # The Plus app needs the same treatment for a stronger reason: it has
          # no cache-busting lever at all. Its page entry points are still
          # loaded as `?v=1` (never bumped since they were written) and its 141
          # internal ES imports — `import { API_BASES } from './config.js'` and
          # friends — carry no query string whatsoever, because a module
          # specifier is a plain path. On .org the _headers `/plus/*` no-cache
          # rule is what keeps those honest; on .ir nothing did, so a stale
          # module could survive indefinitely with no version to bump.
          #
          # One pass per extension with an explicit Content-Type: a recursive
          # copy re-guesses the type per key, and a mis-guessed module is worse
          # than a stale one (the browser refuses to execute it outright).
          stamp_tree() {
            aws s3 cp "s3://$ARVAN_BUCKET/plus/" "s3://$ARVAN_BUCKET/plus/" \
              --endpoint-url "$ARVAN_ENDPOINT" \
              --recursive --exclude "*" --include "$1" \
              --cache-control "no-cache" \
              --content-type "$2" \
              --metadata-directive REPLACE
          }
          stamp_tree "*.js"          "application/javascript; charset=utf-8"
          stamp_tree "*.css"         "text/css; charset=utf-8"
          stamp_tree "*.html"        "text/html; charset=utf-8"
          stamp_tree "*.json"        "application/json; charset=utf-8"
          stamp_tree "*.webmanifest" "application/manifest+json; charset=utf-8"

      # vCard must be served as text/vcard so phones open it as a contact
      # (mimetype guessing may fall back to octet-stream → forced download).
      - name: Fix Content-Type for vCard files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          ARVAN_BUCKET: ${{ secrets.ARVAN_BUCKET }}
          ARVAN_ENDPOINT: ${{ secrets.ARVAN_ENDPOINT }}
        run: |
          aws s3 cp "card/dr-foad-shahabian.vcf" \
            "s3://$ARVAN_BUCKET/card/dr-foad-shahabian.vcf" \
            --endpoint-url "$ARVAN_ENDPOINT" \
            --content-type "text/vcard; charset=utf-8" \
            --metadata-directive REPLACE
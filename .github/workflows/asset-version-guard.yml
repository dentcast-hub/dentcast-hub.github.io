name: Asset cache-buster guard

# The shared assets (dc-nav.js, the /plus/ entry modules, the shared CSS) are
# loaded through a stamped URL — /dc-nav.js?v=39. The path never changes, so the
# stamp is the ONLY thing that makes a returning visitor's browser fetch the new
# file.
#
# On 2026-08-05 the «اشتراک» button was added to the toolbar drawer. Its markup
# went into index.html (HTML, short cache — it arrived); its click handler went
# into dc-nav.js, stamped ?v=39, unchanged. On dentcast.org the result was a
# button that was visible and did nothing at all. Eight /plus/ entry modules
# shipped in the same batch with the same omission.
#
# tools/asset_version.py fingerprints each asset's whole IMPORT GRAPH — the
# missing button lived in premium-cta.js, which the entry modules import and
# which carries no stamp of its own — and compares it with the version recorded
# in .dentcast/asset-versions.json. Remembering to bump is not a thing anyone
# should have to do.
on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every ?v= stamp must match the content it points at
        run: python3 tools/asset_version.py --check

      # index.html paints the signed-out Plus card from static markup, so the
      # rules that size it are mirrored out of plus/plus.css into an inline
      # <style>. plus.css stays the source of truth; the mirror is generated.
      # Without this gate a redesign under a @home-critical marker would land
      # in plus.css only, and the homepage would paint the card at the OLD
      # size and then re-lay-out when the async stylesheet arrived — exactly
      # the layout shift the static card exists to remove.
      - name: Homepage critical CSS must mirror plus/plus.css
        run: python3 tools/build_home_critical_css.py --check

      var c=lcCards[d[0]]; if(!c) return;
      var t=ease(rng(p,d[1],d[2]))*Math.min(1,lcO*4);
      c.style.opacity=t;
      c.style.transform='translateY('+(1-t)*18+'px) scale('+(0.97+0.03*t)+')';
    });
    if(lcCtaLink){
      var lt=ease(rng(p,0.41,0.49))*Math.min(1,lcO*4);
      lcCtaLink.style.opacity=lt;
      lcCtaLink.style.transform='translateY('+(1-lt)*8+'px)';
    }

    /* === SCENE 3: ARTICLES (0.52 → 0.82) — fade-out delayed so the 3rd suggestion lingers === */
    const artO=Math.min(ease(rng(p,0.52,0.60)),ease(1-rng(p,0.74,0.82)));
    setO(artScene,artO);
    setPE(artScene,artO>0.05);
    const artItems=document.querySelectorAll('.pt-article-item');
    [[0,0.54,0.62],[1,0.59,0.67],[2,0.64,0.72]].forEach(function(d){
      var c=artItems[d[0]]; if(!c) return;
      var t=ease(rng(p,d[1],d[2]))*Math.min(1,artO*4);
      c.style.opacity=t;
      c.style.transform='translateX('+(1-t)*14+'px) scale('+(0.97+0.03*t)+')';
    });

    /* === SCENE 4: CTA (0.83 → 0.94 full) — shifted to make room for extended Scene 3 === */
    const ctaO=ease(rng(p,0.83,0.94));
    setO(ctaScene,ctaO);
    setPE(ctaScene,ctaO>0.05);
    if(ctaScene) ctaScene.style.transform='translateY('+(1-ctaO)*16+'px)';

    /* === BOTTOM GRADIENT === */
    if(gradBot) gradBot.style.opacity=ease(rng(p,0.62,0.80));
  }

  /* scroll listener */
  body.addEventListener('scroll',function(){
    if(!ticking){ ticking=true; requestAnimationFrame(update); }
  },{passive:true});

  /* keep the stage glued to the real viewport (URL-bar collapse, rotation…) */
  window.addEventListener('resize',function(){ measure(); sizeCanvas(); update(); });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',function(){ measure(); sizeCanvas(); update(); });
  }

  /* panel activation — double rAF ensures layout is computed after display:none→block */
  const panelEl=document.getElementById('panel-patient');
  if(panelEl){
    new MutationObserver(function(muts){
      if(muts.some(function(m){ return m.attributeName==='class'; })){
        if(panelEl.classList.contains('active')){
          startPreload();
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){
              measure();
              sizeCanvas();
              update();
              /* fallback: if canvas still blank, draw first loaded frame */
              if(lastIdx===-1){
                for(var fi=0;fi<frames.length;fi++){
                  if(frames[fi]&&frames[fi].complete&&frames[fi].naturalWidth){
                    ctx.clearRect(0,0,canvas.width,canvas.height);
                    drawFrame(frames[fi]);
                    lastIdx=fi;
                    break;
                  }
                }
              }
            });
          });
        }
      }
    }).observe(panelEl,{attributes:true});
    /* the remembered tab (dc:panel) is restored by an earlier script, so the
       panel can already be active before this observer exists */
    if(panelEl.classList.contains('active')) startPreload();
  }

})();
</script>

<script>
/* ── dcDose — weekly 35-minute presence player (homepage copy) ──
   Identical core & storage key to the dc-nav.js module on internal pages,
   so minutes accumulate across the whole site. Counts only real presence
   (tab visible + interaction in the last 60s); a write lock keeps multiple
   tabs at single-tab rate; week starts Saturday. UI here: topbar ring(s),
   the popover, and the weekly-dose row inside the latest-episode hero. */
(function () {
  'use strict';
  /* one dcDose instance per page: the homepage inline copy runs first and
     claims this flag, so the dc-nav.js copy bails and we never double-count */
  if (window.__dcDoseInit) return;
  window.__dcDoseInit = 1;
  /* Minutes-based weekly-presence widget retired (DentCast Plus, spec principle 3:
     no minutes target anywhere). The server-sourced Plus card (#dcPlusHomeCard,
     rendered by /plus/plus.js) replaces it. This early return also stops the
     localStorage presence counter. */
  return;
  var KEY = 'dcDose', WEEK_SEC = 35 * 60, TICK = 5000;

  function weekIdOf(d) {
    var off = (d.getDay() + 1) % 7; /* days since Saturday */
    var sat = new Date(d.getFullYear(), d.getMonth(), d.getDate() - off);
    return sat.getFullYear() + '-' + (sat.getMonth() + 1) + '-' + sat.getDate();
  }
  function weekId() { return weekIdOf(new Date()); }
  function load() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (!o || o.w !== weekId()) {
      /* new week: archive last week's seconds (only if it truly was LAST week)
         for the once-per-week greeting, then start fresh. pa = greeted flag,
         m = highest 5-min milestone already celebrated this week. */
      var lw = weekIdOf(new Date(Date.now() - 7 * 864e5));
      o = { w: weekId(), s: 0, t: 0, p: (o && o.w === lw && o.s) ? o.s : 0, pa: 0, m: 0 };
      save(o);
    } else if (o.m === undefined) {
      /* existing mid-week visitor from before milestones were tracked:
         seed m to the current mark so we don't retro-fire past milestones */
      o.m = Math.floor(o.s / 300); save(o);
    }
    return o;
  }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  function faNum(x) {
    return String(x).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; });
  }
  function fmt(sec) {
    sec = Math.floor(sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return faNum(m) + ':' + faNum((s < 10 ? '0' : '') + s);
  }

  var lastAct = Date.now();
  function poke() { lastAct = Date.now(); }
  ['scroll', 'touchstart', 'pointerdown', 'keydown', 'mousemove', 'click'].forEach(function (ev) {
    window.addEventListener(ev, poke, { passive: true });
  });
  var mb = document.getElementById('mobile-body');
  if (mb) mb.addEventListener('scroll', poke, { passive: true });
  function isActive() {
    return document.visibilityState === 'visible' && (Date.now() - lastAct) < 60000;
  }

  /* rings in both topbars (mobile shell + desktop col-C header) */
  var R = 14, C = 2 * Math.PI * R;
  var ticksHtml = '';
  for (var m5 = 5; m5 <= 30; m5 += 5) {
    ticksHtml += '<span class="dc-dose-tick" style="right:' + (m5 / 35 * 100).toFixed(2) + '%"></span>';
  }
  var rings = [];
  Array.prototype.forEach.call(document.querySelectorAll('.dc-topbar-actions'), function (bar) {
    if (bar.querySelector('.dc-dose-ring')) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'dc-dose-ring';
    b.setAttribute('aria-label', 'یادگیری هفتگی شما در دنت‌کست');
    b.innerHTML =
      '<svg viewBox="0 0 34 34" aria-hidden="true">' +
      '<circle class="dc-dr-bg" cx="17" cy="17" r="' + R + '"/>' +
      '<circle class="dc-dr-fg" cx="17" cy="17" r="' + R + '" stroke-dasharray="' + C + ' ' + C + '" stroke-dashoffset="' + C + '"/>' +
      '</svg><span class="dc-dr-min">۰</span>';
    bar.appendChild(b);
    rings.push(b);
  });

  /* popover */
  var pop = document.createElement('div');
  pop.className = 'dc-dose-pop';
  pop.innerHTML =
    '<div class="dc-dose-pop-title">یادگیری هفتگی شما با دنت‌کست</div>' +
    '<div class="dc-dose-pop-time">—</div>' +
    '<div class="dc-dose-bar"><div class="dc-dose-fill"></div>' + ticksHtml + '</div>' +
    '<div class="dc-dose-pop-status"><span class="dc-dose-live"></span><span class="dc-dose-pop-state">—</span></div>' +
    '<div class="dc-dose-pop-note">سعی کن هفته‌ای حداقل ۳۵ دقیقه با دنت‌کست باشی. شمارش: حضور فعال شما — خواندن یا شنیدن؛ ذخیره روی همین دستگاه · هفته از شنبه</div>';
  document.body.appendChild(pop);
  var popTime = pop.querySelector('.dc-dose-pop-time'),
      popFill = pop.querySelector('.dc-dose-fill'),
      popLive = pop.querySelector('.dc-dose-live'),
      popState = pop.querySelector('.dc-dose-pop-state'),
      popBar = pop.querySelector('.dc-dose-bar');

  function openPop(ring) {
    var r = ring.getBoundingClientRect();
    var w = 232, vw = window.innerWidth;
    pop.style.top = Math.round(r.bottom + 8) + 'px';
    pop.style.left = Math.round(Math.max(8, Math.min(vw - w - 8, r.left + r.width / 2 - w / 2))) + 'px';
    pop.classList.add('open');
    paint();
  }
  function closePop() { pop.classList.remove('open'); }
  rings.forEach(function (ring) {
    ring.addEventListener('click', function (e) {
      e.stopPropagation();
      pop.classList.contains('open') ? closePop() : openPop(ring);
    });
  });
  document.addEventListener('click', function (e) {
    if (pop.classList.contains('open') && !pop.contains(e.target)) closePop();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });

  /* once-per-week greeting — the first visit after the Saturday reset */
  (function greet() {
    var o = load();
    if (o.pa) return;
    o.pa = 1; save(o);
    if (!o.p || o.p < 60) return;
    var g = document.createElement('div');
    g.className = 'dc-dose-greet';
    g.setAttribute('role', 'status');
    g.innerHTML = 'هفته‌ی قبل <b>' + faNum(Math.round(o.p / 60)) + ' دقیقه</b> با دنت‌کست بودی — ببینیم این هفته چی‌کار می‌کنی!';
    document.body.appendChild(g);
    requestAnimationFrame(function () { requestAnimationFrame(function () { g.classList.add('show'); }); });
    function bye() {
      g.classList.remove('show');
      setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, 400);
    }
    g.addEventListener('click', bye);
    setTimeout(bye, 8000);
  })();

  /* hero weekly-dose row */
  var rowEl = document.getElementById('dcDoseRow'),
      rowLive = document.getElementById('dcDoseLiveHome'),
      rowLbl = document.getElementById('dcDoseLblHome'),
      rowTime = document.getElementById('dcDoseTimeHome'),
      rowFill = document.getElementById('dcDoseFillHome'),
      rowState = document.getElementById('dcDoseStateHome'),
      rowBar = document.getElementById('dcDoseBarHome'),
      rowTicks = rowBar ? rowBar.querySelectorAll('.dc-dose-tick') : [],
      popTicks = popBar ? popBar.querySelectorAll('.dc-dose-tick') : [];

  /* crossed 5-min milestones leave their tick lit */
  function lightTicks(list, sec) {
    for (var i = 0; i < list.length; i++) {
      list[i].classList.toggle('on', sec >= (i + 1) * 300);
    }
  }

  /* exact per-milestone message — mil = 1 → 5min, 7 → 35min (the goal) */
  var MIL_MSG = {
    1: '۵ دقیقه شد — خوب شروع کردی 👌',
    2: '۱۰ دقیقه — روی غلتک افتادی',
    3: '۱۵ دقیقه — یک‌سومِ راه',
    4: '۲۰ دقیقه — از نیمه گذشتی',
    5: '۲۵ دقیقه — کم مونده',
    6: '۳۰ دقیقه — فقط ۵ دقیقه تا هدف',
    7: 'به هدف ۳۵ دقیقه رسیدی ✓'
  };
  function milMsg(mil) {
    if (mil <= 0) return '';
    if (MIL_MSG[mil]) return MIL_MSG[mil];
    var mins = mil * 5;
    return mins >= 70 ? faNum(mins) + ' دقیقه — دو برابر هدف ❤'
      : faNum(mins) + ' دقیقه — فراتر از هدف 🔥';
  }
  var flashMsg = '', flashUntil = 0;

  /* at 70 minutes — double the goal — the presence dot becomes a tiny heart */
  var HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.6-4.7-10.1-9.3C.5 8.4 2.6 4.9 6 4.9c2 0 3.4 1.1 4.2 2.4L12 9l1.8-1.7c.8-1.3 2.2-2.4 4.2-2.4 3.4 0 5.5 3.5 4.1 6.8C19.6 16.3 12 21 12 21z"/></svg>';
  function setLive(el, active, loved) {
    if (!el) return;
    if (loved && !el.dataset.h) { el.dataset.h = '1'; el.innerHTML = HEART_SVG; }
    else if (!loved && el.dataset.h) { el.dataset.h = ''; el.innerHTML = ''; }
    el.classList.toggle('dc-heart', loved);
    el.classList.toggle('on', active);
  }

  function paint() {
    var o = load();
    /* 35:00 is the GOAL, not a ceiling: the bar/ring saturate at 35 but the
       clock keeps counting and the player stays alive past the goal */
    var sec = Math.min(o.s, WEEK_SEC), frac = sec / WEEK_SEC, done = o.s >= WEEK_SEC;
    var active = isActive();
    var loved = o.s >= WEEK_SEC * 2;

    /* milestone detection lives HERE, reading the exact o.s being displayed —
       so the effect/message can never fire ahead of the on-screen timer.
       o.m is the persisted highest celebrated 5-min mark. */
    var curMil = Math.floor(o.s / 300);
    if (curMil > (o.m || 0)) {
      o.m = curMil; save(o);
      flashMsg = milMsg(curMil);
      flashUntil = Date.now() + 6000;
      celebrate();
      if (curMil === 7 || curMil === 14) bigToast(curMil); /* 35-min goal, 70-min double */
      setTimeout(paint, 6100); /* clear the flash promptly between heartbeats */
    }
    var flashing = flashMsg && Date.now() < flashUntil;

    rings.forEach(function (ring) {
      ring.querySelector('.dc-dr-fg').style.strokeDashoffset = C * (1 - frac);
      ring.querySelector('.dc-dr-min').textContent = faNum(Math.floor(o.s / 60));
      ring.classList.toggle('dc-done', done);
    });
    if (rowEl) {
      rowEl.classList.toggle('dc-done', done);
      rowLbl.textContent = done ? 'یادگیری این هفته کامل شد ✓' : 'یادگیری هفتگی شما';
      rowTime.textContent = done ? fmt(o.s) + ' ✓' : fmt(o.s) + ' از ۳۵:۰۰';
      rowFill.style.width = (frac * 100) + '%';
      setLive(rowLive, active, loved);
      lightTicks(rowTicks, sec);
      if (rowState) {
        rowState.classList.toggle('dc-flash', !!flashing);
        rowState.textContent = flashing ? flashMsg
          : active ? 'در حال شمارش حضور شما'
          : 'متوقف — با فعالیت ادامه می‌یابد';
      }
    }
    if (pop.classList.contains('open')) {
      popTime.textContent = done ? fmt(o.s) + ' ✓' : fmt(o.s) + ' از ۳۵:۰۰';
      popFill.style.width = (frac * 100) + '%';
      popBar.classList.toggle('dc-done', done);
      setLive(popLive, active, loved);
      lightTicks(popTicks, sec);
      popState.classList.toggle('dc-flash', !!flashing);
      popState.textContent = flashing ? flashMsg
        : !active ? 'متوقف — با فعالیت ادامه می‌یابد'
        : done ? 'یادگیری این هفته کامل شد ✓'
        : 'در حال شمارش حضور شما';
    }
  }

  /* celebration toast + gentle haptic — only at the 35-min goal & 70-min double */
  function bigToast(mil) {
    var goal = mil === 7;
    var t = document.createElement('div');
    t.className = 'dc-dose-toast ' + (goal ? 'dc-goal' : 'dc-double');
    t.setAttribute('role', 'status');
    t.innerHTML = goal
      ? '<span class="dc-dose-toast-ic">🎯</span><span>به هدف <b>۳۵ دقیقه</b>‌ی این هفته رسیدی! کارت عالی بود</span>'
      : '<span class="dc-dose-toast-ic">❤️</span><span><b>۷۰ دقیقه</b> — دو برابرِ هدفِ هفته! فوق‌العاده‌ای</span>';
    document.body.appendChild(t);
    requestAnimationFrame(function () { requestAnimationFrame(function () { t.classList.add('show'); }); });
    try { if (navigator.vibrate) navigator.vibrate(goal ? [14, 45, 14] : [14, 45, 14, 45, 26]); } catch (e) {}
    function bye() { t.classList.remove('show'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 420); }
    t.addEventListener('click', bye);
    setTimeout(bye, 6500);
  }

  /* one-shot milestone effect — peripheral pop + bar glow */
  function celebrate() {
    rings.forEach(function (ring) {
      ring.classList.remove('dc-pop');
      void ring.offsetWidth;
      ring.classList.add('dc-pop');
      setTimeout(function () { ring.classList.remove('dc-pop'); }, 1000);
    });
    [rowBar, pop.classList.contains('open') ? popBar : null].forEach(function (bar) {
      if (!bar) return;
      bar.classList.remove('dc-cele');
      void bar.offsetWidth;
      bar.classList.add('dc-cele');
      setTimeout(function () { bar.classList.remove('dc-cele'); }, 1100);
    });
  }

  /* heartbeat — only advances the clock; milestones are handled in paint() */
  setInterval(function () {
    if (isActive()) {
      var o = load(), now = Date.now();
      if (now - (o.t || 0) >= TICK - 700) {
        o.s += TICK / 1000;
        o.t = now;
        save(o);
      }
    }
    paint();
  }, TICK);
  window.addEventListener('storage', function (e) { if (e.key === KEY) paint(); });
  document.addEventListener('visibilitychange', paint);
  paint();
})();
</script>

<script>
/* ── patient deep-link → patient panel (additive) ──
   Lands visitors directly on the patient panel for ads/social. Two entry points:
     • ?patient  (primary) — a QUERY param survives Instagram/social link wrappers
       and redirects that strip the URL #fragment. ?patient and ?patient=x both match.
     • #patient  (legacy / back-compat) — the original hash deep-link.
   Mirrors the existing #radar hashchange pattern (in dc-nav.js).

   Ordering: this runs on the window 'load' event, which fires only AFTER every
   inline script in the document has executed — including the cinematic scroll
   engine above, whose MutationObserver on #panel-patient is attached
   synchronously (.observe(panelEl,{attributes:true})). So by the time this code
   calls showPanel('panel-patient',…) and flips the panel to .active, that
   observer is already listening and fires the cinematic canvas init.

   The #patient / ?patient tokens are mapped EXPLICITLY to the panel id
   (panel-patient); they intentionally differ and nothing is renamed. 'fade' is
   the neutral dir value used by showPanel (same value the bottom-nav click
   handler uses when the target equals the current panel).

   The query is read ONCE on load (correct for fresh ad clicks — no query-watcher).
   The hashchange listener checks the hash ONLY, so the #patient link still works
   when already on the page, without yanking a ?patient visitor back when an
   unrelated hash (e.g. #search) changes while ?patient remains in the URL.

   This block adds behavior only — showPanel, panelOrder, the swipe/click handlers,
   and the MutationObserver are untouched. */
(function(){
  'use strict';
  function hashIsPatient(){ return window.location.hash === '#patient'; }
  function queryIsPatient(){
    try { return new URLSearchParams(window.location.search).has('patient'); }
    catch(e){ return false; }
  }
  function activatePatient(){
    if(typeof showPanel === 'function') showPanel('panel-patient','fade');
  }
  window.addEventListener('load', function(){
    if(queryIsPatient() || hashIsPatient()) activatePatient();
  });
  window.addEventListener('hashchange', function(){
    if(hashIsPatient()) activatePatient();
  });
})();
</script>

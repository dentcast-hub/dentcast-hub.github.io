===================================================== */
#mobile-shell{
  display:flex; flex-direction:column;
  min-height:100%;
  min-height:100dvh;

     Declared here rather than on :root because it describes this shell, and
     because .dc-bottom-nav is position:fixed but still a descendant, so it
     inherits it. */
  --dc-measure:680px;
}

/* ── TABLET shell bounding — NON-PORTRAIT only ───────────────────────────
   Bounds #mobile-shell to the viewport so #mobile-body becomes the internal
   scroller. This is intentionally NOT applied in portrait: a portrait tablet
   must fall back to the exact same base CSS as a phone (the phone layout works,
   including the patients scrollytelling), so the override is gated to landscape.
   Phones never matched anyway (width < 600); landscape tablets/laptops use the
   desktop UI where #mobile-shell is display:none, so this block is harmless
   there but kept in place rather than deleted. */
@media (min-width:600px) and (min-height:600px) and (max-width:1023px) and (orientation:landscape){
  #mobile-shell{ height:100dvh; overflow:hidden; }
  /* min-height:0 is the key bit: a flex item defaults to min-height:auto, which
     refuses to shrink below its content, so #mobile-body would otherwise grow to
     the patients' ~3200px track and get clipped by the shell instead of becoming
     a scroller. min-height:0 lets it shrink to the shell and scroll internally. */
  #mobile-body{ min-height:0; overscroll-behavior:contain; }
  /* footer would otherwise be stranded below the fixed shell; desktop already
     hides it for the same reason (body.dc-desktop-ui footer). */
  footer{ display:none; }
}

.dc-bottom-nav{
  position:fixed; bottom:0; left:0; right:0;
  z-index:300;
  display:grid; grid-template-columns:repeat(4,1fr);

     dark zone a crisp lit top edge so it never dissolves into the page */

     viewport (its background and top hairline must reach both edges) while its

     inert below the measure, so a phone is untouched.

     this page, but .dc-topbar is on every page of the site, so centring it here
     alone would make the header jump between the homepage and an article. */

  transition:background var(--tr2),border-color var(--tr2);

   On .dc-panel rather than on #mobile-body, because #mobile-body carries the
   brand aura (radial-gradient + --x-ground) and that is a page-level glow:
   capping the scroller would have painted it as a lit strip down the middle of
   a flat ground. The panels move, the ground stays edge to edge.

   #panel-patient is excluded and must stay excluded: the scrollytelling film
   (.pt-wrap) lives inside it and is measured full-bleed, so a max-width here
   letterboxes it. */
.dc-panel{ display:none; }
.dc-panel:not(#panel-patient){ max-width:var(--dc-measure); margin-inline:auto; }
.dc-panel.active{ display:block; }
.dc-panel.anim-right{ animation:slideR 0.32s cubic-bezier(0.25,0.46,0.45,0.94) both; }
.dc-panel.anim-left { animation:slideL 0.32s cubic-bezier(0.25,0.46,0.45,0.94) both; }
.dc-panel.anim-fade { animation:fadeUp 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both; }

@keyframes slideR{ from{opacity:0;transform:translateX(-28px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideL{ from{opacity:0;transform:translateX(28px)}  to{opacity:1;transform:translateX(0)} }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* =====================================================
   PULSE CARD
===================================================== */
.dc-pulse{
  background:var(--card-bg);
  border:1px solid rgba(245,162,8,.45);
  border-radius:var(--r-lg);
  padding:0.875rem 1rem 0.875rem;
  margin-bottom:1.5rem;
  position:relative;
  overflow:visible;
  height:auto;
  box-shadow:var(--card-sh);
  transition:background var(--tr2),border-color var(--tr2);
}
[data-theme="dark"] .dc-pulse{
  border-color:rgba(245,162,8,.32);
}

.dc-pulse-head{
  display:flex; align-items:center;
  justify-content:space-between;
  margin-bottom:0.625rem;
}
.dc-pulse-title{
  display:flex; align-items:center; gap:0.375rem;
  font-size:.82rem; font-weight:800;
  color:#c49820;
  letter-spacing:.02em;
}
.dc-pulse-dot{
  width:0.5rem; height:0.5rem; border-radius:50%;
  background:#c49820;
  animation:pulseDot 1.3s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.65)}}

.dc-pulse-close{
  width:1.625rem; height:1.625rem; border-radius:50%;
  background:var(--border);
  color:var(--txt2);
  font-size:1rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--tr);
}
.dc-pulse-close:active{ background:rgba(245,162,8,.18); color:#c49820; }

.dc-pulse-list{
  list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:0.5rem;
}
.dc-pulse-list li{
  font-size:.80rem;
  color:var(--txt2);
  padding-right:0.875rem; position:relative;
  line-height:1.75;
}
.dc-pulse-list li::before{
  content:"●"; position:absolute; right:0;
  font-size:0.5625rem; color:#c49820;
  top:0.1875rem;
}
.dc-pulse-list a{ color:var(--link); }
.dc-pulse-list strong{ font-weight:800; color:inherit; }


/* =====================================================
   BRAND SUBTITLE — typographic, no box
===================================================== */
.dc-identity-card{
  direction:rtl;
  user-select:none;
  padding:0.875rem 0.25rem 1rem;
  margin-bottom:0.875rem;
}
.dc-identity-main{
  font-size:clamp(.82rem,3.25vw,1.02rem);
  font-weight:800;
  color:var(--pr);
  letter-spacing:-.1px;
  font-family:'Vazirmatn',sans-serif;
  margin:0; padding:0;
  line-height:1.45;
  text-align:center;
  white-space:nowrap;
  max-width:100%;
}
@media(max-width:340px){
  .dc-identity-main{
    white-space:normal;
    text-wrap:balance;
  }
}
/* shimmer — فقط روی span.dc-shimmer-word اعمال می‌شه */
.dc-shimmer-word{
  display:inline;
  font-weight:900;
  background:linear-gradient(
    105deg,
    var(--pr) 28%,
    #4a78c4 46%,
    #8eb1e6 53%,
    var(--pr) 70%
  );
  background-size:400% 100%;
  background-position:100% 0;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:dcShimmer 5s ease-in-out infinite;
}
[data-theme="dark"] .dc-shimmer-word{
  background:linear-gradient(
    105deg,
    #ffffff 28%,
    #7ab4ff 46%,
    #c0d9ff 53%,
    #ffffff 70%
  );
  background-size:400% 100%;
  background-position:100% 0;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
@keyframes dcShimmer{
  0%,55%,100%{ background-position:100% 0; }
  22%,42%    { background-position:-100% 0; }
}

/* =====================================================
   SEARCH CARD (sticky)
===================================================== */

.dc-search-card{
  display:flex; align-items:center;
  justify-content:space-between;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:var(--r-lg);
  padding:0.625rem 0.875rem;
  margin-top:0.375rem;
  margin-bottom:1.125rem;
  box-shadow:var(--card-sh);
  transition:all var(--tr2);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.dc-search-card:active{ background:var(--surface2); transform:scale(.98); }
.dc-search-card-inner{
  display:flex; align-items:center; gap:0.5625rem; flex:1;
}
.dc-search-ico{ font-size:1.0625rem; color:var(--txt3); }
.dc-search-placeholder{
  font-size:.82rem; font-weight:600; color:var(--txt2);
}
.dc-chip{
  font-size:.66rem; font-weight:700;
  padding:0.1875rem 0.5625rem; border-radius:var(--r-f);
  background:var(--chip-bg); color:var(--chip-txt);
  border:1px solid var(--chip-bd);
  white-space:nowrap; flex-shrink:0;
  transition:all var(--tr2);
}

/* =====================================================
   EPISODES HERO CARD
===================================================== */
.dc-hero-card{
  display:flex; align-items:center;
  justify-content:space-between;
  background:var(--pr);
  border-radius:var(--r-xl);
  padding:1rem 1.125rem;
  margin-bottom:1.625rem;
  cursor:pointer;
  box-shadow:0 8px 28px rgba(var(--pr-rgb),.28);
  transition:all var(--tr);
  position:relative; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.dc-hero-card::before{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);
  pointer-events:none;
}
.dc-hero-card:active{ transform:scale(.975); box-shadow:0 4px 18px rgba(var(--pr-rgb),.22); }
.dc-hero-card-main{ flex:1; min-width:0; }
.dc-hero-card-title{
  font-size:.95rem; font-weight:900;
  color:#fff; letter-spacing:-.2px;
  line-height:1.3;
}
.dc-hero-card-sub{
  font-size:.74rem; color:rgba(255,255,255,.70);
  margin-top:0.1875rem;
}
.dc-hero-card-ico{
  width:2.25rem; height:2.25rem;
  background:rgba(255,255,255,.15);
  border-radius:var(--r-md);
  display:flex; align-items:center; justify-content:center;
  font-size:1.125rem; flex-shrink:0; margin-right:0.625rem;
  border:1px solid rgba(255,255,255,.18);
}
.dc-hero-chip{
  font-size:.65rem; font-weight:800;
  padding:0.1875rem 0.5625rem; border-radius:var(--r-f);
  background:rgba(255,255,255,.15);
  color:rgba(255,255,255,.90);
  border:1px solid rgba(255,255,255,.22);
  white-space:nowrap; align-self:flex-start;
  margin-top:0.125rem;
}

/* =====================================================
   2x2 GRID CARDS
===================================================== */
.dc-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0.5rem; margin-bottom:0.625rem;
}

.dc-grid-card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:var(--r-lg);
  box-shadow:var(--card-sh);
  padding:1.125rem 0.875rem 1rem;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center; gap:0.5rem;
  cursor:pointer;
  transition:all var(--tr);
  min-height:6.25rem;
  -webkit-tap-highlight-color:transparent;
  position:relative; overflow:hidden;
  border-top:2px solid rgba(var(--pr-rgb),.14);
}
.dc-grid-card:active{ transform:scale(.96); background:var(--surface2); box-shadow:var(--card-sh2); }

.dc-grid-ico{
  width:2.5rem; height:2.5rem;
  border-radius:var(--r-md);
  background:var(--surface2);
  border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:1.25rem; flex-shrink:0;
  transition:all var(--tr);
}
.dc-grid-card:active .dc-grid-ico{ transform:scale(.92); }

.dc-grid-title{
  font-size:.86rem; font-weight:800;
  color:var(--txt); line-height:1.25;
}
.dc-grid-sub{
  font-size:.70rem; color:var(--txt2);
  line-height:1.3;
}

/* =====================================================
   RADAR HERO CARD — main tool of the site
===================================================== */
.dc-radar-hero{
  display:flex; align-items:center;
  gap:0.75rem;
  background:
    radial-gradient(120% 140% at 100% 0%,
      rgba(var(--pr-rgb),.18) 0%,
      rgba(var(--pr-rgb),.06) 45%,
      var(--card-bg) 100%);
  border:1px solid rgba(var(--pr-rgb),.18);
  border-top:2px solid rgba(var(--pr-rgb),.42);
  border-radius:var(--r-xl);
  padding:0.9375rem 1.125rem;
  margin:0 0 1.375rem;
  min-height:4.75rem;
  box-shadow:0 6px 22px rgba(var(--pr-rgb),.14), var(--card-sh);
  cursor:pointer;
  transition:all var(--tr);
  -webkit-tap-highlight-color:transparent;
  position:relative; overflow:hidden;
  direction:rtl;
}
.dc-radar-hero:active{
  transform:scale(.985);
  box-shadow:0 3px 14px rgba(var(--pr-rgb),.12), var(--card-sh);
}
.dc-radar-hero-ico{
  flex-shrink:0;
  width:3.125rem; height:3.125rem;
  border-radius:var(--r-md);
  background:rgba(var(--pr-rgb),.10);
  border:1px solid rgba(var(--pr-rgb),.22);
  display:flex; align-items:center; justify-content:center;
  font-size:1.625rem;
  box-shadow:inset 0 0 0 1px rgba(var(--pr-rgb),.05);
}
.dc-radar-hero-main{ flex:1; min-width:0; }
.dc-radar-hero-txt{
  font-size:1.02rem; font-weight:900;
  color:var(--pr); letter-spacing:-.2px;
  line-height:1.25;
}
.dc-radar-hero-sub{
  font-size:.74rem; color:var(--txt2);
  margin-top:0.125rem;
  line-height:1.35;
}
.dc-radar-hero-btn{
  flex-shrink:0;
  background:var(--pr);
  color:#fff;
  padding:0.5rem 1.125rem;
  border-radius:var(--r-f);
  font-size:.82rem; font-weight:800;
  border:1px solid rgba(var(--pr-rgb),.28);
  box-shadow:0 4px 14px rgba(var(--pr-rgb),.32);
  white-space:nowrap;
  transition:all var(--tr);
  letter-spacing:.01em;
}
.dc-radar-hero:active .dc-radar-hero-btn{
  box-shadow:0 2px 8px rgba(var(--pr-rgb),.22);
}
/* Two hero cards now stack inside «موتور جستجوی دندانپزشکی». The first one
   drops to a tight gap so they read as one pair; the second keeps the section's
   own 1.375rem breathing room below it. */
#btnOpenRadarMob,
#dcdBtnOpenRadar{ margin-bottom:0.6rem; }
#card-library .dcp-soon-badge,
#dcd-card-library .dcp-soon-badge{ font-size:0.66rem; padding:2px 8px; margin-top:0.3rem; }
#card-library:focus-visible,
#dcd-card-library:focus-visible{ outline:2px solid var(--ac); outline-offset:3px; }

[data-theme="dark"] .dc-radar-hero{
  background:
    radial-gradient(120% 140% at 100% 0%,
      rgba(var(--pr-rgb),.22) 0%,
      rgba(var(--pr-rgb),.08) 45%,
      var(--card-bg) 100%);
  border-color:rgba(var(--pr-rgb),.28);
  border-top-color:rgba(var(--pr-rgb),.55);
}
[data-theme="dark"] .dc-radar-hero-ico{
  background:rgba(var(--pr-rgb),.16);
  border-color:rgba(var(--pr-rgb),.32);
}
[data-theme="dark"] .dc-radar-hero-btn{
  color:#0a1628;
  background:var(--pr);
  border-color:rgba(255,255,255,.18);
  box-shadow:0 4px 14px rgba(var(--pr-rgb),.42);
}
@media(max-width:360px){
  .dc-radar-hero{ padding:0.875rem 0.875rem; gap:0.625rem; }
  .dc-radar-hero-ico{ width:2.75rem; height:2.75rem; font-size:1.4375rem; }
  .dc-radar-hero-txt{ font-size:.95rem; }
  .dc-radar-hero-btn{ padding:0.5rem 0.875rem; font-size:.76rem; }
}

/* =====================================================
   RADAR PILL — legacy (kept for non-homepage usages)
===================================================== */
.dc-radar-pill{
  display:flex; align-items:center;
  justify-content:space-between;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-top:2px solid rgba(var(--pr-rgb),.22);
  border-radius:0.875rem 0.875rem 2.25rem 2.25rem;
  padding:0.8125rem 1.25rem;
  margin:0 auto 1.5rem;
  width:88%; max-width:30rem;
  box-shadow:var(--card-sh2);
  cursor:pointer;
  transition:all var(--tr);
  -webkit-tap-highlight-color:transparent;
  position:relative; overflow:hidden;
}
.dc-radar-pill:active{ transform:scale(.97); background:var(--surface2); }
.dc-radar-pill-txt{ font-size:.88rem; font-weight:800; color:var(--pr); }
.dc-radar-pill-sub{ font-size:.63rem; color:var(--txt3); margin-top:0.0625rem; }
.dc-radar-pill-btn{
  background:rgba(var(--pr-rgb),.08);
  color:var(--pr); padding:0.3125rem 0.875rem;
  border-radius:var(--r-f); font-size:.72rem; font-weight:700;
  border:1px solid rgba(var(--pr-rgb),.15);
  white-space:nowrap; flex-shrink:0;
  transition:all var(--tr);
}

/* Radar shine */
.radar-shine-card{ position:relative!important; overflow:hidden!important; }
.radar-shine-card>*{ position:relative; z-index:1; }
.radar-shine-card::after{
  content:""; position:absolute; top:-60%; right:-80%;
  width:55%; height:220%; z-index:2; pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.08) 30%,rgba(255,255,255,.70) 50%,rgba(255,255,255,.08) 70%,transparent 100%);
  transform:rotate(22deg); opacity:0;
}
.radar-shine-card.radar-shine-on::after{ animation:radarShine 1s ease-out forwards; }
@keyframes radarShine{
  0%{right:-80%;opacity:0} 25%{opacity:.75} 100%{right:130%;opacity:0}
}

/* =====================================================
   LIST CARD (regular)
===================================================== */
.dc-list-card{
  display:flex; align-items:center;
  justify-content:space-between;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-right:3px solid rgba(var(--pr-rgb),.28);
  border-radius:var(--r-lg);
  box-shadow:var(--card-sh);
  padding:0.75rem 0.875rem;
  margin-bottom:0.5rem;
  cursor:pointer;
  transition:all var(--tr);
  -webkit-tap-highlight-color:transparent;
  position:relative; overflow:hidden;
}
.dc-list-card:active{ transform:scale(.975); background:var(--surface2); box-shadow:var(--card-sh2); }
.dc-list-card-main{ flex:1; min-width:0; }
.dc-list-card-title{ font-size:.875rem; font-weight:700; color:var(--txt); line-height:1.3; }
.dc-list-card-sub{ font-size:.74rem; color:var(--txt2); margin-top:0.1875rem; }

/* Meta Base — per-card accent identities (Insight / Chairside / Meta Note) */
.dc-list-card--insight   { --accent: 30, 124, 138; }   /* teal */
.dc-list-card--chairside { --accent: 186, 110, 94; }   /* muted coral */
.dc-list-card--meta      { --accent: 91, 107, 140; }   /* indigo-slate */
.dc-list-card--prompt    { --accent: 112, 96, 168; }   /* violet — پرامپتولوژیست, muted from its registered #7c5cff */
.dc-list-card--plak      { --accent: 142, 59, 122; }   /* plum — پلاک صفر's own registered #8e3b7a */
.dc-list-card--taraz     { --accent: 139, 74, 43; }    /* rust — تراز شواهد's own registered #8b4a2b (never amber: that means premium) */
[data-theme="dark"] .dc-list-card--insight   { --accent: 100, 196, 210; }
[data-theme="dark"] .dc-list-card--chairside { --accent: 224, 161, 142; }
[data-theme="dark"] .dc-list-card--meta      { --accent: 150, 169, 200; }
[data-theme="dark"] .dc-list-card--prompt    { --accent: 176, 164, 224; }
[data-theme="dark"] .dc-list-card--plak      { --accent: 224, 163, 208; }
[data-theme="dark"] .dc-list-card--taraz     { --accent: 224, 169, 138; }

.dc-list-card--insight,
.dc-list-card--chairside,
.dc-list-card--meta,
.dc-list-card--prompt,
.dc-list-card--plak,
.dc-list-card--taraz{
  border-right:5px solid rgba(var(--accent),.55);
  background:
    linear-gradient(to left, rgba(var(--accent),.055), rgba(var(--accent),0) 55%),
    var(--card-bg);
}
.dc-list-card--insight   .dc-list-card-title .dc-svg-icon,
.dc-list-card--chairside .dc-list-card-title .dc-svg-icon,
.dc-list-card--meta      .dc-list-card-title .dc-svg-icon,
.dc-list-card--prompt    .dc-list-card-title .dc-svg-icon,
.dc-list-card--plak      .dc-list-card-title .dc-svg-icon,
.dc-list-card--taraz     .dc-list-card-title .dc-svg-icon{
  color: rgb(var(--accent));
  width: 1.5em;
  height: 1.5em;
}

/* featured list card */
.dc-list-card.featured{
  background:linear-gradient(135deg,rgba(var(--ac-rgb),.07),rgba(var(--pr-rgb),.04));
  border:1px solid rgba(var(--ac-rgb),.16)!important;
  border-right:3px solid rgba(var(--ac-rgb),.40)!important;
  box-shadow:0 6px 22px rgba(var(--ac-rgb),.10),var(--card-sh)!important;
}
.dc-list-card.featured .dc-list-card-title{ font-size:.92rem; font-weight:900; }

/* Glossary featured — یک گام روشن‌تر از hero، margin-bottom هم‌اندازه hero */
#panel-sharehub .dc-list-card.featured:first-child,
#dcd-archive .dc-list-card.featured:first-child{
  background:linear-gradient(135deg,rgba(var(--pr-rgb),.18),rgba(var(--ac-rgb),.10));
  border:1px solid rgba(var(--pr-rgb),.28)!important;
  border-right:3px solid rgba(var(--pr-rgb),.55)!important;
  box-shadow:0 8px 24px rgba(var(--pr-rgb),.18),var(--card-sh)!important;
  margin-bottom:1.25rem;
}
[data-theme="dark"] #panel-sharehub .dc-list-card.featured:first-child,
[data-theme="dark"] #dcd-archive .dc-list-card.featured:first-child{
  background:linear-gradient(135deg,rgba(var(--pr-rgb),.22),rgba(var(--ac-rgb),.12));
}

/* =====================================================
   MONITOR (list widget)
===================================================== */
.dc-monitor{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-right:3px solid rgba(var(--pr-rgb),.20);
  border-radius:var(--r-lg);
  margin-bottom:0.5rem;
  box-shadow:var(--monitor-sh);
  overflow:hidden;
  transition:all var(--tr2);
}

.dc-monitor-inner{ padding:0.875rem 1rem; }
.dc-monitor-title{
  font-size:.82rem; font-weight:800;
  color:var(--txt); margin:0 0 0.625rem;
}
/* ── up-board doorway ──
   The section TITLE sits outside the card, in the same `.dc-home-sec` header
   every other section of this panel uses («پادکست», «تولید اختصاصی دنت‌کست») —
   it lived inside the box at first, which made this one card look like a
   different kind of object from everything around it.
   Blue, never amber: the box and «تازه‌ترین» are free; only the «بالاترین»
   tab is premium and only that tab wears the amber lock. */
.dc-home-sec-sub{
  font-size:.72rem; font-weight:500; color:var(--txt3); margin:0; line-height:1.6;
}
.dc-monitor-all{
  flex:none; font-size:.72rem; font-weight:700;
  color:var(--ac); text-decoration:none; white-space:nowrap;
}
.dc-monitor-all:active{ opacity:.6; }
.dc-monitor-tabs{ display:flex; align-items:center; gap:0.375rem; margin:0 0 0.5rem; }
.dc-monitor-tabs .dc-monitor-all{ margin-inline-start:auto; }
.dc-monitor-tab{
  font:inherit; font-size:.7rem; font-weight:700;
  color:var(--txt3); background:transparent;
  border:1px solid var(--border); border-radius:999px;
  padding:0.1875rem 0.6875rem; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:color var(--tr), background var(--tr), border-color var(--tr);
}
.dc-monitor-tab[aria-selected="true"]{
  color:var(--ac); background:rgba(var(--ac-rgb),.08);
  border-color:rgba(var(--ac-rgb),.20);
}
/* «بالاترین» پشت پریمیوم است، پس امبر می‌پوشد نه آبی — امبر در کل سایت
   یک معنا دارد و این همان معناست. قفل فقط بعد از یک ۴۰۲ واقعی می‌نشیند؛
   سروری که جواب نداده هنوز ممکن است دفعهٔ بعد باز شود. */
.dc-monitor-tab.is-locked{ color:var(--x-amber-ink); border-color:var(--x-amber-bd); }
.dc-monitor-tab.is-locked::after{ content:"🔒"; font-size:.8em; margin-inline-start:.25rem; }
.dc-monitor-rank{
  flex:none; min-width:1.1em; text-align:center;
  font-size:.72rem; font-weight:800; color:var(--txt3);
  font-variant-numeric:tabular-nums;
}
.dc-monitor-rank.is-top{ color:var(--ac); }
.dc-monitor-hearts{
  flex:none; margin-inline-start:auto; display:inline-flex; align-items:center; gap:0.1875rem;
  font-size:.68rem; font-weight:800; color:var(--heart,#d92b52);
  font-variant-numeric:tabular-nums;
}
.dc-monitor-hearts svg{ width:.85em; height:.85em; }
.dc-monitor-hint{
  font-size:.66rem; font-weight:500;
  color:var(--txt3);
  margin:-0.4375rem 0 0.5625rem;
}
.dc-monitor-list{
  display:flex; flex-direction:column; gap:0.1875rem;
  max-height:10.8125rem; overflow-y:auto;
}
.dc-monitor-list a{
  display:flex; align-items:center; gap:0.5rem;
  text-decoration:none;
  color:rgba(var(--pr-rgb),.85);
  font-size:.82rem; line-height:1.60;
  padding:0.25rem 0.5rem;
  border-radius:var(--r-sm);
  background:var(--surface2);
  border:1px solid var(--border2);
  transition:all var(--tr);
}
[data-theme="dark"] .dc-monitor-list a{ color:rgba(91,156,246,.88); }
.dc-monitor-list a:active{ background:var(--surface3); }

/* Category icon + title slots inside each list item */
.dc-mlist-ico{
  display:inline-flex; flex-shrink:0;
  font-size:1.25em; line-height:1;
}
.dc-mlist-title{ flex:1; min-width:0; }
.dc-mlist-ico--episodes{ color:var(--pr); }
.dc-mlist-ico--studio  { color:#c49820; }
.dc-mlist-ico--metabase{ color:#3a8da5; }
.dc-mlist-ico--prompt  { color:#7060a8; }   /* پرامپتولوژیست — the same violet its list card carries */
.dc-mlist-ico--plak    { color:#8e3b7a; }   /* پلاک صفر — its own registered plum */
.dc-mlist-ico--taraz   { color:#8b4a2b; }   /* تراز شواهد — its own registered rust */
[data-theme="dark"] .dc-mlist-ico--metabase{ color:#7fbbcf; }
[data-theme="dark"] .dc-mlist-ico--prompt  { color:#b0a4e0; }
[data-theme="dark"] .dc-mlist-ico--plak    { color:#e0a3d0; }
[data-theme="dark"] .dc-mlist-ico--taraz   { color:#e0a98a; }

/* secondary monitor — extra top margin to visually separate */
.dc-monitor.dc-monitor-secondary{ margin-top:1.25rem; }

/* =====================================================
   TOOLS ISLAND
===================================================== */
.dc-tools-island{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  border-radius:var(--r-lg); overflow:hidden;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  box-shadow:0 6px 18px rgba(2,6,23,.05),
    inset -8px -8px 16px rgba(2,6,23,.05),
    inset 8px 8px 16px rgba(255,255,255,.75);
  margin-bottom:0.625rem;
  transition:all var(--tr2);
}
[data-theme="dark"] .dc-tools-island{
  box-shadow:0 6px 18px rgba(0,0,0,.20),
    inset -6px -6px 12px rgba(0,0,0,.18),
    inset 6px 6px 12px rgba(255,255,255,.03);
}
.dc-tool-seg{
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:0.3125rem; padding:0.875rem 0.375rem 0.75rem;
  font-family:inherit; cursor:pointer;
  transition:background var(--tr);
  background:transparent;
  color:var(--txt);
}
.dc-tool-seg:not(:last-child){ border-left:1px solid var(--border2); }
.dc-tool-seg:active{ background:rgba(var(--pr-rgb),.06); }
.dc-tool-ico{ font-size:1.3125rem; line-height:1; }
.dc-tool-txt{ font-size:0.71875rem; font-weight:800; color:var(--txt2); }

/* =====================================================
   LOCATION / CONTACT
===================================================== */
.dc-locpack-img{
  width:100%; height:9.375rem;
  object-fit:cover; border-radius:var(--r-md);
  display:block; border:1px solid var(--border);
}
.dc-locpack-hint{
  margin-top:0.5rem; font-size:.78rem;
  color:var(--txt2); line-height:1.65; text-align:center;
}
.dc-cta-row{
  display:grid; grid-template-columns:1fr 1fr;
  gap:0.625rem; margin-top:0.875rem;
}
.dc-cta-btn{
  display:flex; align-items:center; justify-content:center;
  padding:0.875rem 0.625rem; border-radius:var(--r-md);
  font-size:.88rem; font-weight:800;
  text-decoration:none;
  background:var(--surface2);
  border:1px solid var(--border);
  border-top:2px solid rgba(var(--pr-rgb),.28);
  color:var(--pr);
  box-shadow:var(--card-sh);
  transition:all var(--tr);
  min-height:3rem;
}
[data-theme="dark"] .dc-cta-btn{ color:#8ab4f8; border-color:rgba(91,156,246,.20); border-top-color:rgba(91,156,246,.30); }
.dc-cta-btn:active{ transform:scale(.975); background:var(--surface3); }

/* =====================================================
   GLOBAL SEARCH BOX
===================================================== */
.dc-global-filter-box{
  background:var(--card-bg);
  border-radius:var(--r-xl); padding:1.125rem 1rem;
  margin:0.5rem 0 1rem;
  border:1px solid var(--border);
  box-shadow:var(--card-sh);
  max-height:0; opacity:0; visibility:hidden; overflow:hidden;
  transition:all .28s ease-in-out;
}
.dc-global-filter-box.open{
  max-height:85vh!important; opacity:1; visibility:visible; overflow-y:auto;
}
.dc-global-filter-title{
  font-weight:800; font-size:1rem;
  color:var(--txt); text-align:center; margin-bottom:0.75rem;
}
.dc-search-input{
  width:100%; padding:0.625rem 0.875rem;
  border-radius:var(--r-md); border:1px solid var(--border);
  background:var(--surface2); font-size:0.875rem;
  color:var(--txt); outline:none; margin-bottom:0.75rem;
  transition:all var(--tr);
}
.dc-search-input:focus{
  border-color:rgba(var(--ac-rgb),.35);
  box-shadow:0 0 0 3px rgba(var(--ac-rgb),.08);
}
.dc-filter-list{
  display:flex; flex-wrap:wrap; gap:0.375rem;
  justify-content:center; margin-top:0.5rem;
}
.dc-filter-btn{
  padding:0.3125rem 0.8125rem; border-radius:var(--r-f);
  border:1px solid var(--border); background:var(--surface2);
  color:var(--txt2); font-size:0.71875rem; cursor:pointer;
  transition:all var(--tr); white-space:nowrap;
}
.dc-filter-btn.active{
  background:var(--pr); color:#fff;
  border-color:var(--pr);
  box-shadow:0 3px 10px rgba(var(--pr-rgb),.26);
}
[data-theme="dark"] .dc-filter-btn.active{ background:#2b5278; border-color:#2b5278; }

.dc-results-box{
  margin-top:0.75rem; padding:0.625rem 0.75rem;
  border-radius:var(--r-md);
  background:var(--surface2); border:1px solid var(--border);
  display:none; max-height:60vh; overflow-y:auto; position:relative;
}
.dc-result-item{
  display:block; padding:0.5rem 0.625rem;
  border-bottom:1px solid var(--border2);
  color:var(--txt); font-size:0.78125rem; text-decoration:none;
  transition:background var(--tr);
}
.dc-result-item:hover{ background:var(--surface3); border-radius:var(--r-sm); }
.dc-close-results{
  position:absolute; top:0.4375rem; left:0.4375rem;
  width:1.5rem; height:1.5rem; border:none; border-radius:50%;
  background:rgba(var(--ac-rgb),.12); color:var(--pr);
  font-size:0.9375rem; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--tr);
}
[data-theme="dark"] .dc-close-results{ color:#5b9cf6; }

/* =====================================================
   MOBILE SEARCH OVERLAY
===================================================== */
@media(max-width:1023px){
  .dc-search-overlay{
    opacity:0; visibility:hidden; pointer-events:none;
    transform:translateY(8px);
    transition:opacity .24s ease,transform .24s ease,visibility .24s ease;
  }
  body.dc-search-mode .dc-search-overlay{
    opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0);
  }
  body.dc-search-mode #mobile-shell,
  body.dc-search-mode footer{ display:none!important; }
  body.dc-search-mode #dcSearchOverlay{ display:flex!important; }
  body.dc-search-mode .dc-global-filter-box{
    max-height:unset!important; opacity:1!important;
    visibility:visible!important; overflow:visible!important; margin:0!important;
    background:none!important; border:none!important;
    box-shadow:none!important; padding:0!important; border-radius:0!important;
  }
  body.dc-search-mode .dc-global-filter-title{ display:none!important; }
  /* make overlay body a flex column so #dcGlobalBox flex:1 works */
  body.dc-search-mode #dcSearchOverlayBody{
    display:flex!important; flex-direction:column!important;
    overflow:hidden!important; padding:0.75rem 1rem 0!important;
    min-height:0!important;
  }
  body.dc-search-mode #dcGlobalBox{
    flex:1 1 0!important; display:flex!important;
    flex-direction:column!important; overflow:hidden!important;
    min-height:0!important; width:100%;
  }
  body.dc-search-mode #dcResults{
    display:block!important; flex:1 1 0!important;
    max-height:none!important; overflow-y:auto!important;
    min-height:0!important;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; padding-bottom:env(safe-area-inset-bottom,1.25rem);
  }
  /* search input inside overlay */
  body.dc-search-mode .dc-search-input{
    width:100%; padding:0.8125rem 1.125rem; font-size:0.9375rem;
    border:1.5px solid var(--border);
    border-radius:var(--r-f);
    background:var(--surface); color:var(--txt);
    outline:none; box-shadow:var(--card-sh);
    transition:border-color var(--tr),box-shadow var(--tr);
    margin-bottom:0.75rem;
  }
  body.dc-search-mode .dc-search-input:focus{
    border-color:rgba(var(--ac-rgb),.45);
    box-shadow:0 0 0 3px rgba(var(--ac-rgb),.08),var(--card-sh);
  }
}

/* =====================================================
   SHARED OVERLAY SYSTEM — رادار + سرچ
===================================================== */
.dc-overlay{
  position:fixed; inset:0; z-index:99999;
  background:var(--bg);
  display:flex; flex-direction:column;
  direction:rtl; overflow:hidden;
  transition:background var(--tr2);
}
.dc-overlay::before{
  content:'';
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:16.25rem; height:16.25rem;
  background:url('/logo-v2.png') center/contain no-repeat;
  opacity:.045;
  pointer-events:none;
  z-index:0;
}
[data-theme="dark"] .dc-overlay::before{ opacity:.03; }

.dc-overlay-header{
  position:relative; z-index:2; flex-shrink:0;
  display:flex; align-items:center; gap:0.625rem;
  padding:0.8125rem 1rem 0.75rem;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 8px rgba(2,35,96,.05);
  transition:background var(--tr2),border-color var(--tr2);
}
.dc-overlay-brand{
  font-size:.68rem; font-weight:800;
  color:var(--ac); letter-spacing:.05em;
  opacity:.7; flex-shrink:0;
}
.dc-overlay-title{
  flex:1; text-align:center;
  font-size:.92rem; font-weight:800;
  color:var(--txt);
  transition:color var(--tr2);
}
.dc-overlay-close{
  width:2.125rem; height:2.125rem; flex-shrink:0;
  border-radius:var(--r-f);
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--txt2); font-size:1.25rem; font-weight:300;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:all var(--tr);
  line-height:1;
}
.dc-overlay-close:active{
  background:rgba(var(--ac-rgb),.12);
  color:var(--ac); transform:scale(.88);
}
.dc-overlay-body{
  flex:1; overflow-y:auto;
  padding:1rem;
  padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0rem));
  position:relative; z-index:1;
  -webkit-overflow-scrolling:touch;
  max-width:45rem; margin:0 auto; width:100%;
}
.dc-overlay-input{
  width:100%; padding:0.8125rem 1.125rem;
  font-size:0.9375rem; font-family:inherit;
  border:1.5px solid var(--border);
  border-radius:var(--r-f);
  background:var(--surface); color:var(--txt);
  outline:none; box-shadow:var(--card-sh);
  transition:border-color var(--tr),box-shadow var(--tr);
  margin-bottom:1rem; display:block;
}
.dc-overlay-input:focus{
  border-color:rgba(var(--ac-rgb),.45);
  box-shadow:0 0 0 3px rgba(var(--ac-rgb),.08),var(--card-sh);
}

/* =====================================================
   RADAR OVERLAY
===================================================== */
.radar-overlay{
  opacity:0; visibility:hidden;
  transition:opacity .24s ease,visibility .24s ease;
}
.radar-overlay[aria-hidden="false"]{ opacity:1; visibility:visible; }
body.dc-radar-mode{ overflow:hidden; }

.radar-results{ display:flex; flex-direction:column; gap:0.625rem; }
.radar-initial-msg,.radar-no-results{
  text-align:center; color:var(--txt3); margin-top:1.875rem; font-size:0.84375rem;
}
.radar-result-item{
  background:var(--card-bg); border-radius:var(--r-md);
  padding:0.8125rem; text-decoration:none; color:inherit;
  border:1px solid var(--card-border);
  transition:all var(--tr); display:block;
  box-shadow:var(--card-sh);
}
.radar-result-item:hover{ transform:translateY(-1px); box-shadow:var(--card-sh2); }
.radar-item-title{
  font-size:0.90625rem; font-weight:700; color:var(--ac);
  margin-bottom:0.1875rem; display:flex; align-items:center; gap:0.375rem;
}
[data-theme="dark"] .radar-item-title{ color:#5b9cf6; }
.radar-item-url{ font-size:0.6875rem; color:#27ae60; margin-bottom:0.3125rem; direction:ltr; text-align:left; }
[data-theme="dark"] .radar-item-url{ color:#4caf7d; }
.radar-item-desc{
  font-size:0.75rem; color:var(--txt2); line-height:1.55;
  display:-webkit-box; -webkit-line-clamp:3; line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;
}


/* =====================================================
   FOOTER
===================================================== */
footer{
  color:var(--txt3); font-size:.78rem;
  text-align:center; line-height:1.8;
  /* This footer renders on the mobile shell only (desktop hides it), where
     .dc-bottom-nav is position:fixed over the bottom ~4rem of the viewport.
     The bottom padding is what lets the last line — and the trust seal above
     it — clear that bar instead of scrolling in behind it. */
  padding:1rem 1rem 5rem;
  border-top:1px solid var(--border2);
  transition:all var(--tr2);
}

/* =====================================================
   E-NAMAD TRUST SEAL — نماد اعتماد الکترونیکی
   Mirrors the .dc-trustseal block in dc-theme.css (index
   loads no shared CSS). Two homes on this page: the
   footer (mobile shell) and .dcd-a-seal in the col-A
   sidebar (desktop shell, where the footer is hidden).
   The seal is issued for dentcast.ir alone and its
   logo.aspx renders from the referrer, so dc-nav.js
   removes these nodes on any other host; loading="lazy"
   keeps the request from firing there in the first place.
   White chip in both themes on purpose — the seal artwork
   assumes a light background. The fixed box reserves the
   space so nothing shifts when the image lands.
===================================================== */
.dc-trustseal{
  display:flex; justify-content:center;
  margin:0 auto 0.875rem;
}
.dc-trustseal a{
  display:flex; align-items:center; justify-content:center;
  width:5.5rem; height:6.5rem;
  padding:0.3125rem;
  background:#fff;
  border:1px solid var(--border2);
  border-radius:var(--r-md);
  box-shadow:none;
  transition:transform var(--tr), box-shadow var(--tr);
}
.dc-trustseal a:hover{
  transform:translateY(-1px);
  box-shadow:none;
}
.dc-trustseal img{
  max-width:100%; max-height:100%;
  width:auto; height:auto; display:block;
}

/* Sidebar variant: the col-A rail is dark navy in both themes, so the chip
   gets the sidebar's own divider rather than the page border, and a slightly
   smaller box to sit quietly above the tool buttons. */
.dcd-a-seal{
  flex-shrink:0;
  padding:0.125rem 0.5rem 0.375rem;
  border-top:0;
  margin:0;
}
.dcd-a-seal a{
  display:flex; flex-direction:row; align-items:center; justify-content:center;
  gap:0.375rem; box-sizing:border-box;
  width:100%; height:1.75rem; min-height:0;
  padding:0.125rem 0.5rem;
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  background:#fff; box-shadow:none;
  color:#5f6980; font-size:0.625rem; font-weight:500;
  text-decoration:none; white-space:nowrap;
}
.dcd-a-seal img{
  display:block; width:1.25rem; height:1.25rem;
  max-width:1.25rem; max-height:1.25rem;
  object-fit:contain; flex-shrink:0;
}
.dcd-a-seal a:hover{ box-shadow:none; }

/* Set by the head guard on every host that is not dentcast.ir, before the body
   is parsed, so the chip never flashes. dc-nav.js removes the node right after;
   this is only what covers the gap between parse and that script. */
.dc-no-seal .dc-trustseal,
.dc-no-seal .dc-trustseal-box{ display:none!important; }

/* ── ACTIVATION ── */
#dc-desktop-root{ display:none; }
/* Radar overlay is NOT hidden on desktop — it shows over the layout */
body.dc-desktop-ui #mobile-shell,
body.dc-desktop-ui footer,
body.dc-desktop-ui #dc-theme-toggle,
body.dc-desktop-ui .dc-search-overlay{ display:none!important; }

/* ── HAMBURGER: collapse col-A sidebar ── */
.dcd-app.col-a-hidden{
  grid-template-columns:0px 420px 1fr !important;
}
/* visibility:hidden is what makes "collapsed" true for everyone, not just for a
   mouse. The track goes to 0px and overflow clips it, but the aside still
   measured 1px wide × full height with visibility:visible — so its eleven tree
   buttons stayed in the accessibility tree AND in the tab order: tabbing from
   the top of the document landed on ten consecutive invisible controls inside a
   1px column. `pointer-events:none` had closed the mouse door and left the
   keyboard and screen-reader doors open, which also made the hamburger's
   aria-expanded="false" a claim the DOM did not honour. Nothing inside col-A
   sets visibility:visible, so this cannot leak back in, and there is no width or
   opacity transition here for it to cut short. */
.dcd-app.col-a-hidden .dcd-col-a{
  overflow:hidden; pointer-events:none; visibility:hidden;
}
@media(max-width:1024px){
  .dcd-app.col-a-hidden{ grid-template-columns:0px 1fr !important; }
}

/* ── DESKTOP SEARCH OVERLAY ──
   The search overlay CSS lives inside @media(max-width:1023px) so it has no
   styles on desktop; this block gives it some.

   It used to say `position:fixed; inset:0; z-index:99998` — a full-screen
   modal, measured at 1440x900 on a 1440px desktop, covering the tree and the
   list as well as the reader. Column C is where this shell shows things, so
   deskOpenSearch() now parks the overlay inside .dcd-col-c (hostOverlayInColumn,
   the same move the podcast player already made) and this positions it there:
   under the column's own header, over the reader, nothing else touched.
   `body.dc-desktop-ui` still gates it, so the same node is untouched while it
   sits on <body> for the mobile shell.
── */
body.dc-desktop-ui.dc-search-mode .dc-search-overlay,
body.dc-desktop-ui.dc-search-mode #dcSearchOverlay{
  /* flex, not block. `.dc-overlay` is a flex COLUMN and `.dc-overlay-b…91997 tokens truncated… document.createElement('button');
        back.className = 'dcd-patient-back';
        back.textContent = '→ بازگشت به فهرست';
        back.addEventListener('click', showPatientFeed);
        contentArea.prepend(back);
      }

      /* Rebuild audio elements so they work in the new DOM.
         Copy all original attributes (id, src, preload…) so
         custom-player scripts can still find elements by id. */
      contentArea.querySelectorAll('audio').forEach(old => {
        const neu = document.createElement('audio');
        Array.from(old.attributes).forEach(a => neu.setAttribute(a.name, a.value));
        neu.style.cssText = old.style.cssText;
        old.querySelectorAll('source').forEach(s => {
          const ns = document.createElement('source');
          ns.src  = s.src  || s.getAttribute('src')  || '';
          ns.type = s.type || s.getAttribute('type') || '';
          neu.appendChild(ns);
        });
        old.replaceWith(neu);
      });

      /* Re-execute ALL inline scripts now inside contentArea
         (both from .article-content-wrap and the extra scripts appended above) */
      contentArea.querySelectorAll('script').forEach(old => {
        if(old.src) return;
        const s = document.createElement('script');
        s.textContent = old.textContent;
        old.replaceWith(s);
      });

      /* Scroll col-c to top */
      colCScroll.scrollTo(0, 0);

      /* Mount the Plus workbench (میز کار) onto the just-injected article. plus.js
         exposes this; dc-nav/plus was stripped from the fetched HTML, so the
         button must be wired explicitly here, with the article's own URL. */
      if (window.dcpMountArticleWorkbench) {
        Promise.resolve(window.dcpMountArticleWorkbench(contentArea, url + search))
          .catch(() => {})
          .then(() => { try{ if(window.__dcdInjectedSearch === search) window.__dcdInjectedSearch = ''; }catch(x){} });
      } else {
        try{ window.__dcdInjectedSearch = ''; }catch(x){}
      }

      /* Place the in-article ad. Same reason as the workbench above: this is a
         client-side injection, so spot.js — which ran once, when the homepage
         loaded — cannot see it, and the article slot would silently never render
         on desktop. The shell decides WHEN (only a real article, the same
         condition the mobile path checks: the fetched page had
         .article-content-wrap); spot.js decides WHERE, with the same upper-third
         rule it uses on a phone. */
      if (window.dcSpotMountArticle && extract.classList.contains('article-content-wrap')) {
        window.dcSpotMountArticle(contentArea);
      }

    } catch(e){
      contentArea.innerHTML =
        '<div class="dcd-loading" style="flex-direction:column;gap:0.5rem;">' +
        '<span style="font-size:1.5rem">⚠️</span>' +
        '<span>خطا در بارگذاری. <a href="'+url+'" target="_blank" style="color:var(--ac);">باز کردن در تب جدید</a></span>' +
        '</div>';
    }
  }

  /* ══════════════════════════════════════════════
     EPISODE PAGE INTERCEPTS
     Individual /episodes/episode-*.html pages are
     treated as normal article content pages, not
     as full-page or iframe navigations.
  ══════════════════════════════════════════════ */
  const EP_PAGE_RE = /^\/episodes\/episode-[^/]+\.html$/;
  /* An individual article page of any content section — what column C
     fetches and injects. One list, read by the iframe click guard and by the
     in-content click router below. `.+\.html` (not `[^/]+`) so sub-folder
     pages like the English versions at /metanotes/en/meta-1.html are caught;
     a folder's own index.html is a listing, never an article. plak-sefr was
     missing from this list until 2026-09-10 — a new section has to be added
     here as well as to the tree (see .dentcast/workflows/new-section.md). */
  const ARTICLE_PAGE_RE = /^\/(notecast|insight|chairside|litecast|metanotes|dentai|dentcast-plus|photocast|sharehub|plak-sefr|taraz)\/.+\.html$/;
  const isArticlePath = (p) => EP_PAGE_RE.test(p) || (ARTICLE_PAGE_RE.test(p) && !/\/index\.html$/.test(p));

  /* 1. If the viewer iframe navigates to an individual episode page,
        switch out of viewer mode and load it via openContent instead.
        Also inject a click interceptor into the iframe document so that
        links with target="_blank" (or any target) are caught before the
        browser opens a new window. */
  if(pageViewer){
    pageViewer.addEventListener('load', function(){
      try{
        const iWin = pageViewer.contentWindow;
        const iDoc = pageViewer.contentDocument;
        const path  = iWin.location.pathname;

        /* If the iframe itself landed on an episode page, pull it into col-C */
        if(EP_PAGE_RE.test(path)){
          openContent(path, iDoc.title || path);
          return;
        }

        /* Otherwise attach a capture-phase click guard to the iframe document
           so episode-page links are intercepted before any navigation or popup */
        iDoc.addEventListener('click', function(ev){
          const a = ev.target.closest('a[href]');
          if(!a) return;
          let u;
          try{ u = new URL(a.href, location.origin); }catch(x){ return; }
          if(u.origin !== location.origin) return;
          const p = u.pathname;
          /* Any article page — an episode or a section's own page — goes to
             column C the way col-A → col-B → col-C navigation already does;
             left alone it opened as a whole page, header and all, nested
             inside this viewer. The query string rides along (?dcphl= from a
             glossary term's notes block, ?dcclip= from a player). */
          if(isArticlePath(p)){
            ev.preventDefault();
            ev.stopImmediatePropagation();
            openContent(p + u.search, a.textContent.trim() || p);
          }
        }, true /* capture — runs before iframe's own handlers */);

      } catch(e){}
    });
  }

  /* 2. postMessage from player.html (nested inside episodes viewer iframe) */
  window.addEventListener('message', function(ev){
    if(!ev.data || ev.data.type !== 'dcd-episode-open') return;
    var url = ev.data.url || '';
    var path;
    try{ path = new URL(url, location.origin).pathname; }catch(x){ return; }
    if(EP_PAGE_RE.test(path)){
      openContent(path, ev.data.title || '');
    }
  });

  /* 3. If a link to an individual episode page is clicked inside the
        fetched content area, load it via openContent (not full-page). */
  if(contentArea){
    contentArea.addEventListener('click', function(e){
      if(!document.body.classList.contains('dc-desktop-ui')) return;
      const a = e.target.closest('a[href]');
      if(!a) return;
      /* Only intercept same-origin links; leave external/mailto/tel/hash alone */
      let u;
      try{ u = new URL(a.href, location.origin); }catch(x){ return; }
      if(u.origin !== location.origin) return;
      const path = u.pathname;
      /* Individual episode page → load in col-C */
      if(EP_PAGE_RE.test(path)){
        e.preventDefault();
        openContent(path + u.search, a.textContent.trim() || path);
        return;
      }
      /* Episodes listing → reopen the episodes viewer */
      if(path === '/episodes/' || path === '/episodes/index.html' || path === '/episodes.html'){
        e.preventDefault();
        openPageViewer('/episodes.html');
        return;
      }
      /* Glossary / Pillar → full-page viewer (iframe) */
      if(/^\/glossary\//.test(path)){
        e.preventDefault();
        openPageViewer(path.endsWith('.html') ? path : '/glossary/');
        return;
      }
      if(/^\/pillar\//.test(path)){
        e.preventDefault();
        openPageViewer(path);
        return;
      }
      /* Related-content / language links to individual article pages → load
         in col-C instead of letting the browser navigate out of the app
         (ARTICLE_PAGE_RE, shared with the viewer's click guard above). */
      if(isArticlePath(path)){
        e.preventDefault();
        openContent(path + u.search, a.textContent.trim() || path);
        return;
      }
      /* Any remaining internal section directory (not the home page) → viewer */
      if(path !== '/' && /\/$/.test(path)){
        e.preventDefault();
        openPageViewer(path);
      }
    });
  }

  /* ── Col-C header buttons ── */

  /* Hamburger → collapse/expand col-A sidebar */
  document.getElementById('dcd-hdr-hamburger')?.addEventListener('click', () => {
    const app = root.querySelector('.dcd-app');
    if(!app) return;
    const isHidden = app.classList.toggle('col-a-hidden');
    document.getElementById('dcd-hdr-hamburger')
      ?.setAttribute('aria-expanded', String(!isHidden));
  });

  /* Radar → open radar overlay */
  function openRadarOverlay(){
    const overlay = document.getElementById('dcRadarOverlay');
    if(!overlay) return;
    hostOverlayInColumn('dcRadarOverlay');
    overlay.setAttribute('aria-hidden','false');
    document.body.classList.add('dc-radar-mode');
    setTimeout(() => document.getElementById('dcRadarInput')?.focus(), 100);
    history.pushState({dcRadar:true},'','#radar');
    if(!window.isRadarLoaded) window.loadRadarData?.();
  }
  document.getElementById('dcd-hdr-radar')?.addEventListener('click', openRadarOverlay);

  /* Search → open search overlay (desktop-aware) */
  function deskOpenSearch(term=''){
    const overlay     = document.getElementById('dcSearchOverlay');
    const overlayBody = document.getElementById('dcSearchOverlayBody');
    const globalBox   = document.getElementById('dcGlobalBox');
    const searchInp   = document.getElementById('dcSearch');
    if(!overlay || !overlayBody || !globalBox) return;
    hostOverlayInColumn('dcSearchOverlay');
    overlayBody.appendChild(globalBox);
    document.body.classList.add('dc-search-mode');
    overlay.setAttribute('aria-hidden','false');
    globalBox.classList.add('open');
    /* Synchronous focus AFTER the relocation, inside the gesture (iOS keyboard). */
    searchInp?.focus();
    if(term && searchInp){ searchInp.value=term; searchInp.dispatchEvent(new Event('input')); }
    const hash=term?'#search:'+encodeURIComponent(term):'#search';
    history.pushState({dcSearch:true,q:term},'',hash);
  }
  function deskCloseSearch(){
    const overlay   = document.getElementById('dcSearchOverlay');
    const globalBox = document.getElementById('dcGlobalBox');
    const results   = document.getElementById('dcResults');
    document.body.classList.remove('dc-search-mode');
    overlay?.setAttribute('aria-hidden','true');
    globalBox?.classList.remove('open');
    if(results) results.style.display = 'none';
    const searchInp = document.getElementById('dcSearch');
    if(searchInp){ searchInp.value=''; searchInp.dispatchEvent(new Event('input')); }
    if(globalBox && !document.getElementById('dcd-col-c-scroll')?.contains(globalBox)){
      const feed = document.querySelector('#dcd-welcome .dcd-welcome-feed');
      if(feed && !feed.contains(globalBox)) feed.appendChild(globalBox);
    }
    /* Clear the search hash without re-entering popstate handlers.
       Calling history.back() here could reopen the overlay on narrow desktops. */
    if(window.location.hash.startsWith('#search'))
      history.replaceState(null,'',window.location.pathname+window.location.search);
  }
  document.getElementById('dcd-hdr-search')?.addEventListener('click', ()=>deskOpenSearch());
  /* Any .dcOpenSearch INSIDE the desktop shell — today the welcome column's
     copy of the phone's hero search box. Delegated for the same reason the
     mobile one is (elements here are built and replaced at runtime), and
     scoped to #dc-desktop-root so it can never double-fire with that handler:
     openS() already returns early under .dc-desktop-ui, and this one never
     sees a click inside #mobile-shell. */
  document.addEventListener('click', (e) => {
    if(e.target.closest && e.target.closest('#dc-desktop-root .dcOpenSearch')) deskOpenSearch();
  });
  document.getElementById('dcCloseSearchOverlay')?.addEventListener('click', (e) => {
    if(!document.body.classList.contains('dc-desktop-ui')) return;
    e.stopImmediatePropagation();
    deskCloseSearch();
  });
  window.addEventListener('popstate', () => {
    if(document.body.classList.contains('dc-desktop-ui') &&
       document.body.classList.contains('dc-search-mode')) deskCloseSearch();
    else if(document.body.classList.contains('dc-desktop-ui') &&
            window.location.hash.startsWith('#search')){
      const h=window.location.hash;
      const term=h.startsWith('#search:')?decodeURIComponent(h.slice(8)):'';
      deskOpenSearch(term);
    }
  });

  /* Theme toggle in col-a footer (#dcdThemeBtn) is owned by /dc-nav.js */

  /* PWA */
  document.getElementById('dcdPwaBtn')?.addEventListener('click', handlePWAInstall);

  /* ══════════════════════════════════════════════
     SYNC DESKTOP PULSE FROM MOBILE PULSE
     Reads mobile pulse list (#dcPulseCard) and
     populates the desktop pulse (#dcdPulse's .dc-pulse-list —
     the desktop copy wears the MOBILE pulse classes),
     adapting links to load in col-C instead of
     navigating the page.
  ══════════════════════════════════════════════ */
  /* Rewire internal links inside a cloned pulse node so they open in the
     col-C viewer instead of navigating away. External links are left alone
     (e.g. the sponsor ad), so they behave exactly like on mobile. */
  function rewirePulseNode(node){
    node.querySelectorAll('a[href]').forEach(a => {
      const raw = a.getAttribute('href') || '';
      if(/^https?:\/\/|^\/\//.test(raw)) return;        /* external → leave */
      let path;
      try{ path = new URL(raw, location.origin).pathname; }catch(x){ return; }
      a.setAttribute('href','#');
      a.addEventListener('click', function(e){
        e.preventDefault();
        if(EP_PAGE_RE.test(path)){
          openContent(path, a.textContent.trim());
        } else if(path === '/glossary/' || path.startsWith('/glossary/')){
          openPageViewer(path.endsWith('.html') ? path : '/glossary/');
        } else if(path === '/episodes.html' || path === '/episodes/' || path === '/episodes/index.html'){
          openPageViewer('/episodes.html');
        } else {
          openContent(path, a.textContent.trim());
        }
      });
    });
    return node;
  }

  /* Desktop pulse fully follows the mobile pulse — list AND ad — so the
     pulse only ever needs to be edited in one place (#dcPulseCard). */
  function syncDesktopPulse(){
    const srcCard  = document.getElementById('dcPulseCard');
    const destCard = document.getElementById('dcdPulse');
    if(!srcCard || !destCard) return;

    /* News items */
    const srcList  = srcCard.querySelector('.dc-pulse-list');
    const destList = destCard.querySelector('.dc-pulse-list');
    if(srcList && destList){
      destList.innerHTML = '';
      srcList.querySelectorAll('li').forEach(li =>
        destList.appendChild(rewirePulseNode(li.cloneNode(true))));
    }

  }

  /* ══════════════════════════════════════════════
     WELCOME — "آخرین مطالب دنت‌کست" cards
     The last 6 brain entries that have a page_url
     (newest first), rendered as glass cards over the
     cover image. Clicking routes into the viewer.
  ══════════════════════════════════════════════ */
  const LATEST_LABEL = {
    dentcast:'اپیزود', notecast:'NoteCast', clinical:'Clinical Insight',
    insight:'Clinical Insight', dentcast_plus:'ویدیو',
    promptologist:'پرامپتولوژیست', meta:'Meta Note', chairside:'Chairside',
    sharehub:'Share Hub', litecast:'LiteCast', plak_sefr:'پلاک صفر',
    taraz:'تراز شواهد',
    /* closed sections (1405/07/15): the type stays on the entry, the word a
       reader sees is the section that absorbed it. */
    dentai:'Share Hub', photocast:'Share Hub'
  };
  /* Every brain type that can reach this card needs a row above. The fallback
     below is `|| x.type`, which prints the RAW KEY — `plak_sefr` was missing and
     was doing exactly that on the live homepage, on two of the six newest
     cards. The name was never in doubt: the sidebar tree has said «پلاک صفر»
     all along. Adding a section means adding it here too. */
  function renderDesktopLatest(){
    const host = document.getElementById('dcdLatest');
    if(!host || host.dataset.loaded) return;
    getBrain().then(brain => {
      const linked = (Array.isArray(brain) ? brain : [])
        .filter(x => x && x.page_url && x.title);
      const latest = linked.slice(-6).reverse();   /* newest first */
      if(!latest.length) return;
      host.dataset.loaded = '1';
      host.innerHTML = latest.map(x => {
        const title = (x.title || '').replace(/^\d+[-–.\s]+/, '').trim();
        const label = LATEST_LABEL[x.type] || x.type || '';
        return `<a class="dcd-latest-card" href="${h(x.page_url)}" data-url="${h(x.page_url)}">
                  <span class="dcd-latest-badge">${h(label)}</span>
                  <span class="dcd-latest-title">${h(title)}</span>
                </a>`;
      }).join('');
      host.querySelectorAll('.dcd-latest-card').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          const url = a.getAttribute('data-url');
          let path; try{ path = new URL(url, location.origin).pathname; }catch(x){ path = url; }
          if(/^\/glossary\//.test(path)) openPageViewer(path.endsWith('.html') ? path : '/glossary/');
          else if(/^\/pillar\//.test(path)) openPageViewer(path);
          else if(path === '/episodes.html' || path === '/episodes/' || path === '/episodes/index.html') openPageViewer('/episodes.html');
          else openContent(path, a.querySelector('.dcd-latest-title')?.textContent.trim() || '');
        });
      });
    }).catch(()=>{});
  }

  /* ══════════════════════════════════════════════
     ARCHIVE — the desktop home of #panel-sharehub
  ══════════════════════════════════════════════ */
  /* One router for every card on that surface. The phone navigates away with
     an inline window.location.href; here that would leave the app shell, so
     each card carries data-href (or, for the pillar card, a real href that is
     preventDefault-ed) and lands in the right place:
       · a directory or a landing page  -> the page viewer, like the tree's own
         «اپیزودها» and «Glossary» entries and like the welcome column's cards;
       · an article path                -> column C's reader.
     The cabinet is deliberately NOT routed — library-gate.js owns that door on
     every surface of the site and must decide before anything navigates. */
  function dcdRouteArchive(url){
    let u; try{ u = new URL(url, location.origin); }catch(x){ return false; }
    const path = u.pathname;
    if(path === '/dentcast_cabinet_search.html') return false;   // the gate's, not ours
    /* /plus/* is the account app — its own pages, its own scripts, its own
       payment flow. It is deliberately NOT routed into this column: putting a
       checkout inside an iframe is a decision, not a detail. Those links keep
       navigating, exactly as they did before. */
    if(/^\/plus\//.test(path)) return false;
    /* The viewer gets the WHOLE url — query and hash included. It used to get
       the pathname alone, which is how the پریمیوم tab's «بالاترین» row
       (/up-board/?sort=top) opened the board on «تازه‌ترین» in this column
       while the phone landed on the ranked list (2026-09-21). */
    if(path.endsWith('/') || !/\.html?$/i.test(path) || path === '/episodes.html'
       || /^\/(glossary|pillar|up-board|des-board)\//.test(path)) openPageViewer(path + u.search + u.hash);
    else openContent(path, '');
    return true;
  }
  /* ONE router, every card surface in this column.
     It was written for the archive in step 4, and the welcome column needed it
     just as much: measured on 2026-09-10, fourteen of its entry points left the
     app shell outright — «دسته‌های محتوا», the pillar rail and its «همه ←», the
     up-board rows and «همه ›», the «پرجستجو» chips and the DES-board door were
     plain links to a directory or an article, so pressing one reloaded the
     whole site as a standalone page. The phone navigates by design; this shell
     must not. */
  function bindCardRouter(host){
    if(!host) return;
    host.addEventListener('click', (e) => {
      if(e.defaultPrevented || e.button !== 0) return;
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const hit = e.target.closest('[data-href], a[href]');
      if(!hit || !host.contains(hit)) return;
      const url = hit.dataset.href || hit.getAttribute('href');
      if(!url || /^(https?:|mailto:|tel:|#)/.test(url)) return;
      if(dcdRouteArchive(url)) e.preventDefault();
    });
  }
  bindCardRouter(document.getElementById('dcd-welcome-feed'));
  const archiveEl = document.getElementById('dcd-archive');
  const archiveItem = document.getElementById('dcd-archive-item');
  /* Column C's آرشیو / پریمیوم states are remembered under the SAME key the
     phone's showPanel() writes (`dc:panel`), for the same reason: every card on
     the پریمیوم surface leaves the page, and a «بازگشت» that reloads the
     homepage landed on the welcome column here while the phone landed back on
     the tab (2026-09-21). page-back.js reads the key for its label, enable()
     reads it to restore the column, and opening anything else in the column
     clears it — a reader who left from an article did not leave from the tab. */
  function rememberColC(id){
    try{ if(id) sessionStorage.setItem('dc:panel', id); else sessionStorage.removeItem('dc:panel'); }catch(e){}
  }
  function showArchive(){
    root.querySelectorAll('.dcd-subitem').forEach(b => b.classList.remove('active'));
    archiveItem && archiveItem.classList.add('active');
    premiumItem && premiumItem.classList.remove('active');
    if(colCEl){ colCEl.classList.remove('is-viewer'); colCEl.classList.remove('is-patient'); }
    if(pageViewer) pageViewer.src = 'about:blank';
    colCScroll.classList.remove('has-content');
    colCScroll.classList.remove('is-premium');
    colCScroll.classList.add('is-archive');
    colCScroll.scrollTop = 0;
    rememberColC('panel-sharehub');
  }
  if(archiveItem) archiveItem.addEventListener('click', showArchive);
  /* پریمیوم — the fourth exclusive state of column C, the archive's twin. */
  const premiumEl = document.getElementById('dcd-premium');
  const premiumItem = document.getElementById('dcd-premium-item');
  function showPremium(){
    root.querySelectorAll('.dcd-subitem').forEach(b => b.classList.remove('active'));
    archiveItem && archiveItem.classList.remove('active');
    premiumItem && premiumItem.classList.add('active');
    if(colCEl){ colCEl.classList.remove('is-viewer'); colCEl.classList.remove('is-patient'); }
    if(pageViewer) pageViewer.src = 'about:blank';
    colCScroll.classList.remove('has-content');
    colCScroll.classList.remove('is-archive');
    colCScroll.classList.add('is-premium');
    colCScroll.scrollTop = 0;
    rememberColC('panel-premium');
  }
  if(premiumItem) premiumItem.addEventListener('click', showPremium);
  if(premiumEl) bindCardRouter(premiumEl);
  if(archiveEl){
    bindCardRouter(archiveEl);
    /* رادار opens the same overlay the topbar icon does. */
    const r = document.getElementById('dcdBtnOpenRadar');
    if(r) r.addEventListener('click', openRadarOverlay);
  }

  /* هیروی اپیزود (#dcd-card-episodes) — the desktop copy of the phone's
     featured-episode card. The phone's sets window.location.href inline; here
     that would leave the app shell and reload the homepage, so the card is
     routed through the SAME openContent/openPageViewer split every «آخرین
     مطالب» card above uses. The play button is excluded — its own handler
     stops propagation, but the guard makes that independent of ordering. */
  (function(){
    const hero = document.getElementById('dcd-card-episodes');
    if(!hero) return;
    const go = (e) => {
      if(e.target && e.target.closest && e.target.closest('.dc-home-hero-play')) return;
      /* This card sits inside #dcd-welcome-feed, whose bindCardRouter() opens
         every [data-href] it sees unless the click is already handled — so
         without this one line a single click opened the episode TWICE, 7ms
         apart, and the second render replaced column C under the first one's
         still-mounting workbench («insertBefore of null», found 1405/07/01). */
      e.preventDefault();
      const url = hero.dataset.href || '/episodes.html';
      let path; try{ path = new URL(url, location.origin).pathname; }catch(x){ path = url; }
      if(path === '/episodes.html' || path === '/episodes/' || path === '/episodes/index.html') openPageViewer('/episodes.html');
      else openContent(path, hero.querySelector('.dc-home-hero-title')?.textContent.trim() || '');
    };
    hero.addEventListener('click', go);
    hero.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(e); }
    });
  })();

  /* ══════════════════════════════════════════════
     ENABLE / DISABLE DESKTOP MODE
  ══════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════
     COL-C: PODCAST PLAYER
     dc-nav.js owns exactly one player (mount, audio hooks, resume, exclusivity
     with the music button). We do NOT build a second one — that would be two
     iframes fighting over one audio. We only adopt its overlay into column 3 so
     it opens under THIS header, and let its own toggle do the rest.
     Adoption happens BEFORE the first open, while the overlay is still an empty
     div: dc-nav mounts the iframe lazily on open, so nothing ever reloads and
     the podcast keeps playing while the reader moves between articles — the
     whole point of the mobile design, preserved here.
  ══════════════════════════════════════════════ */
  /* The search and radar overlays, hosted in column C — the same move
     hostPlayerInColumn() makes below, generalised. Called on the way OPEN, so
     an overlay that was released back to <body> for the mobile layout is
     re-adopted the next time the desktop shell opens it. */
  function hostOverlayInColumn(id){
    const ov = document.getElementById(id);
    if(!ov || !colCEl) return null;
    const bar = colCEl.querySelector('.dcd-col-c-topbar');
    if(bar) colCEl.style.setProperty('--dcd-topbar-h', bar.offsetHeight + 'px');
    if(ov.parentNode !== colCEl) colCEl.appendChild(ov);
    return ov;
  }
  function releaseOverlayFromColumn(id){
    const ov = document.getElementById(id);
    if(ov && ov.parentNode !== document.body) document.body.appendChild(ov);
  }

  function hostPlayerInColumn(){
    const ov = document.getElementById('dcPlayerOverlay');
    if(!ov || !colCEl) return null;
    const bar = colCEl.querySelector('.dcd-col-c-topbar');
    if(bar) colCEl.style.setProperty('--dcd-topbar-h', bar.offsetHeight + 'px');
    if(ov.parentNode !== colCEl) colCEl.appendChild(ov);
    return ov;
  }
  /* Give the overlay back to <body> when the viewport drops to the mobile
     layout: down there the mobile header's own trigger owns it, and a player
     parked inside the (now hidden) desktop column would be unreachable. */
  function releasePlayerFromColumn(){
    const ov = document.getElementById('dcPlayerOverlay');
    if(ov && ov.parentNode !== document.body) document.body.appendChild(ov);
  }
  const podBtn = document.getElementById('dcd-hdr-podcast');
  if(podBtn){
    podBtn.addEventListener('click', function(){
      hostPlayerInColumn();
      if(typeof window.dcPodcastToggle === 'function') window.dcPodcastToggle();
    });
  }

  function enable(){
    if(enabled) return;
    enabled = true;
    document.body.classList.add('dc-desktop-ui');
    root.setAttribute('aria-hidden', 'false');
    /* NOTE: syncThemeIcon() used to be called here but was never defined
       anywhere, so under "use strict" it threw a ReferenceError that aborted
       enable() before the pulse/cards could populate. Guard it so an optional
       (possibly later-defined) helper can never break the welcome again. */
    if(typeof syncThemeIcon === 'function') syncThemeIcon();
    syncDesktopPulse();
    renderDesktopLatest();
    /* make radar overlay visible above desktop when opened */
    const radarOverlay = document.getElementById('dcRadarOverlay');
    if(radarOverlay) radarOverlay.style.removeProperty('display');
    /* Auto-load first sub-item (NoteCast) */
    const first = root.querySelector('.dcd-subitem');
    if(first && !first.dataset.autoloaded){
      first.dataset.autoloaded = '1';
      first.click();
    }
    /* Restore the column the reader left from (a «بازگشت» off a پریمیوم or
       آرشیو card, a refresh) — the phone's own restore, one shell over. Same
       guards: a hash or a ?tour= / ?patient link owns the landing. */
    if(!root.dataset.restored){
      root.dataset.restored = '1';
      try{
        const remembered = sessionStorage.getItem('dc:panel');
        if(remembered && !location.hash && !/[?&](tour=|patient\b)/.test(location.search)){
          if(remembered === 'panel-premium') showPremium();
          else if(remembered === 'panel-sharehub') showArchive();
        }
      }catch(e){}
    }
  }

  function disable(){
    if(!enabled) return;
    enabled = false;
    document.body.classList.remove('dc-desktop-ui');
    root.setAttribute('aria-hidden', 'true');
    releasePlayerFromColumn();
    /* …and the two overlays with it: parked inside a column that is now
       display:none, the mobile shell's own triggers would open something
       nobody can see. Same reasoning as the player. */
    releaseOverlayFromColumn('dcSearchOverlay');
    releaseOverlayFromColumn('dcRadarOverlay');
  }

  function sync(){ isDesk() ? enable() : disable(); }
  sync();
  window.addEventListener('resize', sync);
})();
</script>

<script>
/* ── CINEMATIC PATIENTS — scroll engine ── */
(function(){
  'use strict';
  const FRAME_COUNT = 277;

  const track     = document.getElementById('pt-track');
  const canvas    = document.getElementById('pt-canvas');
  const gradBot   = document.getElementById('pt-grad-bottom');
  const heroScene = document.getElementById('pt-scene-hero');
  const lcScene   = document.getElementById('pt-scene-knowledge');
  const artScene  = document.getElementById('pt-scene-articles');
  const ctaScene  = document.getElementById('pt-scene-cta');
  const hintEl    = document.getElementById('pt-scroll-hint');
  const lcCtaLink = document.getElementById('pt-lc-cta-link');
  const heroBot   = document.getElementById('pt-hero-bottom');
  const body      = document.getElementById('mobile-body');
  const sticky    = track ? track.querySelector('.pt-sticky') : null;
  const circEl    = document.getElementById('pt-circuit');
  const circSvg   = document.getElementById('pt-circuit-svg');
  const stubsPath = document.getElementById('pt-trace-stubs');
  const viasEl    = document.getElementById('pt-vias');
  const basePath  = document.getElementById('pt-trace-base');
  const litPath   = document.getElementById('pt-trace-lit');
  const signalEl  = document.getElementById('pt-signal');
  const nodeEls   = [0,1,2,3].map(function(i){ return document.getElementById('pt-node-'+i); });
  /* circuit chapter anchors = the scroll fraction where each scene is fully on */
  const CHAPTERS  = [0, 0.27, 0.60, 0.94];

  if(!track || !canvas || !body) return;

  const ctx = canvas.getContext('2d');
  canvas.width  = 540;
  canvas.height = 960; /* fallback until the panel is first shown and measured */

  /* cover-fit draw */
  function drawFrame(img){
    if(!img || !img.naturalWidth) return;
    const cw=canvas.width, ch=canvas.height;
    const scale=Math.max(cw/img.naturalWidth, ch/img.naturalHeight);
    ctx.drawImage(img,(cw-img.naturalWidth*scale)/2,(ch-img.naturalHeight*scale)/2,img.naturalWidth*scale,img.naturalHeight*scale);
  }

  /* stage = exact visible strip of the scroller between topbar and bottom nav.
     Measured from the live layout — works on every device, no magic numbers. */
  let railH=0;
  function measure(){
    const bn=document.querySelector('.dc-bottom-nav');
    const stage=Math.max(240, body.clientHeight-(bn?bn.offsetHeight:0));
    document.documentElement.style.setProperty('--pt-stage', stage+'px');
    railH=circEl?circEl.clientHeight:0;
    buildCircuit();
  }

  /* build the PCB trace to the rail's real pixel height: a vertical spine that
     elbows 45° left/right between the 4 solder-pad nodes, plus a few dead-end
     stubs with via dots for the board feel. nodeLen[] maps each node to its
     true arc length so the lit run and the signal dot hit pads dead-on. */
  let totLen=0, nodeLen=[0,0,0,0];
  function buildCircuit(){
    if(!circSvg||!basePath||!litPath) return;
    const H=Math.round(railH);
    if(H<140) return; /* panel hidden or rail too short — keep last build */
    const AX=11, J=5, INS=12, G=12;
    circSvg.setAttribute('viewBox','0 0 22 '+H);
    circSvg.setAttribute('height',H);
    const ys=CHAPTERS.map(function(c){ return INS+c*(H-2*INS); });
    let d='M'+AX+' '+ys[0], sd='', len=0;
    nodeLen=[0];
    if(viasEl) viasEl.innerHTML='';
    for(let i=0;i<3;i++){
      const dir=(i%2===0)?1:-1, x=AX+dir*J, y1=ys[i], y2=ys[i+1];
      d+=' L'+AX+' '+(y1+G)
       + ' L'+x +' '+(y1+G+J)
       + ' L'+x +' '+(y2-G-J)
       + ' L'+AX+' '+(y2-G)
       + ' L'+AX+' '+y2;
      len+=(y2-y1)+2*J*(Math.SQRT2-1);
      nodeLen.push(len);
      /* dead-end stub + via, branching off the run toward the other side */
      const ym=Math.round((y1+y2)/2), bx=x-dir*8;
      sd+='M'+x+' '+ym+' L'+bx+' '+ym+' ';
      if(viasEl){
        const v=document.createElementNS('http://www.w3.org/2000/svg','circle');
        v.setAttribute('class','pt-via');
        v.setAttribute('cx',bx); v.setAttribute('cy',ym); v.setAttribute('r','1.6');
        viasEl.appendChild(v);
      }
    }
    basePath.setAttribute('d',d);
    litPath.setAttribute('d',d);
    if(stubsPath) stubsPath.setAttribute('d',sd);
    totLen=litPath.getTotalLength();
    const k=len>0?totLen/len:1;
    for(let i=0;i<nodeLen.length;i++) nodeLen[i]*=k;
    litPath.style.strokeDasharray=totLen+' '+totLen;
    nodeEls.forEach(function(n,i){ if(n) n.setAttribute('transform','translate('+AX+' '+ys[i]+')'); });
  }

  /* size the canvas backing store to the stage (capped DPR) for a sharp film */
  function sizeCanvas(){
    if(!sticky) return;
    const r=sticky.getBoundingClientRect();
    if(r.width<10||r.height<10) return; /* panel hidden — keep fallback store */
    const dpr=Math.min(window.devicePixelRatio||1, 2);
    canvas.width =Math.max(1,Math.round(r.width *dpr));
    canvas.height=Math.max(1,Math.round(r.height*dpr));
    const f=frames[lastIdx>=0?lastIdx:0];
    if(f&&f.complete&&f.naturalWidth){ ctx.clearRect(0,0,canvas.width,canvas.height); drawFrame(f); }
  }
  measure();

  /* frames — the film is 277 webp files (~3.9 MB) and the panel is hidden
     on every homepage load (and never shown at all on the desktop shell,
     which plays /patients/cinematic.html in its own column), so only the
     poster (frame 1) is fetched eagerly; the rest start the first time
     #panel-patient turns .active (tab, swipe, ?patient/#patient, the
     remembered tab) — see loadFrame/startPreload and the observer below. */
  const frames=[];
  let preloadStarted=false;
  function loadFrame(i){
    if(frames[i-1]) return frames[i-1];
    const img=new Image();
    img.src='/patients/frames/f'+String(i).padStart(3,'0')+'.webp';
    img.onload=function(){
      /* poster before any scroll, or the frame the reader is parked on
         that arrived after update() had to draw a neighbour instead */
      if(lastIdx===-1 ? i===1 : lastIdx===i-1){ ctx.clearRect(0,0,canvas.width,canvas.height); drawFrame(img); }
    };
    frames[i-1]=img;
    return img;
  }
  function startPreload(){
    if(preloadStarted) return;
    preloadStarted=true;
    for(let i=1;i<=FRAME_COUNT;i++) loadFrame(i);
  }
  /* nearest frame already decoded, for a scroll that outruns the download */
  function nearestReady(idx){
    for(let d=0;d<FRAME_COUNT;d++){
      const a=frames[idx-d], b=frames[idx+d];
      if(a&&a.complete&&a.naturalWidth) return a;
      if(b&&b.complete&&b.naturalWidth) return b;
    }
    return null;
  }
  loadFrame(1); /* poster */

  /* helpers */
  function rng(p,a,b){ return Math.max(0,Math.min(1,(p-a)/(b-a))); }
  function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
  function setO(el,v){ if(el) el.style.opacity=v; }
  function setPE(el,on){ if(el) el.style.pointerEvents=on?'auto':'none'; }

  /* show hero at start */
  if(heroScene){ heroScene.style.opacity='1'; heroScene.style.pointerEvents='auto'; }

  let lastIdx=-1, ticking=false;

  function update(){
    ticking=false;
    const panel=document.getElementById('panel-patient');
    if(!panel||!panel.classList.contains('active')) return;

    const total=track.offsetHeight-body.clientHeight;
    if(total<=0) return;
    const bRect=body.getBoundingClientRect();
    const tRect=track.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(bRect.top-tRect.top)/total));

    /* === FRAMES — sharp, clean per-frame draw === */
    const idx=Math.round(p*(FRAME_COUNT-1));
    if(idx!==lastIdx){
      lastIdx=idx;
      startPreload(); /* a scroll on the panel means it is being seen */
      const f=frames[idx], ready=(f&&f.complete&&f.naturalWidth)?f:nearestReady(idx);
      if(ready){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        drawFrame(ready);
      }
    }

    /* === PROGRESS CIRCUIT — lit trace + riding signal + node states === */
    if(totLen>0){
      let li=0;
      for(let i=CHAPTERS.length-1;i>=0;i--){ if(p>=CHAPTERS[i]-0.001){ li=i; break; } }
      const segT=(li>=CHAPTERS.length-1)?1:rng(p,CHAPTERS[li],CHAPTERS[li+1]);
      const len=nodeLen[li]+(nodeLen[Math.min(li+1,CHAPTERS.length-1)]-nodeLen[li])*segT;
      litPath.style.strokeDashoffset=(totLen-len);
      if(signalEl){
        const pt=litPath.getPointAtLength(len);
        signalEl.setAttribute('transform','translate('+pt.x+' '+pt.y+')');
        /* dot rides only mid-journey: appears on first scroll, fades out as
           the signal is "delivered" to the final node */
        signalEl.style.opacity=(p>0.01&&p<0.93)?'1':'0';
      }
      nodeEls.forEach(function(n,i){
        if(!n) return;
        n.classList.toggle('on', i<=li);
        n.classList.toggle('cur', i===li);
      });
    }

    /* === DOCTOR IDENTITY — parallax up, like painted on the frame === */
    if(heroBot){
      const shift = ease(rng(p,0,0.44)) * (body.clientHeight + 80);
      heroBot.style.transform = 'translateY(-'+shift+'px)';
    }

    /* === SCENE 1: HERO (fades out 0.08 → 0.22) === */
    const heroO=ease(1-rng(p,0.08,0.22));
    setO(heroScene,heroO);
    setPE(heroScene,heroO>0.04);
    if(hintEl) hintEl.style.opacity=Math.max(0,1-p/0.07);

    /* === SCENE 2: LITECAST (0.18 → 0.58) === */
    const lcO=Math.min(ease(rng(p,0.18,0.27)),ease(1-rng(p,0.50,0.58)));
    setO(lcScene,lcO);
    setPE(lcScene,lcO>0.05);
    const lcCards=document.querySelectorAll('.pt-lc-card');
    [[0,0.21,0.29],[1,0.27,0.35],[2,0.33,0.41]].forEach(function(d){

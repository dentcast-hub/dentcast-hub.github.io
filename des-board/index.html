/* ══ amber = «this is what a subscription buys», site-wide. Never used for
   anything else on this page, and never on the band scale. ══ */
:root{--x-amber:#c9922b;--x-amber-ink:#8a6414;--x-amber-wash:rgba(201,146,43,.08);
  --x-amber-bd:rgba(154,107,21,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --x-amber:#e3b849;--x-amber-ink:#e3b849;--x-amber-wash:rgba(227,184,73,.09);
  --x-amber-bd:rgba(227,184,73,.26)}}
:root[data-theme="dark"]{--x-amber:#e3b849;--x-amber-ink:#e3b849;
  --x-amber-wash:rgba(227,184,73,.09);--x-amber-bd:rgba(227,184,73,.26)}

/* the single tab. Amber, because amber means «this is what a subscription buys»
   site-wide — and it is shown to everyone, in the same place, whether or not they
   can open it. */
.onetab{width:100%;display:flex;align-items:center;gap:.65rem;margin:1.5rem 0 1rem;
  padding:.85rem .9rem;border-radius:var(--r-lg);font:inherit;text-align:right;cursor:pointer;
  background:var(--x-amber-wash);border:1px solid var(--x-amber-bd);color:var(--txt);
  box-shadow:var(--card-sh);transition:background var(--tr)}
.onetab:hover{background:color-mix(in srgb,var(--x-amber) 12%,transparent)}
.onetab:focus-visible{outline:2px solid var(--x-amber);outline-offset:2px}
.onetab-l{flex:none;font-size:1rem;line-height:1}
.onetab-m{flex:1;min-width:0}
.onetab-m b{display:block;font-size:.92rem;font-weight:900;line-height:1.6;letter-spacing:-.01em}
.onetab-m i{display:block;font-style:normal;font-size:.71rem;font-weight:700;
  color:var(--x-amber-ink);margin-top:.1rem}
.onetab-c{flex:none;font-size:1.15rem;font-weight:900;color:var(--x-amber-ink)}
/* the chevron turns when the arrangement is open; the lock is removed by the
   module, which is the only thing that knows which of the three gate answers
   came back. */
.onetab-c{transition:transform var(--tr)}

/* the gate card: what the arrangement IS, before what it costs */
.gate{background:var(--card-bg);border:1px solid var(--x-amber-bd);border-radius:var(--r-lg);
  box-shadow:var(--card-sh);overflow:hidden;margin:0 0 1.2rem}
.gate-h{margin:0;padding:.85rem .95rem .1rem;font-size:1.02rem;font-weight:900}
.gate-p{margin:.3rem 0 .85rem;padding:0 .95rem;font-size:.83rem;line-height:1.95;color:var(--txt2);text-wrap:pretty}
.gate .rail{margin:0 .95rem .5rem}
.gate .rail + .rail{margin-bottom:.2rem}
.gate-f{margin:1rem 0 0;padding:.8rem .95rem .95rem;background:var(--x-amber-wash);
  border-top:1px solid var(--x-amber-bd)}
.gate-f p{margin:0 0 .6rem;font-size:.8rem;line-height:1.9;color:var(--txt2)}
.gate-s{display:block;margin:.55rem 0 0;font-size:.72rem;color:var(--txt3)}

/* Only what dc-theme.css does NOT own. Everything else on this page —
   --ac/--surface/--txt/--card-sh/--r-* — comes from the design system, and a
   second definition in a page file would silently override it. The DES band
   scale is mirrored from plus.css, which this page does not load. */
:root{
  --des-E:#78808f; --des-D:#5f8a63; --des-C:#3f9a49; --des-B:#2f8f3f; --des-A:#1f7a34;
  --des-chrome:#6455a6; --des-chrome-rgb:100,85,166;
  --seg-sh:0 1px 3px rgba(2,35,96,.09);
  --prov-ink:#8a6414; --prov-bd:rgba(201,146,43,.5); --prov-bg:rgba(201,146,43,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --des-E:#8b93a3; --des-D:#89a68c; --des-C:#6fae74; --des-B:#4f9d5c; --des-A:#2f8f52;
  --des-chrome:#a99ce0; --des-chrome-rgb:169,156,224;
  --seg-sh:0 1px 3px rgba(0,0,0,.3);
  --prov-ink:#e3b849; --prov-bd:rgba(227,184,73,.5); --prov-bg:rgba(227,184,73,.10);
}}
:root[data-theme="dark"]{
  --des-E:#8b93a3; --des-D:#89a68c; --des-C:#6fae74; --des-B:#4f9d5c; --des-A:#2f8f52;
  --des-chrome:#a99ce0; --des-chrome-rgb:169,156,224;
  --seg-sh:0 1px 3px rgba(0,0,0,.3);
  --prov-ink:#e3b849; --prov-bd:rgba(227,184,73,.5); --prov-bg:rgba(227,184,73,.10);
}
.bd-A{--bc:var(--des-A)} .bd-B{--bc:var(--des-B)} .bd-C{--bc:var(--des-C)}
.bd-D{--bc:var(--des-D)} .bd-E{--bc:var(--des-E)}
a{color:inherit}
.db-page{max-width:46rem;margin:0 auto;padding:1.15rem .85rem 5rem}

.db-page{max-width:46rem;margin:0 auto;padding:1.15rem .85rem 5rem}

/* ── hero: three lines, and the rail below carries the rest. The page opens on
   the arrangement, not on an essay about it — the explanation lives in the box
   on the homepage that this page is reached from. ── */
.db-hero{margin:.2rem 0 1.1rem}
.db-eyebrow{display:block;font-size:.68rem;font-weight:800;letter-spacing:.04em;
  color:var(--des-chrome);text-transform:uppercase}
.db-hero h1{margin:.15rem 0 .3rem;font-size:2rem;font-weight:900;letter-spacing:-.04em;
  line-height:1.25;text-wrap:balance}
.db-sub{margin:0;font-size:.82rem;color:var(--txt3);font-variant-numeric:tabular-nums}

/* ── the rail: the whole distribution in one line, and the page's only summary.
   It is a scale, so it is drawn as one — five cells in band order, each sized to
   nothing but its own count. Tapping a cell scrolls to that shelf. ── */
.rail{display:flex;gap:.3rem;margin:0 0 1.15rem;direction:ltr}
.rail-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;
  padding:.55rem .2rem .5rem;border-radius:var(--r-md);background:var(--card-bg);
  border:1px solid var(--card-border);cursor:pointer;font:inherit;
  transition:border-color var(--tr),transform var(--tr)}
.rail-c:hover{border-color:var(--bc);transform:translateY(-1px)}
.rail-c:disabled{opacity:.4;cursor:default;transform:none}
.rail-c:focus-visible{outline:2px solid var(--bc);outline-offset:2px}
.rail-g{width:1.55rem;height:1.55rem;border-radius:7px;background:var(--bc);color:#fff;
  display:grid;place-items:center;font-size:.78rem;font-weight:900;white-space:nowrap;
  padding:0 .3rem;min-width:1.55rem}
.rail-own .rail-g{background:rgba(var(--des-chrome-rgb),.13);color:var(--des-chrome);
  border:1px solid rgba(var(--des-chrome-rgb),.3);font-size:.62rem}
.rail-n{font-size:1.05rem;font-weight:900;color:var(--txt);
  font-variant-numeric:tabular-nums;line-height:1}
.rail-c:disabled .rail-n{color:var(--txt3)}

/* ── tabs ── */
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-f);padding:.2rem;margin:1.5rem 0 1rem}
.seg button{flex:1;font:inherit;font-size:.84rem;font-weight:800;color:var(--txt3);background:none;
  border:0;border-radius:var(--r-f);padding:.5rem .4rem;cursor:pointer;line-height:1.5;
  display:flex;flex-direction:column;transition:background var(--tr),color var(--tr)}
.seg button i{font-style:normal;font-size:.65rem;font-weight:600;opacity:.85}
.seg button[aria-selected="true"]{color:var(--ac);background:var(--surface);box-shadow:var(--seg-sh)}

/* ── group header ── */
.grp{margin:0 0 1.75rem;scroll-margin-top:4.5rem}
.gh{display:flex;align-items:center;gap:.65rem;margin:0 0 .7rem}
.gh div{flex:1;min-width:0}
.gh h3{margin:0;font-size:1rem;font-weight:900;letter-spacing:-.02em}
.gh-g{flex:none;width:2.1rem;height:2.1rem;border-radius:10px;background:var(--bc);color:#fff;
  display:grid;place-items:center;font-size:.95rem;font-weight:900}
.gh-own{background:rgba(var(--des-chrome-rgb),.12);border:1px solid rgba(var(--des-chrome-rgb),.3);
  color:var(--des-chrome);font-size:.8rem}
.gh-n{flex:none;font-size:.7rem;color:var(--txt3);font-variant-numeric:tabular-nums;align-self:flex-start}

/* ── the page card: the DentCast article is the object, papers are its evidence ── */
.pl{list-style:none;margin:0;padding:0;display:grid;gap:.65rem}
.pc{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r-lg);
  box-shadow:var(--card-sh);padding:.85rem .9rem;position:relative;overflow:hidden;
  transition:border-color var(--tr)}
.pc::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--bc)}
.pc-own::before{background:var(--des-chrome);opacity:.4}
.pc:hover{border-color:var(--chip-bd)}
.pc-t{display:block;font-size:1.02rem;font-weight:800;line-height:1.7;color:var(--txt);
  text-decoration:none;text-wrap:pretty;letter-spacing:-.01em}
.pc-t:hover{color:var(--ac)}
.pc-t:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:5px}
.pc-m{margin:.25rem 0 .65rem;font-size:.72rem;color:var(--txt3)}
.chipx{font-size:.64rem;font-weight:800;color:var(--txt3);background:var(--surface2);
  border:1px solid var(--border2);border-radius:5px;padding:.05rem .45rem;margin-inline-end:.4rem}
.pc-e{display:flex;align-items:center;gap:.55rem;margin:0 0 .55rem}
.pc-g{flex:none;width:2rem;height:2rem;border-radius:9px;background:var(--bc);color:#fff;
  display:grid;place-items:center;font-size:.88rem;font-weight:900}
.pc-gown{background:rgba(var(--des-chrome-rgb),.12);border:1px solid rgba(var(--des-chrome-rgb),.3);
  color:var(--des-chrome);font-size:.8rem;flex-direction:column;line-height:1;gap:0;width:2.3rem}
.pc-gown i{font-style:normal;font-size:.5rem;font-weight:600;opacity:.8}
.pc-gm{min-width:0}
.pc-gm b{display:block;font-size:.82rem;font-weight:800;color:var(--txt)}
.pc-gm i{display:block;font-style:normal;font-size:.71rem;color:var(--txt3);line-height:1.7}

/* the spectrum — one block per cited paper, strongest first */
.sp{display:flex;gap:2px;margin:0 0 .6rem;direction:rtl}
.sp-b{flex:1 1 0;height:7px;border-radius:2px;background:var(--bc);max-width:2.2rem}
.sp-na{background:var(--surface3);border:1px solid var(--border2)}

/* the sources, folded away — present but never in front of the article title */
.pc-d{border-top:1px solid var(--border2);margin-top:.1rem}
.pc-d>summary{list-style:none;cursor:pointer;padding:.55rem 0 .1rem;font-size:.79rem;
  font-weight:700;color:var(--ac);display:flex;align-items:center;gap:.4rem}
.pc-d>summary::-webkit-details-marker{display:none}
.pc-d>summary::after{content:"▾";font-size:.7rem;transition:transform var(--tr)}
.pc-d[open]>summary::after{transform:rotate(180deg)}
.pc-dn{font-size:.68rem;font-weight:800;color:var(--txt3);background:var(--surface2);
  border:1px solid var(--border2);border-radius:var(--r-f);padding:0 .45rem;
  font-variant-numeric:tabular-nums;margin-inline-start:auto}
.sl{list-style:none;margin:.5rem 0 .2rem;padding:0;display:grid;gap:.5rem}
.sr{display:flex;gap:.55rem;padding:.55rem .6rem;background:var(--surface2);
  border:1px solid var(--border2);border-radius:var(--r-md)}
.sr-g{flex:none;width:1.6rem;height:1.6rem;border-radius:7px;background:var(--bc);color:#fff;
  display:grid;place-items:center;font-size:.74rem;font-weight:900}
.sr-gna{background:var(--surface3);color:var(--txt3);border:1px solid var(--border2);font-size:.6rem}
.sr-m{min-width:0;flex:1}
.sr-t{margin:0;font-size:.79rem;font-weight:600;line-height:1.6;direction:ltr;text-align:left;color:var(--txt)}
.sr-s{margin:.2rem 0 0;font-size:.68rem;color:var(--txt3);direction:ltr;text-align:left}
.sr-s.fa{direction:rtl;text-align:right;display:flex;flex-wrap:wrap;gap:.3rem}
.sr-doi{color:var(--ac);font-weight:700;text-decoration:none}
.sr-tag{font-size:.65rem;font-weight:700;color:var(--txt3);background:var(--surface);
  border:1px solid var(--border2);border-radius:var(--r-f);padding:.02rem .5rem}
.sr-prov{color:var(--prov-ink);border:1px dashed var(--prov-bd);background:var(--prov-bg)}
.more{margin:.6rem 0 0;font-size:.75rem;color:var(--txt3);text-align:center}

.note{margin:0 0 1.1rem;font-size:.83rem;line-height:2;color:var(--txt2);background:var(--card-bg);
  border:1px solid var(--card-border);border-inline-start:3px solid var(--des-chrome);
  border-radius:var(--r-md);padding:.8rem .9rem;text-wrap:pretty}
.note b{color:var(--txt)}
.foot{margin:2rem 0 0;padding-top:1rem;border-top:1px solid var(--border);font-size:.73rem;
  line-height:1.95;color:var(--txt3);text-wrap:pretty}
[hidden]{display:none!important}

/* dc-theme.css styles every <a> inside <main> as a prose link
   (`body:has(.dc-topbar) main a -> var(--ac)`), which outranks a bare class
   selector. These are links, but they are cards and controls rather than links
   in a sentence, so the page re-asserts their colours at a specificity that
   beats it. Scoped to #dbRoot so nothing outside this page is affected.

   The .dcp-btn pair is not cosmetic: premium-cta.js renders an <a>, and the
   plus/ pages that normally host it carry no .dc-topbar, so plus.css has never
   had to outrank this rule before. Inside this page's <main> it did — the
   purchase button rendered #0b5fff text on its own #0b5fff background, an
   invisible label on the one surface that exists to convert. Values mirror
   plus.css's .dcp-btn-primary / .dcp-btn. */
#dbRoot .pc-t{color:var(--txt)}
#dbRoot .pc-t:hover{color:var(--ac)}
#dbRoot .sr-doi{color:var(--ac)}
#dbRoot .dcp-btn{color:var(--dcp-ink);text-decoration:none}
#dbRoot .dcp-btn-primary{color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(min-width:44rem){
  .db-page{padding:1.75rem 1.5rem 5rem}
  h1{font-size:2.05rem}
  .warn-b{grid-template-columns:1fr 1fr}
  .warn-b .wpt-wide{grid-column:1/-1}
  .pl{grid-template-columns:1fr 1fr;align-items:start}
}

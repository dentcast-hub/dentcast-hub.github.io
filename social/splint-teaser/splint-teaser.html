<title>تیزر اسپلینت یا جدا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap">
<style>
/* Layout: one vertical 9:16 stage with a slim transport bar under it. Single dark look in the DentCast navy, same family as the occlusion teaser. */
:root{
  --ground:#030b1d; --panel:#0b1a38; --line:#1f3566; --ink:#e6edff; --muted:#8fa3cf; --accent:#7ea6ff;
  --ui:Vazirmatn,Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);padding-inline:16px;padding-block:20px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{height:min(80vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 30px 80px -30px #000}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;gap:12px;width:min(100%,calc(min(80vh,calc((100vw - 32px)*16/9))*9/16));direction:rtl}
.bar button{font:600 14px var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;cursor:pointer;flex:none}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar input{flex:1;min-width:0;accent-color:var(--accent);direction:ltr}
.bar output{font:400 13px var(--ui);color:var(--muted);font-variant-numeric:tabular-nums;flex:none;direction:ltr}
body.render{padding:0;display:block}
body.render .stage{height:1920px;width:1080px;border-radius:0;box-shadow:none}
body.render .bar{display:none}
</style>

<div class="stage"><canvas id="cv" width="1080" height="1920" aria-label="تیزر متحرک: دندانپزشکی که نمی‌داند روکش دو ایمپلنت مجاور را اسپلینت کند یا جدا بگذارد، و مطلبش را در دنت‌کست پیدا می‌کند"></canvas></div>
<div class="bar">
  <button id="play" type="button">توقف</button>
  <button id="again" type="button">از اول</button>
  <input id="scrub" type="range" min="0" max="23" step="0.01" value="0" aria-label="زمان">
  <output id="clock">0.0s</output>
</div>

<script>
const W=1080,H=1920,DUR=23;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const FF='Vazirmatn, Tahoma, sans-serif';
const K={ink:'#eaf0ff',blue:'#4f7fff',blueL:'#9dbcff',navy:'#0d2550',amber:'#e3b849',green:'#34c38f',bgA:'#030b1d',bgB:'#0b2a63',pat:'#9fb3dd',film:'#0a1428',bone:'#3a4f78'};

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const win=(t,a,b,f=.35)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,size,weight,color,alpha=1,align='center'){ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px ${FF}`;ctx.fillStyle=color;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(s,x,y);ctx.restore()}

/* ---------- a stick figure (same grammar as the occlusion teaser) ---------- */
function figure(x,y,s,o){
  const ph=o.phone||0,wa=o.walk||0,p=o.phase||0,look=o.look||0,mood=o.mood||0,col=o.color||K.ink,coat=o.coat||0,hold=o.hold||0,up=o.up||0;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=col;ctx.lineWidth=10;
  const hip=[0,-95],neck=[0,-165],sh=[0,-150];
  if(coat){ctx.save();ctx.beginPath();ctx.moveTo(-26,-158);ctx.lineTo(26,-158);ctx.lineTo(34,-70);ctx.lineTo(-34,-70);ctx.closePath();
    ctx.fillStyle='rgba(234,240,255,.16)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='rgba(234,240,255,.55)';ctx.stroke();ctx.restore();ctx.strokeStyle=col;ctx.lineWidth=10}
  [1,-1].forEach(k=>{const sw=wa*Math.sin(p+(k>0?0:Math.PI))*.55,a=k*.13+sw;
    const knee=[hip[0]+48*Math.sin(a),hip[1]+48*Math.cos(a)];
    const lift=wa*Math.max(0,Math.sin(p+(k>0?0:Math.PI)+.9))*.7;
    const foot=[knee[0]+48*Math.sin(a*.6),knee[1]+48*Math.cos(a*.6)-lift*10];
    ctx.beginPath();ctx.moveTo(...hip);ctx.lineTo(...knee);ctx.lineTo(...foot);ctx.stroke()});
  ctx.beginPath();ctx.moveTo(...hip);ctx.lineTo(...neck);ctx.stroke();
  [1,-1].forEach(k=>{const sw=wa*Math.sin(p+(k>0?Math.PI:0))*.5,b=k*.28+sw;
    let el=[sh[0]+42*Math.sin(b),sh[1]+42*Math.cos(b)],ha=[el[0]+42*Math.sin(b*.7),el[1]+42*Math.cos(b*.7)];
    const pe=[k*34,-112],phd=[k*11,-128];
    el=[lerp(el[0],pe[0],ph),lerp(el[1],pe[1],ph)];ha=[lerp(ha[0],phd[0],ph),lerp(ha[1],phd[1],ph)];
    if(hold>0){const he=[k*30,-118],hh=[k*16,-150];el=[lerp(el[0],he[0],hold),lerp(el[1],he[1],hold)];ha=[lerp(ha[0],hh[0],hold),lerp(ha[1],hh[1],hold)]}
    if(k<0&&up>0){el=[lerp(el[0],-38,up),lerp(el[1],-190,up)];ha=[lerp(ha[0],-58,up),lerp(ha[1],-236,up)]}
    ctx.beginPath();ctx.moveTo(...sh);ctx.lineTo(...el);ctx.lineTo(...ha);ctx.stroke()});
  if(ph>.02){ctx.save();ctx.globalAlpha*=ph;ctx.translate(0,-140);ctx.rotate(-.08);
    rr(-19,-30,38,58,7);ctx.fillStyle='#16244a';ctx.fill();ctx.lineWidth=4;ctx.stroke();
    rr(-13,-23,26,42,4);ctx.fillStyle=`rgba(157,188,255,${.55+.35*(o.glow||0)})`;ctx.fill();ctx.restore()}
  if(hold>.02){ctx.save();ctx.globalAlpha*=hold;ctx.translate(0,-178);rr(-46,-30,92,60,6);ctx.fillStyle=K.film;ctx.fill();
    ctx.lineWidth=4;ctx.strokeStyle='rgba(157,188,255,.7)';ctx.stroke();ctx.fillStyle='rgba(220,230,255,.85)';
    [-12,12].forEach(dx=>{rr(dx-6,-14,12,30,3);ctx.fill()});ctx.restore()}
  ctx.save();ctx.translate(0,-195);ctx.rotate(o.tilt||0);
  ctx.beginPath();ctx.arc(0,0,27,0,6.283);ctx.fillStyle=K.bgA;ctx.fill();ctx.lineWidth=9;ctx.strokeStyle=col;ctx.stroke();
  ctx.fillStyle=col;const ey=ph>.5?3:-2;
  [-9,9].forEach(e=>{ctx.beginPath();ctx.arc(e+look*9,ey,3.8,0,6.283);ctx.fill()});
  ctx.lineWidth=4;
  if(mood<1){ctx.globalAlpha=1-mood;ctx.beginPath();const mx=look*8;ctx.moveTo(mx-9,13);ctx.lineTo(mx-4,9);ctx.lineTo(mx+1,14);ctx.lineTo(mx+6,9);ctx.lineTo(mx+10,12);ctx.stroke()}
  if(mood>0){ctx.globalAlpha=mood;ctx.beginPath();ctx.arc(look*8,6,10,.25,Math.PI-.25);ctx.stroke()}
  ctx.restore();ctx.restore();
}

/* ---------- implants: a fixture, an abutment, a crown ---------- */
function fixture(x,y,s,col){ // y = top of the fixture (bone crest)
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(22,0);ctx.lineTo(16,150);ctx.quadraticCurveTo(0,166,-16,150);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle=K.film;ctx.lineWidth=3;
  for(let i=1;i<9;i++){const yy=i*16,hw=lerp(22,16,yy/150)+2;ctx.beginPath();ctx.moveTo(-hw,yy);ctx.lineTo(hw,yy+5);ctx.stroke()}
  rr(-12,-34,24,34,4);ctx.fillStyle=col;ctx.fill();
  ctx.restore();
}
function crowns(x1,x2,y,s,joined,col,lineCol){ // y = bottom of the crowns
  ctx.save();ctx.lineWidth=4*s;ctx.strokeStyle=lineCol;ctx.fillStyle=col;
  const cw=104*s,ch=92*s;
  const one=(cx)=>{ctx.beginPath();ctx.moveTo(cx-cw/2+10*s,y);ctx.quadraticCurveTo(cx-cw/2-6*s,y-ch*.55,cx-cw/2+8*s,y-ch);
    ctx.quadraticCurveTo(cx,y-ch-14*s,cx+cw/2-8*s,y-ch);ctx.quadraticCurveTo(cx+cw/2+6*s,y-ch*.55,cx+cw/2-10*s,y);ctx.closePath();ctx.fill();ctx.stroke()};
  one(x1);one(x2);
  if(joined){const mx=(x1+x2)/2;rr(mx-24*s,y-ch*.78,48*s,ch*.42,10*s);ctx.fill();
    ctx.beginPath();ctx.moveTo(mx-24*s,y-ch*.78);ctx.lineTo(mx+24*s,y-ch*.78);ctx.moveTo(mx-24*s,y-ch*.36);ctx.lineTo(mx+24*s,y-ch*.36);ctx.stroke()}
  ctx.restore();
}

/* ---------- the room ---------- */
function room(a){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;
  ctx.strokeStyle='rgba(157,188,255,.28)';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(60,1690);ctx.lineTo(1020,1690);ctx.stroke();
  // door on the right
  rr(850,1250,150,440,8);ctx.stroke();ctx.beginPath();ctx.arc(870,1480,7,0,6.283);ctx.fillStyle='rgba(157,188,255,.4)';ctx.fill();
  // light box on the wall
  rr(120,1150,230,150,12);ctx.stroke();ctx.fillStyle='rgba(157,188,255,.07)';ctx.fill();
  ctx.restore();
}

function bg(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,K.bgA);g.addColorStop(1,K.bgB);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.05;ctx.strokeStyle='#8fb0ff';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.restore();
}
function vignette(){const v=ctx.createRadialGradient(540,960,600,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}

/* ---------- the radiograph panel ---------- */
function radiograph(t,a){
  if(a<=0)return;
  ctx.save();ctx.globalAlpha*=a;const k=back(seg(t,3.0,3.6));
  ctx.translate(540,560);ctx.scale(lerp(.3,1,k),lerp(.3,1,k));
  rr(-360,-250,720,500,26);ctx.fillStyle=K.film;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(157,188,255,.45)';ctx.stroke();
  // bone
  ctx.save();rr(-360,-250,720,500,26);ctx.clip();
  const bgr=ctx.createLinearGradient(0,-40,0,250);bgr.addColorStop(0,'rgba(90,115,165,.55)');bgr.addColorStop(1,'rgba(60,80,125,.35)');
  ctx.fillStyle=bgr;ctx.beginPath();ctx.moveTo(-360,-10);
  for(let x=-360;x<=360;x+=20)ctx.lineTo(x,-10+Math.sin(x*.03)*8);ctx.lineTo(360,250);ctx.lineTo(-360,250);ctx.closePath();ctx.fill();
  // natural teeth either side
  ctx.fillStyle='rgba(200,214,245,.55)';
  [-280,280].forEach(x=>{ctx.beginPath();ctx.moveTo(x-55,-110);ctx.quadraticCurveTo(x,-150,x+55,-110);ctx.lineTo(x+40,-10);ctx.lineTo(x+20,190);ctx.lineTo(x-20,190);ctx.lineTo(x-40,-10);ctx.closePath();ctx.fill()});
  fixture(-80,-10,1,'rgba(235,242,255,.95)');fixture(80,-10,1,'rgba(235,242,255,.95)');
  ctx.restore();
  text('دو ایمپلنت مجاور',0,-205,34,700,'#c7d7ff');
  ctx.restore();
}

/* ---------- the two options ---------- */
function option(cx,cy,label,joined,a,pick){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(cx,cy);const k=1+.05*pick;ctx.scale(k,k);
  rr(-200,-170,400,340,30);ctx.fillStyle=pick>0?`rgba(29,75,184,${.55+.35*pick})`:'rgba(15,37,82,.9)';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=pick>0?`rgba(157,188,255,${.6+.4*pick})`:'rgba(120,150,220,.45)';ctx.stroke();
  // gum line + two crowns
  ctx.strokeStyle='rgba(157,188,255,.35)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-150,60);ctx.lineTo(150,60);ctx.stroke();
  ctx.fillStyle='rgba(235,242,255,.85)';[-62,62].forEach(x=>{rr(x-10,60,20,60,4);ctx.fill()});
  crowns(-62,62,60,.95,joined,'rgba(235,242,255,.92)',K.film);
  text(label,0,-120,46,900,'#fff');
  ctx.restore();
}

/* ---------- the phone with the DentCast page: headings only, the prose stays blurred ---------- */
const HEADS=[['۱','تحلیل استخوان اطراف ایمپلنت'],['۲','بقای ایمپلنت'],['۳','عوارض مکانیکی'],['۴','اکلوژن و براکسیسم'],['۵','ایمپلنت‌های پتریگوئید و توبروزیتی'],['۶','گیر غذایی، مثلث سیاه و بهداشت'],['','جمع‌بندی: یک مسیر تصمیم ساده'],['','منابع']];
function phone(t){
  const a=seg(t,9.9,10.5)*(1-seg(t,16.3,16.8));if(a<=0)return;
  ctx.save();ctx.fillStyle=`rgba(3,11,29,${.7*a})`;ctx.fillRect(0,0,W,H);
  const k=back(seg(t,9.9,10.6));ctx.globalAlpha=a;ctx.translate(540,1000);ctx.scale(lerp(.15,1,k),lerp(.15,1,k));ctx.rotate(lerp(-.15,0,eo(seg(t,9.9,10.6))));
  const PW=640,PH=1240;
  rr(-PW/2-18,-PH/2-18,PW+36,PH+36,70);ctx.fillStyle='#0d1730';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='rgba(157,188,255,.5)';ctx.stroke();
  rr(-PW/2,-PH/2,PW,PH,54);ctx.fillStyle='#f4f7ff';ctx.fill();
  ctx.save();rr(-PW/2,-PH/2,PW,PH,54);ctx.clip();
  // site top bar (fixed)
  ctx.fillStyle='#0b5fff';ctx.fillRect(-PW/2,-PH/2,PW,110);
  text('DentCast',PW/2-40,-PH/2+64,34,800,'#fff',1,'right');
  ctx.save();ctx.translate(-PW/2+60,-PH/2+64);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,14,0,6.283);ctx.stroke();ctx.beginPath();ctx.moveTo(10,10);ctx.lineTo(20,20);ctx.stroke();ctx.restore();
  // scrolling article
  const scroll=eio(seg(t,12.0,15.6))*1050;
  ctx.save();ctx.beginPath();ctx.rect(-PW/2,-PH/2+110,PW,PH-110);ctx.clip();ctx.translate(0,-scroll);
  let y=-PH/2+170;const R=PW/2-44;
  text('Share Hub',R,y,26,800,'#0b5fff',1,'right');y+=62;
  text('روکش‌های ایمپلنت‌های مجاور را',R,y,40,900,'#0b1f4d',1,'right');y+=56;
  text('اسپلینت کنیم یا جدا بگذاریم؟',R,y,40,900,'#0b1f4d',1,'right');y+=64;
  // the evidence chip (the reader sees that there is evidence, not what it says)
  ctx.save();ctx.font=`700 24px ${FF}`;const cwid=ctx.measureText('۵ مرور سیستماتیک').width+40;
  rr(R-cwid,y-22,cwid,44,22);ctx.fillStyle='rgba(52,195,143,.16)';ctx.fill();ctx.strokeStyle='rgba(52,160,120,.6)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  text('۵ مرور سیستماتیک',R-20,y+1,24,700,'#1d7a57',1,'right');y+=60;
  const blur=(n)=>{for(let i=0;i<n;i++){const w=(PW-88)*(i===n-1?.55:.92-((i*37)%11)/100);rr(R-w,y-7,w,14,7);ctx.fillStyle='rgba(120,135,170,.28)';ctx.fill();y+=30}};
  blur(4);y+=24;
  HEADS.forEach((h,i)=>{
    const hy=y;const sy=hy-scroll;              // where it sits inside the phone
    const lit=clamp(1-Math.abs(sy-(-80))/260);
    ctx.save();if(lit>0){rr(-PW/2+24,hy-34,PW-48,68,16);ctx.fillStyle=`rgba(11,95,255,${.1*lit})`;ctx.fill()}ctx.restore();
    const hc=lit>.5?'#0b5fff':'#0b1f4d';
    ctx.beginPath();ctx.moveTo(R-11,hy-11);ctx.lineTo(R,hy+9);ctx.lineTo(R-22,hy+9);ctx.closePath();ctx.strokeStyle='#0b5fff';ctx.lineWidth=3.5;ctx.lineJoin='round';ctx.stroke();
    let tx=R-38;
    if(h[0]){ctx.beginPath();ctx.arc(tx-17,hy,19,0,6.283);ctx.fillStyle=lit>.5?'#0b5fff':'rgba(11,31,77,.12)';ctx.fill();
      text(h[0],tx-17,hy+2,24,800,lit>.5?'#fff':'#0b1f4d');tx-=48}
    text(h[1],tx,hy,i===4||i===5?28:31,800,hc,1,'right');y+=56;blur(i===7?2:3);y+=26});
  ctx.restore();
  ctx.restore();
  // a thumb that scrolls
  const th=seg(t,11.6,12.0)*(1-seg(t,15.6,16.0));
  if(th>0){const ty=lerp(300,-200,eio(seg(t,12.0,15.6))%1);ctx.beginPath();ctx.arc(140,ty,36,0,6.283);ctx.fillStyle=`rgba(11,31,77,${.25*th})`;ctx.fill();
    ctx.beginPath();ctx.arc(140,ty,52,0,6.283);ctx.strokeStyle=`rgba(11,31,77,${.18*th})`;ctx.lineWidth=4;ctx.stroke()}
  ctx.restore();
}

/* ---------- captions ---------- */
const CAPS=[
  [4.4,6.3,'اسپلینت کنم یا جدا؟',84],
  [6.4,8.1,'کدومش علمی‌تره؟',84],
  [8.4,9.9,'صبر کن… اینو خوندم!',72],
  [10.5,12.0,'دنت‌کست · Share Hub',60],
  [16.8,18.6,'حالا با دلیل تصمیم می‌گیرم.',62],
];

/* ---------- one frame ---------- */
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  bg(t);
  const endA=seg(t,18.7,19.3);
  if(endA<1){
    const sceneA=1;
    room(sceneA);
    // dentist (left) and patient (right)
    const pw=eio(seg(t,0.9,2.8));
    const px=lerp(1000,700,pw);
    const doubt=seg(t,4.4,4.8)*(1-seg(t,8.2,8.5));
    const look=doubt*Math.sin(t*3.6);
    const idea=seg(t,8.2,8.5);
    figure(320,1690,1.15,{coat:1,look:lerp(look,.5,seg(t,16.6,17)),tilt:doubt*.14*Math.sin(t*2.1),
      mood:Math.max(seg(t,8.3,8.6)*(1-seg(t,9.0,9.3)),seg(t,16.6,17.0)),
      phone:seg(t,9.2,9.7)*(1-seg(t,16.3,16.7)),glow:.5+.5*Math.sin(t*9),
      up:seg(t,8.25,8.45)*(1-seg(t,9.0,9.3))});
    figure(px,1690,1.0,{color:K.pat,walk:seg(t,0.9,1.1)*(1-seg(t,2.6,2.8)),phase:t*6.5,look:-.6,
      hold:seg(t,1.0,1.4)*(1-seg(t,2.9,3.2)),mood:seg(t,17.0,17.4)});
    // film flies from the patient's hand up to the light box / panel
    const fly=seg(t,2.9,3.3);
    if(fly>0&&fly<1){ctx.save();const fx=lerp(700,540,eo(fly)),fy=lerp(1510,560,eo(fly));ctx.translate(fx,fy);ctx.scale(lerp(1,3,fly),lerp(1,3,fly));
      rr(-46,-30,92,60,6);ctx.fillStyle=K.film;ctx.fill();ctx.restore()}
    // radiograph + options
    const ra=seg(t,3.0,3.3)*(1-seg(t,9.6,10.0));
    radiograph(t,ra);
    const oa=seg(t,4.0,4.5)*(1-seg(t,9.6,10.0));
    const sway=doubt*Math.sin(t*3.6);
    option(760,1050,'اسپلینت',true,oa*back(seg(t,4.0,4.6)),clamp(sway));
    option(320,1050,'جدا',false,oa*back(seg(t,4.15,4.75)),clamp(-sway));
    // question marks
    [[4.6,-60],[5.3,50],[5.9,-20],[6.6,70],[7.2,-80]].forEach(([s0,dx],i)=>{
      const u=seg(t,s0,s0+1.6);if(u<=0||u>=1)return;const kk=back(seg(t,s0,s0+.35));
      ctx.save();ctx.translate(320+dx,1390-u*130);ctx.scale(kk,kk);ctx.rotate(i%2?.2:-.2);
      text('؟',0,0,84+i*5,900,i%2?K.blueL:K.ink,1-seg(u,.6,1));ctx.restore()});
    // the idea

const playBtn=document.getElementById('play'),scrub=document.getElementById('scrub'),clock=document.getElementById('clock');
